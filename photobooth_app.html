<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Photobooth Kiosk</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Pacifico&family=Bebas+Neue&family=Monoton&display=swap" rel="stylesheet" />

  <style>
    * {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      font-family: 'Poppins', sans-serif;
      color: #f8fafc;
    }

    /* Shutter Flash Animation */
    @keyframes flashAnim {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
    .flash-overlay {
      animation: flashAnim 0.4s ease-out forwards;
    }

    /* Print Styles: Hide UI and print only the active strip canvas */
    @media print {
      body * {
        visibility: hidden !important;
      }
      #printContainer, #printContainer * {
        visibility: visible !important;
      }
      #printContainer {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        height: auto !important;
        display: flex !important;
        justify-content: center !important;
        align-items: flex-start !important;
        background: white !important;
      }
      #printContainer img {
        max-width: 100% !important;
        height: auto !important;
      }
    }
  </style>
</head>
<body class="w-full h-[100dvh] flex flex-col justify-between overflow-hidden bg-slate-950 text-slate-100">

  <!-- MAIN KIOSK VIEWPORT CONTAINER -->
  <main class="w-full h-full flex flex-col justify-between items-center relative overflow-hidden p-3">

    <!-- STEP 1: LAYOUT SELECTION (FULLSCREEN KIOSK SCREEN) -->
    <section id="step-layout" class="w-full h-full flex flex-col justify-between items-center text-center">
      <div class="pt-4 flex flex-col items-center">
        <span class="px-3 py-1 bg-pink-500/20 text-pink-400 rounded-full text-xs font-semibold uppercase tracking-wider mb-1 border border-pink-500/30">Welcome</span>
        <h1 class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-pink-400 via-purple-400 to-indigo-400 bg-clip-text text-transparent">Select Photo Layout</h1>
        <p class="text-xs text-slate-400">Choose a layout format for your session</p>
      </div>

      <!-- Scrollable Grid inside constrained screen -->
      <div class="grid grid-cols-2 gap-3 w-full max-w-sm my-auto px-2 overflow-y-auto max-h-[65dvh]">
        
        <!-- 2x2 Grid -->
        <button onclick="selectLayout('2x2')" class="flex flex-col items-center justify-center p-3 bg-slate-900 border-2 border-slate-800 hover:border-pink-500 rounded-2xl transition-all active:scale-95 group shadow-lg">
          <div class="w-20 h-24 bg-slate-950 p-1.5 rounded-lg border border-slate-700 grid grid-cols-2 gap-1 mb-2 group-hover:border-pink-400">
            <div class="bg-slate-800 rounded"></div>
            <div class="bg-slate-800 rounded"></div>
            <div class="bg-slate-800 rounded"></div>
            <div class="bg-slate-800 rounded"></div>
          </div>
          <span class="text-xs font-bold text-slate-200 group-hover:text-pink-400">2x2 Grid</span>
          <span class="text-[10px] text-slate-400">4 Photos</span>
        </button>

        <!-- 1x3 Trio Strip -->
        <button onclick="selectLayout('1x3')" class="flex flex-col items-center justify-center p-3 bg-slate-900 border-2 border-slate-800 hover:border-pink-500 rounded-2xl transition-all active:scale-95 group shadow-lg">
          <div class="w-14 h-24 bg-slate-950 p-1.5 rounded-lg border border-slate-700 flex flex-col gap-1 mb-2 group-hover:border-pink-400">
            <div class="bg-slate-800 rounded flex-1"></div>
            <div class="bg-slate-800 rounded flex-1"></div>
            <div class="bg-slate-800 rounded flex-1"></div>
          </div>
          <span class="text-xs font-bold text-slate-200 group-hover:text-pink-400">1x3 Strip</span>
          <span class="text-[10px] text-slate-400">3 Photos</span>
        </button>

        <!-- 1x4 Classic Strip -->
        <button onclick="selectLayout('1x4')" class="flex flex-col items-center justify-center p-3 bg-slate-900 border-2 border-slate-800 hover:border-pink-500 rounded-2xl transition-all active:scale-95 group shadow-lg">
          <div class="w-12 h-24 bg-slate-950 p-1 rounded-lg border border-slate-700 flex flex-col gap-1 mb-2 group-hover:border-pink-400">
            <div class="bg-slate-800 rounded flex-1"></div>
            <div class="bg-slate-800 rounded flex-1"></div>
            <div class="bg-slate-800 rounded flex-1"></div>
            <div class="bg-slate-800 rounded flex-1"></div>
          </div>
          <span class="text-xs font-bold text-slate-200 group-hover:text-pink-400">1x4 Classic</span>
          <span class="text-[10px] text-slate-400">4 Strip Shots</span>
        </button>

        <!-- Single Postcard -->
        <button onclick="selectLayout('single')" class="flex flex-col items-center justify-center p-3 bg-slate-900 border-2 border-slate-800 hover:border-pink-500 rounded-2xl transition-all active:scale-95 group shadow-lg">
          <div class="w-20 h-24 bg-slate-950 p-1.5 rounded-lg border border-slate-700 flex flex-col mb-2 group-hover:border-pink-400">
            <div class="bg-slate-800 rounded w-full h-full"></div>
          </div>
          <span class="text-xs font-bold text-slate-200 group-hover:text-pink-400">Single Portrait</span>
          <span class="text-[10px] text-slate-400">1 Big Frame</span>
        </button>

      </div>

      <div class="pb-3 text-slate-500 text-[10px]">
        Tap layout to start camera session
      </div>
    </section>

    <!-- STEP 2: LIVE CAMERA CAPTURE -->
    <section id="step-capture" class="hidden w-full h-full flex-col justify-between items-center text-center">
      <!-- Top Info -->
      <div class="w-full flex justify-between items-center px-2 py-1">
        <button onclick="resetApp()" class="text-xs text-slate-400 hover:text-white flex items-center gap-1">
          <i class="fa-solid fa-arrow-left"></i> Back
        </button>
        <span id="capture-status-text" class="text-xs font-semibold text-pink-400">Shot 1 of 4</span>
        <button onclick="toggleCameraFacing()" class="text-xs text-slate-400 hover:text-white">
          <i class="fa-solid fa-rotate"></i>
        </button>
      </div>

      <!-- Camera Viewport Box -->
      <div class="relative w-full max-w-xs aspect-[3/4] bg-slate-900 rounded-2xl overflow-hidden border-2 border-slate-800 shadow-2xl flex items-center justify-center my-auto">
        <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>
        
        <!-- Flash & Countdown Overlay -->
        <div id="flash" class="absolute inset-0 bg-white opacity-0 pointer-events-none"></div>
        <div id="countdown" class="absolute inset-0 flex items-center justify-center text-7xl font-extrabold text-white drop-shadow-lg hidden">3</div>
      </div>

      <!-- Action Footer -->
      <div class="w-full max-w-xs pb-3 flex flex-col gap-2">
        <button id="btn-start-capture" onclick="startCaptureSequence()" class="w-full py-3.5 bg-gradient-to-r from-pink-500 to-indigo-600 rounded-xl font-bold text-sm tracking-wide shadow-lg shadow-pink-500/20 active:scale-95 transition-transform flex items-center justify-center gap-2">
          <i class="fa-solid fa-camera"></i> Start Photo Shoot
        </button>
      </div>
    </section>

    <!-- STEP 3: CUSTOMIZE & PREVIEW STAGE -->
    <section id="step-customize" class="hidden w-full h-full flex-col justify-between items-center">
      <!-- Top Mini Nav -->
      <div class="w-full flex justify-between items-center px-2 py-1">
        <button onclick="retakePhotos()" class="text-xs text-slate-400 hover:text-white flex items-center gap-1">
          <i class="fa-solid fa-arrows-rotate"></i> Retake
        </button>
        <span class="text-xs font-semibold text-indigo-400">Customize Photo Strip</span>
        <div class="w-8"></div>
      </div>

      <!-- Main Dynamic Canvas Container -->
      <div class="flex-1 w-full flex items-center justify-center p-1 overflow-hidden">
        <canvas id="photoCanvas" class="max-h-full max-w-full rounded-lg shadow-2xl border border-slate-800 object-contain"></canvas>
      </div>

      <!-- Customization Tool Tabs -->
      <div class="w-full max-w-sm flex flex-col gap-2 pb-2">
        <!-- Scrollable Preset Selector -->
        <div class="flex gap-2 overflow-x-auto py-1 px-1 no-scrollbar text-xs">
          <!-- Filter Buttons -->
          <button onclick="setFilter('none')" class="px-3 py-1.5 bg-slate-800 border border-slate-700 rounded-lg shrink-0 font-medium active:scale-95">Normal</button>
          <button onclick="setFilter('grayscale(100%)')" class="px-3 py-1.5 bg-slate-800 border border-slate-700 rounded-lg shrink-0 font-medium active:scale-95">B&W</button>
          <button onclick="setFilter('sepia(80%)')" class="px-3 py-1.5 bg-slate-800 border border-slate-700 rounded-lg shrink-0 font-medium active:scale-95">Sepia</button>
          <button onclick="setFilter('contrast(125%) saturate(130%)')" class="px-3 py-1.5 bg-slate-800 border border-slate-700 rounded-lg shrink-0 font-medium active:scale-95">Vibrant</button>
          <button onclick="setFilter('hue-rotate(180deg)')" class="px-3 py-1.5 bg-slate-800 border border-slate-700 rounded-lg shrink-0 font-medium active:scale-95">Cyberpunk</button>
        </div>

        <!-- Frame Colors -->
        <div class="flex justify-between items-center bg-slate-900 p-2 rounded-xl border border-slate-800">
          <span class="text-[11px] text-slate-400 font-medium">Frame Color:</span>
          <div class="flex gap-2">
            <button onclick="setFrameColor('#ffffff')" class="w-6 h-6 rounded-full bg-white border border-slate-400"></button>
            <button onclick="setFrameColor('#000000')" class="w-6 h-6 rounded-full bg-black border border-slate-700"></button>
            <button onclick="setFrameColor('#f472b6')" class="w-6 h-6 rounded-full bg-pink-400"></button>
            <button onclick="setFrameColor('#818cf8')" class="w-6 h-6 rounded-full bg-indigo-400"></button>
            <button onclick="setFrameColor('#fef08a')" class="w-6 h-6 rounded-full bg-yellow-200"></button>
          </div>
        </div>

        <!-- Action Button -->
        <button onclick="finalizeAndPrint()" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-600 rounded-xl font-bold text-sm shadow-lg shadow-emerald-500/20 active:scale-95 transition-transform flex items-center justify-center gap-2">
          <i class="fa-solid fa-print"></i> Finalize & Print Photo Strip
        </button>
      </div>
    </section>

    <!-- STEP 4: PRINT & QR DISPLAY SCREEN (PERSISTENT FINISH) -->
    <section id="step-finish" class="hidden w-full h-full flex-col justify-between items-center text-center p-2">
      <div class="pt-2">
        <h2 class="text-xl font-extrabold text-emerald-400">Photo Strip Ready!</h2>
        <p class="text-xs text-slate-400">Saved locally & sending to print queue</p>
      </div>

      <!-- Preview Image -->
      <div id="printContainer" class="flex-1 w-full flex items-center justify-center p-2 overflow-hidden my-auto">
        <img id="finalStripImage" src="" alt="Final Strip" class="max-h-[50dvh] rounded-lg shadow-2xl border border-slate-800 object-contain" />
      </div>

      <!-- QR & Action Controls -->
      <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl p-3 flex flex-col items-center gap-2">
        <div class="flex items-center gap-3 w-full">
          <!-- QR Code Container -->
          <div id="qrcode" class="p-1.5 bg-white rounded-lg shrink-0"></div>
          <div class="text-left flex-1">
            <span class="text-xs font-bold text-slate-200 block">Scan to Copy / Save</span>
            <span class="text-[10px] text-slate-400 leading-tight block">Use phone camera to open image directly or save to library.</span>
          </div>
        </div>

        <div class="flex gap-2 w-full mt-1">
          <button onclick="triggerPrinter()" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-print"></i> Print Again
          </button>
          <button onclick="resetApp()" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-plus"></i> New Session
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- APP LOGIC & CANVAS STITCHER SCRIPT -->
  <script>
    // State variables
    let currentLayout = '1x4';
    let capturedPhotos = [];
    let requiredPhotoCount = 4;
    let currentFilter = 'none';
    let currentFrameColor = '#ffffff';
    let facingMode = 'user';
    let mediaStream = null;

    // Elements
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('photoCanvas');
    const ctx = canvas.getContext('2d');

    // Layout selector mapping
    function selectLayout(layout) {
      currentLayout = layout;
      switch (layout) {
        case '2x2': requiredPhotoCount = 4; break;
        case '1x3': requiredPhotoCount = 3; break;
        case '1x4': requiredPhotoCount = 4; break;
        case 'single': requiredPhotoCount = 1; break;
      }
      document.getElementById('step-layout').classList.add('hidden');
      document.getElementById('step-capture').classList.remove('hidden');
      document.getElementById('step-capture').classList.add('flex');
      initCamera();
    }

    // Initialize WebRTC Camera
    async function initCamera() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 960 } },
          audio: false
        });
        video.srcObject = mediaStream;
      } catch (err) {
        alert("Camera access denied or unreadable: " + err.message);
      }
    }

    function toggleCameraFacing() {
      facingMode = facingMode === 'user' ? 'environment' : 'user';
      initCamera();
    }

    // Capture Timer & Shoot Sequence
    async function startCaptureSequence() {
      capturedPhotos = [];
      const btn = document.getElementById('btn-start-capture');
      btn.disabled = true;
      btn.classList.add('opacity-50');

      for (let i = 0; i < requiredPhotoCount; i++) {
        document.getElementById('capture-status-text').innerText = `Shot ${i + 1} of ${requiredPhotoCount}`;
        await runCountdown(3);
        triggerFlash();
        snapPhoto();
        await new Promise(r => setTimeout(r, 800));
      }

      btn.disabled = false;
      btn.classList.remove('opacity-50');
      
      // Stop webcam stream when done
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }

      // Switch to customize screen
      document.getElementById('step-capture').classList.add('hidden');
      document.getElementById('step-capture').classList.remove('flex');
      document.getElementById('step-customize').classList.remove('hidden');
      document.getElementById('step-customize').classList.add('flex');
      
      renderCanvas();
    }

    function runCountdown(seconds) {
      return new Promise(resolve => {
        const countdownEl = document.getElementById('countdown');
        countdownEl.classList.remove('hidden');
        let count = seconds;
        countdownEl.innerText = count;

        const timer = setInterval(() => {
          count--;
          if (count > 0) {
            countdownEl.innerText = count;
          } else {
            clearInterval(timer);
            countdownEl.classList.add('hidden');
            resolve();
          }
        }, 800);
      });
    }

    function triggerFlash() {
      const flash = document.getElementById('flash');
      flash.classList.add('flash-overlay');
      setTimeout(() => flash.classList.remove('flash-overlay'), 400);
    }

    function snapPhoto() {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = video.videoWidth || 640;
      tempCanvas.height = video.videoHeight || 480;
      const tCtx = tempCanvas.getContext('2d');

      // Mirror mode if front camera
      if (facingMode === 'user') {
        tCtx.translate(tempCanvas.width, 0);
        tCtx.scale(-1, 1);
      }
      tCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
      capturedPhotos.push(tempCanvas);
    }

    // Canvas Rendering & Customization
    function setFilter(filterStyle) {
      currentFilter = filterStyle;
      renderCanvas();
    }

    function setFrameColor(color) {
      currentFrameColor = color;
      renderCanvas();
    }

    function renderCanvas() {
      if (capturedPhotos.length === 0) return;

      const singleWidth = 600;
      const singleHeight = 450;
      const padding = 30;
      const headerHeight = 20;
      const footerHeight = 100;

      let cols = 1;
      let rows = requiredPhotoCount;

      if (currentLayout === '2x2') {
        cols = 2;
        rows = 2;
      } else if (currentLayout === 'single') {
        cols = 1;
        rows = 1;
      }

      const canvasWidth = (singleWidth * cols) + (padding * (cols + 1));
      const canvasHeight = (singleHeight * rows) + (padding * (rows + 1)) + headerHeight + footerHeight;

      canvas.width = canvasWidth;
      canvas.height = canvasHeight;

      // Frame background
      ctx.fillStyle = currentFrameColor;
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);

      // Render photos with active filter
      capturedPhotos.forEach((photoCanvas, idx) => {
        const r = Math.floor(idx / cols);
        const c = idx % cols;
        const x = padding + c * (singleWidth + padding);
        const y = headerHeight + padding + r * (singleHeight + padding);

        ctx.save();
        ctx.filter = currentFilter;
        ctx.drawImage(photoCanvas, x, y, singleWidth, singleHeight);
        ctx.restore();
      });

      // Photobooth Brand Footer Watermark
      ctx.fillStyle = (currentFrameColor === '#ffffff' || currentFrameColor === '#fef08a') ? '#000000' : '#ffffff';
      ctx.font = 'bold 36px Pacifico, cursive';
      ctx.textAlign = 'center';
      ctx.fillText('Photobooth Kiosk', canvasWidth / 2, canvasHeight - 45);

      const today = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      ctx.font = '600 18px Poppins, sans-serif';
      ctx.fillText(today, canvasWidth / 2, canvasHeight - 20);
    }

    // Finalize, Save Local Storage & Print Screen Trigger
    function finalizeAndPrint() {
      const dataUrl = canvas.toDataURL('image/png');

      // Save to localStorage
      try {
        localStorage.setItem('photobooth_latest_strip', dataUrl);
        const existing = JSON.parse(localStorage.getItem('photobooth_saved_strips') || '[]');
        existing.push({ date: new Date().toISOString(), image: dataUrl });
        localStorage.setItem('photobooth_saved_strips', JSON.stringify(existing));
      } catch (e) {
        console.warn("Storage full or constrained:", e);
      }

      // Display Final Image
      const finalImg = document.getElementById('finalStripImage');
      finalImg.src = dataUrl;

      // Generate QR Code
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';
      new QRCode(qrContainer, {
        text: dataUrl,
        width: 84,
        height: 84,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.L
      });

      // Switch view to finish screen
      document.getElementById('step-customize').classList.add('hidden');
      document.getElementById('step-customize').classList.remove('flex');
      document.getElementById('step-finish').classList.remove('hidden');
      document.getElementById('step-finish').classList.add('flex');

      // Trigger automatic printer popup
      triggerPrinter();
    }

    function triggerPrinter() {
      window.print();
    }

    function retakePhotos() {
      document.getElementById('step-customize').classList.add('hidden');
      document.getElementById('step-customize').classList.remove('flex');
      document.getElementById('step-capture').classList.remove('hidden');
      document.getElementById('step-capture').classList.add('flex');
      initCamera();
    }

    function resetApp() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }
      capturedPhotos = [];
      document.getElementById('step-capture').classList.add('hidden');
      document.getElementById('step-customize').classList.add('hidden');
      document.getElementById('step-finish').classList.add('hidden');
      document.getElementById('step-layout').classList.remove('hidden');
    }
  </script>

</body>
</html>
