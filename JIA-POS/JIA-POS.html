function prnErr(e){const n=e&&e.name,m=String((e&&e.message)||'');
 if(n==='NotFoundError'&&/cancel|chosen|selected/i.test(m))return'No printer was selected.';
 if(n==='NotAllowedError'||n==='SecurityError')return'Bluetooth permission is blocked. Allow Bluetooth for this site in your browser settings, then try again.';
 if(n==='NetworkError')return'Could not connect. Make sure the printer is on, nearby and not connected to another phone.';
 if(n==='NotFoundError')return'No printer found. Turn it on and keep it close.';
 return m||'Could not print.'}

async function prnConnect(dev){
 if(!dev._jia){dev._jia=1;dev.addEventListener('gattserverdisconnected',()=>{PRN.ch=null;prnUI()})}
 const srv=await dev.gatt.connect();let ch=null,best=0;
 for(const sv of await srv.getPrimaryServices()){let cs=[];try{cs=await sv.getCharacteristics()}catch(e){}
  for(const c of cs){const pr=c.properties,sc=pr.writeWithoutResponse?2:(pr.write?1:0);if(sc>best){best=sc;ch=c}}}
 if(!ch)throw Error('This printer does not accept data over Bluetooth Low Energy. Classic Bluetooth printers cannot be used from a browser.');
 PRN.dev=dev;PRN.ch=ch;PRN.wnr=!!ch.properties.writeWithoutResponse&&!!ch.writeValueWithoutResponse;
 PP.id=dev.id||'';PP.name=dev.name||PP.name||'Printer';savePP();prnUI()}
async function prnPick(){

 catch(e){toast(prnErr(e))}}
async function prnEnsure(ask){
 if(prnLive())return true;
 if(PRN.dev){try{await prnConnect(PRN.dev);return true}catch(e){}}
 if(navigator.bluetooth&&navigator.bluetooth.getDevices&&PP.id){try{const d=(await navigator.bluetooth.getDevices()).find(x=>x.id===PP.id);if(d){await prnConnect(d);return true}}catch(e){}}
 if(!ask)return false;
 const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:BT_SVC});await prnConnect(dev);return true}
async function prnSend(bytes){
 const go=async sz=>{for(let i=0;i<bytes.length;i+=sz){const part=bytes.slice(i,i+sz);if(PRN.wnr)await PRN.ch.writeValueWithoutResponse(part);else await PRN.ch.writeValue(part);await new Promise(r=>setTimeout(r,25))}};
 try{await go(PRN.chunk)}catch(e){if(PRN.chunk>20){PRN.chunk=20;await go(20)}else throw e}}
const asc=t=>String(t==null?'':t).replace(/₱/g,'P').replace(/[−–—]/g,'-').replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/[\u00a0\u202f]/g,' ').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7e]/g,'?');
function wrapT(t,W){t=asc(t);const o=[];while(t.length>W){let k=t.lastIndexOf(' ',W);if(k<W*.4)k=W;o.push(t.slice(0,k).trimEnd());t=t.slice(k).trimStart()}o.push(t);return o}
function escpos(s){const W=PP.width||32,b=[],raw=(...a)=>a.forEach(x=>b.push(x)),ln=t=>{for(const c of asc(t))b.push(c.charCodeAt(0));b.push(10)},fa=n=>asc(fmt(n));
 const lr=(l,r)=>{l=asc(l);r=asc(r);if(l.length+r.length+1>W){const w=wrapT(l,Math.max(8,W-r.length-1));w.forEach((x,i)=>i<w.length-1?ln(x):ln(x+' '.repeat(Math.max(1,W-x.length-r.length))+r));return}ln(l+' '.repeat(W-l.length-r.length)+r)};
 const hr=()=>ln('-'.repeat(W)),al=n=>raw(27,97,n),bd=on=>raw(27,69,on?1:0);
 raw(27,64);al(1);bd(1);wrapT(biz()||'JIA-POS',W).forEach(ln);bd(0);if(SET.addr)wrapT(SET.addr,W).forEach(ln);if(SET.tin)ln('TIN: '+SET.tin);al(0);hr();
 wrapT(s.inv+(s.customer?' - '+s.customer:''),W).forEach(ln);ln(new Date(s.tsMs).toLocaleString('en-PH'));ln('Cashier: '+(s.cashierName||''));
 if(s.voided)ln('*** VOID ***');if(s.pending)ln('OFFLINE SALE - syncs when online');hr();
 (s.items||[]).forEach(l=>{wrapT(l.name,W).forEach(ln);lr('  '+l.qty+' x '+fa(l.price),fa(l.qty*l.price))});hr();
 lr('Subtotal',fa(s.sub));lr('Discount','-'+fa(s.d));lr('VAT',fa(s.vat));bd(1);lr('TOTAL',fa(s.total));bd(0);lr(s.method||'',fa(s.tendered));lr('Change',fa(Math.max(0,s.tendered-s.total)));hr();
 al(1);wrapT(SET.foot||'',W).forEach(ln);al(0);raw(10,10,10);if(W>=48)raw(29,86,66,0);
 return Uint8Array.from(b)}
async function prnReceipt(s,quiet){
 if(!s)return;if(!btOK()){if(!quiet)toast('Bluetooth printing needs Chrome or Edge on Android or a computer.');return}

 try{if(!quiet)toast('Printing...');const ok=await prnEnsure(!quiet);if(!ok){toast('Printer not connected. Open Settings to connect it.');return}await prnSend(escpos(s));if(!quiet)toast('Receipt printed')}

/* Uploads go through a free Cloudflare Worker that holds the GitHub token; no token or repo details exist in this app. */
const UPLOAD_URL='PASTE_YOUR_WORKER_URL_HERE';
const ghCfg=()=>U?{}:null;
try{localStorage.removeItem('jia-gh')}catch(e){}
async function ghPost(body){if(!/^https:/.test(UPLOAD_URL))throw new Error('Upload is not set up yet. Please contact the administrator.');if(!navigator.onLine)throw new Error('You are offline. Connect to the internet to upload.');
 const t=await auth.currentUser.getIdToken(),r=await fetch(UPLOAD_URL,{method:'POST',headers:{'Authorization':'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(body)});
 let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||('Upload failed ('+r.status+')'));return j}
const ghCall=(kind,b64,name)=>ghPost({action:'upload',kind,b64,name});
function imgToJpeg(file,M0,q0){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{const M=M0||900,k=Math.min(1,M/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(im.width*k));cv.height=Math.max(1,Math.round(im.height*k));
  const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);res(cv.toDataURL('image/jpeg',q0||.82))};
 im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('That file is not a readable image.'))};im.src=u})}
const WORKER=()=>/^https:/.test(UPLOAD_URL);
function shrinkJpeg(d,M,q){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=()=>rej(new Error('That file is not a readable image.'));im.src=d})}
/* With the upload Worker set up, photos go to GitHub. Without it, photos are shrunk and saved inside the product record itself (free, no setup). */
async function ghUpload(dataUrl){if(WORKER())return (await ghCall('image',dataUrl.split(',')[1],'photo.jpg')).url;
 for(const [M,q] of [[560,.7],[440,.6],[340,.55]]){const d=await shrinkJpeg(dataUrl,M,q);if(d.length<90000)return d}throw new Error('That photo is too detailed. Try a smaller photo.')}

async function tStatus(id,s){try{await tUp(id,{status:s,history:hi('Status: '+s)})}catch(e){toast(fmsg(e))}}
function tReg(id){const t=TK.find(x=>x.id===id);if(!t)return;const miss=[];cart=[];
 (t.items||[]).forEach(i=>{
  if(i.pre){cart.push({...i});return}
  if(i.comps){const k=PK.find(x=>x.id===i.pk),its=k?k.items:i.comps;let ok=true;its.forEach(c=>{const p=P.find(x=>x.id===c.id);if(!p||(trk(p)&&stk(p)<c.qty*i.qty))ok=false});
   if(!ok){miss.push(i.name);return}cart.push({id:i.id,pk:i.pk,name:i.name,price:k?Number(k.price):i.price,qty:i.qty,comps:its.map(c=>({id:c.id,name:c.name,qty:c.qty}))});return}
  const p=P.find(x=>x.id===i.id);if(!p){miss.push(i.name);return}const q=trk(p)?Math.min(i.qty,stk(p)):i.qty;if(q>0)cart.push({id:p.id,name:p.name,price:Number(p.price),qty:q});if(q<i.qty)miss.push(i.name)});

 if(miss.length)toast('Not enough stock for: '+miss.join(', '));if(t.status==='Pending')tStatus(id,'In progress')}

 try{await tUp(id,{assignee:to,assigneeName:nm,previousAssignee:t.assignee,transferNote:note,status:'Pending',history:hi('Transferred',{from:t.assignee,fromName:t.assigneeName||who(t.assignee),to,toName:nm,note})});closeM();toast('Task transferred to '+nm)}catch(e){toast(fmsg(e))}}

 let team=ST.filter(s=>act(s)&&(!biz||s.business===biz));if(!team.length)team=ST.filter(act);if(!team.length)team=[{email:me(),name:'Owner'}];

 const ref=db.collection('tasks').doc(t.id),cr=db.collection('counters').doc((me()+'_rr_'+(biz||'all')).replace(/[^\w]/g,'_'));
 await db.runTransaction(async tx=>{const ts=await tx.get(ref);if(!ts.exists||ts.data().assignee)return;const cs=await tx.get(cr),n=cs.exists?(cs.data().next||0):0,p=team[n%team.length];

/* alerts: banner + sound + vibration */
let AC=null;const unlock=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}};
['click','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,unlock,{passive:true}));
function beep(kind){if(!AC||SET.mute)return;const t0=AC.currentTime,seq=kind==='scan'?[1300]:kind==='order'?[880,660,880]:kind==='msg'?[740,988]:[660,880];
 seq.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(AC.destination);const s=t0+i*.17;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.3,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.16);o.start(s);o.stop(s+.17)})}
function notify(kind,title,body,go){beep(kind);try{if(!SET.mute&&navigator.vibrate)navigator.vibrate([120,60,120])}catch(e){}
 const n=$('nt');n.innerHTML='<b>'+esc(title)+'</b><span>'+esc(body)+'</span>';n.onclick=()=>{n.className='';go&&go()};n.className='show';clearTimeout(notify.t);notify.t=setTimeout(()=>{n.className=''},7000)}

const markSeen=r=>{try{const m=seenMap();let t=Date.now();M.forEach(x=>{if(inRoom(x,r)){const v=mt(x);if(v>t)t=v}});m[r]=t;localStorage.setItem('jia-ms2-'+U.email,JSON.stringify(m))}catch(e){}};

  +(chan===CEN?`<div class="mu" style="padding:0 14px 6px;font-size:12px">Business owners only. System is the super admin. Messages are kept 30 days.${prem()?'':' <span class="lockn">Images and polls need Premium.</span>'}</div>`:chan===SUP?'<div class="mu" style="padding:0 14px 6px;font-size:12px">Support. Please attach a screenshot for bug reports. This chat stays until support clears it.</div>':'<div class="mu" style="padding:0 14px 6px;font-size:12px">'+(prem()?'Team chat is kept for 15 days.':'Team chat is deleted after 1 day. Premium keeps it 15 days.')+'</div>');
 $('cpp').classList.toggle('hide',chan===SUP);$('cpd').classList.toggle('hide',chan!==CEN);msgLog()}

const canAdd=()=>isMgr()||U.canAddProducts===true;
async function togChat(id){const s=ST.find(x=>x.id===id);if(!s)return;try{await db.collection('staff').doc(id).update({chatEnabled:s.chatEnabled===false})}catch(e){toast(fmsg(e))}}
function hdr(){const t=document.querySelector('#main .top');document.documentElement.style.setProperty('--hdr',(t&&getComputedStyle(t).position==='sticky'?t.offsetHeight:0)+'px')}
function fitTables(){document.querySelectorAll('#main table').forEach(tb=>{const r0=tb.querySelector('tr');if(!r0)return;const h=[...r0.children].map(x=>x.textContent.trim());r0.classList.add('th');tb.classList.add('rt');tb.querySelectorAll('tr').forEach(r=>{if(r!==r0)[...r.children].forEach((c,i)=>{c.dataset.l=h[i]||''})})})}
/* barcode scanner: native BarcodeDetector when available, ZXing fallback otherwise */
let SCM=null,scStream=null,scLoop=0,scReader=null,scLast='',scLastT=0,scTorch=false,SCNF='';
async function scanOpen(mode,cb){SCM={mode,cb};$('sc').classList.remove('hide');$('sca').classList.add('hide');$('scs').textContent='Starting camera…';$('sct').textContent=mode==='cart'?'Scan items to add':'Scan barcode';$('scm').value='';
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('scs').textContent='The camera is not available here. Type the barcode below.';return}
 try{if('BarcodeDetector' in window)await scanNative();else await scanZX()}
 catch(e){$('scs').textContent=e&&e.name==='NotAllowedError'?'Camera permission is blocked. Allow the camera in your browser settings, or type the barcode below.':'Could not start the camera. Type the barcode below.'}}
async function scanNative(){const fm=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','code_93','itf','codabar','qr_code'];let ok=fm;try{const sp=await BarcodeDetector.getSupportedFormats();ok=fm.filter(f=>sp.includes(f))}catch(e){}
 const det=new BarcodeDetector({formats:ok});scStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
 const v=$('scv');v.srcObject=scStream;await v.play();scTorchInit();$('scs').textContent='Point the camera at a barcode';
 scLoop=setInterval(async()=>{if(v.readyState<2)return;try{const r=await det.detect(v);if(r.length)scanHit(r[0].rawValue)}catch(e){}},160)}
function loadZX(){return window.ZXing?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js';s.onload=ok;s.onerror=()=>no(Error('zx'));document.head.appendChild(s)})}
async function scanZX(){await loadZX();const Z=window.ZXing,h=new Map();h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.ITF,Z.BarcodeFormat.QR_CODE]);
 scReader=new Z.BrowserMultiFormatReader(h,200);$('scs').textContent='Point the camera at a barcode';
 await scReader.decodeFromConstraints({video:{facingMode:{ideal:'environment'}},audio:false},$('scv'),(r)=>{if(r)scanHit(r.getText())});scStream=$('scv').srcObject;scTorchInit()}
function scTorchInit(){scTorch=false;const tr=scStream&&scStream.getVideoTracks&&scStream.getVideoTracks()[0],c=tr&&tr.getCapabilities?tr.getCapabilities():{};$('sctorch').classList.toggle('hide',!(c&&c.torch))}
function scanTorch(){const tr=scStream&&scStream.getVideoTracks()[0];if(!tr)return;scTorch=!scTorch;tr.applyConstraints({advanced:[{torch:scTorch}]}).catch(()=>{})}
function scanStop(){clearInterval(scLoop);scLoop=0;try{scReader&&scReader.reset()}catch(e){}scReader=null;try{scStream&&scStream.getTracks().forEach(x=>x.stop())}catch(e){}scStream=null;try{$('scv').srcObject=null}catch(e){}$('sc').classList.add('hide');SCM=null}
function scanManual(){const v=$('scm').value.trim();$('scm').value='';if(v){scLast='';scanHit(v)}}
function scanHit(code){code=String(code||'').trim();if(!code||!SCM)return;const n=Date.now();if(code===scLast&&n-scLastT<1800)return;scLast=code;scLastT=n;
 beep('scan');try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}
 const m=SCM.mode,p=P.find(x=>String(x.barcode||'')===code);
 if(m==='field'){const cb=SCM.cb;scanStop();cb&&cb(code);return}
 if(m==='new'){scanStop();if(p){toast('Already exists: '+p.name);return}prodM('');setTimeout(()=>{const b=$('p5');if(b)b.value=code;const nm=$('p1');nm&&nm.focus()},60);return}
 if(p){add(p.id);$('sca').classList.add('hide');$('scs').textContent='Added: '+p.name+' · '+cart.reduce((a,l)=>a+l.qty,0)+' in cart'}
 else{SCNF=code;$('scs').textContent='Not found: '+code;if(canAdd()){$('sca').classList.remove('hide');$('sca').innerHTML='<button class="pri" onclick="scanAddNew()">Add as new product</button>'}}}
function scanAddNew(){const c=SCNF;scanStop();prodM('');setTimeout(()=>{const b=$('p5');if(b)b.value=c;const nm=$('p1');nm&&nm.focus()},60)}
function scanNew(){scanOpen('new')}

/* draggable floating chat button */
let cfMoved=false;
function placeCp(){const p=$('cp'),b=$('cf');if(innerWidth<=700){p.style.cssText='';return}const r=b.getBoundingClientRect(),w=Math.min(370,innerWidth-24),h=Math.min(560,innerHeight*.7);
 let x=r.left+r.width/2>innerWidth/2?r.right-w:r.left;x=Math.max(12,Math.min(innerWidth-w-12,x));let y=r.top+r.height/2>innerHeight/2?r.top-h-10:r.bottom+10;y=Math.max(12,Math.min(innerHeight-h-12,y));
 p.style.left=x+'px';p.style.top=y+'px';p.style.right='auto';p.style.bottom='auto';p.style.width=w+'px';p.style.height=h+'px'}
(function(){const b=$('cf');let sx,sy,ox,oy,drag=false,pid=null;
 const place=(x,y)=>{x=Math.max(6,Math.min(innerWidth-b.offsetWidth-6,x));y=Math.max(6,Math.min(innerHeight-b.offsetHeight-6,y));b.style.left=x+'px';b.style.top=y+'px';b.style.right='auto';b.style.bottom='auto'};
 const load=()=>{try{const p=JSON.parse(localStorage.getItem('jia-cf')||'null');if(p)place(p.x*innerWidth,p.y*innerHeight)}catch(e){}};
 b.addEventListener('pointerdown',e=>{pid=e.pointerId;sx=e.clientX;sy=e.clientY;const r=b.getBoundingClientRect();ox=r.left;oy=r.top;drag=false;cfMoved=false;try{b.setPointerCapture(pid)}catch(x){}});
 b.addEventListener('pointermove',e=>{if(pid!==e.pointerId)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!drag&&Math.hypot(dx,dy)>6){drag=true;cfMoved=true}if(drag){place(ox+dx,oy+dy);e.preventDefault()}});
 const end=e=>{if(pid!==e.pointerId)return;pid=null;if(drag){try{const r=b.getBoundingClientRect();localStorage.setItem('jia-cf',JSON.stringify({x:r.left/innerWidth,y:r.top/innerHeight}))}catch(x){}placeCp();setTimeout(()=>{cfMoved=false},80)}};
 b.addEventListener('pointerup',end);b.addEventListener('pointercancel',end);addEventListener('resize',()=>{load();placeCp()});load()})();
netUI();

document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
(function(){const h=document.documentElement;
function dev(){const w=innerWidth,hh=innerHeight,t=matchMedia('(pointer:coarse)').matches,s=Math.min(screen.width,screen.height);
 h.dataset.dev=((t&&s<600)||w<701)?'phone':((t||w<1100)?'tablet':'desktop');h.dataset.ori=w>hh?'land':'port';h.style.setProperty('--vh',(hh*0.01)+'px')}
dev();addEventListener('resize',()=>{dev();hdr()});addEventListener('orientationchange',()=>setTimeout(()=>{dev();hdr()},150));
function fs(){if(document.fullscreenElement||document.webkitFullscreenElement||navigator.standalone||matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches)return;
 const e=document.documentElement,f=e.requestFullscreen||e.webkitRequestFullscreen;if(!f)return;try{const r=f.call(e,{navigationUI:'hide'});r&&r.catch&&r.catch(()=>{})}catch(x){}}
addEventListener('pointerup',fs,{passive:true});addEventListener('keydown',fs);
})();
