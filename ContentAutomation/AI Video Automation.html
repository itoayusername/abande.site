<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Content Studio (Gemini 3.8 TTS Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d0f17; color: #f3f4f6; font-family: 'Inter', sans-serif; }
        .accent-yellow { color: #facc15; }
        .bg-accent-yellow { background-color: #facc15; }
        .glass-card { background: rgba(22, 27, 38, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="glass-card p-6 rounded-2xl flex items-center justify-between border-b border-yellow-500/25">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-accent-yellow text-black rounded-xl flex items-center justify-center text-xl font-bold shadow-lg">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-wide">AI Video Content Studio</h1>
                    <p class="text-xs text-gray-400">Powered by Gemini 3.8 Flash TTS & Imagen 3</p>
                </div>
            </div>
            <span class="px-3 py-1 bg-yellow-500/10 text-yellow-400 text-xs font-semibold rounded-full border border-yellow-500/30">
                Studio Ready
            </span>
        </header>

        <!-- API Key & Settings Bar -->
        <div class="glass-card p-4 rounded-2xl flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="w-full md:w-2/3">
                <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">Gemini API Key</label>
                <input type="password" id="api-key" placeholder="Enter your Gemini API key" value="AIzaSyCv3hQFUun2wXSZhX1gnKwiJZ4qe5ciSxA"
                       class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-yellow-400 text-white placeholder-gray-500">
            </div>
            <div class="w-full md:w-1/3">
                <label class="block text-xs font-semibold text-gray-300 uppercase mb-1">Voice Persona</label>
                <select id="voice-preset" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-yellow-400">
                    <option value="The Patient Teacher" selected>The Patient Teacher (Calm & Educational)</option>
                    <option value="Puck">Puck (Dynamic & Expressive)</option>
                    <option value="Kore">Kore (Smooth & Professional)</option>
                </select>
            </div>
        </div>

        <!-- Main Form Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Controls Panel -->
            <div class="glass-card p-6 rounded-2xl space-y-5 lg:col-span-1">
                <h2 class="text-lg font-bold text-yellow-400 flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-sm"></i> Project Setup
                </h2>
                
                <div>
                    <label class="block text-xs font-semibold text-gray-300 uppercase mb-2">Video Title / Topic</label>
                    <input type="text" id="topic" placeholder="e.g. Paano mag hugas ng kamay" 
                           class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-yellow-400 text-white placeholder-gray-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 uppercase mb-2">Script Detail Level</label>
                    <select id="depth" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-yellow-400 text-white">
                        <option value="standard">Standard Quick Guide (Concise)</option>
                        <option value="deep" selected>Comprehensive Deep-Dive (Step-by-Step)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 uppercase mb-2">Video Aspect Ratio</label>
                    <select id="orientation" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-yellow-400 text-white">
                        <option value="vertical">Vertical (9:16) - TikTok/Reels/Shorts</option>
                        <option value="horizontal">Horizontal (16:9) - Standard YouTube</option>
                    </select>
                </div>

                <button id="btn-script" onclick="generateScript()" class="w-full py-3.5 bg-accent-yellow hover:bg-yellow-400 text-black font-bold rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-code"></i> Generate Script & TTS Plan
                </button>
            </div>

            <!-- Preview & Export Panel -->
            <div class="glass-card p-6 rounded-2xl lg:col-span-2 flex flex-col justify-between min-h-[450px]">
                <div>
                    <div class="flex justify-between items-center pb-4 mb-4 border-b border-slate-800">
                        <h2 class="text-lg font-bold text-white flex items-center gap-2">
                            <i class="fa-solid fa-film text-yellow-400"></i> Gemini 3.8 Flash TTS Storyboard
                        </h2>
                        <span id="scene-count" class="text-xs text-gray-400">0 Scenes loaded</span>
                    </div>

                    <div id="status-box" class="hidden p-4 rounded-xl bg-slate-900 border border-slate-800 text-sm text-yellow-400 mb-4 animate-pulse">
                        Connecting to Gemini 3.8 Flash TTS...
                    </div>

                    <div id="scenes-container" class="space-y-3 max-h-[350px] overflow-y-auto pr-2">
                        <p class="text-gray-500 text-sm italic text-center py-12">
                            Your API key is embedded. Enter a topic and click "Generate Script & TTS Plan" to begin!
                        </p>
                    </div>
                </div>

                <div id="export-actions" class="hidden pt-4 border-t border-slate-800 flex gap-3">
                    <button onclick="downloadJSON()" class="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-yellow-400 font-bold rounded-xl border border-yellow-500/30 transition flex items-center justify-center gap-2 text-xs">
                        <i class="fa-solid fa-download"></i> Download Script JSON
                    </button>
                    <button onclick="copyPrompts()" class="flex-1 py-3 bg-accent-yellow hover:bg-yellow-400 text-slate-950 font-bold rounded-xl transition flex items-center justify-center gap-2 text-xs">
                        <i class="fa-solid fa-copy"></i> Copy Image Prompts
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentScenes = [];

        async function generateScript() {
            const apiKey = document.getElementById('api-key').value.trim();
            const topic = document.getElementById('topic').value.trim() || 'Paano mag hugas ng kamay';
            const depth = document.getElementById('depth').value;
            const voicePreset = document.getElementById('voice-preset').value;
            const statusBox = document.getElementById('status-box');
            const scenesContainer = document.getElementById('scenes-container');
            const btnScript = document.getElementById('btn-script');

            if (!apiKey) {
                alert('Please enter your Gemini API Key.');
                return;
            }

            statusBox.classList.remove('hidden');
            statusBox.innerText = `Generating script with Gemini 3.8 Flash TTS style (${voicePreset})...`;
            btnScript.disabled = true;

            const depthGuide = depth === 'deep' 
                ? "Break the script down into sequential scenes to thoroughly and step-by-step cover the entire topic in fluent Tagalog."
                : "Break the script down into concise sequential scenes covering main points.";

            const prompt = `
Create a comprehensive video script about: '${topic}'.
{
  "voice_persona": "${voicePreset}",
  "tone": "Educational, calm, patient teacher"
}
${depthGuide}

Return ONLY a valid JSON array with this format:
[
  {
    "text": "Narration sentence in natural Tagalog with optional inline tags like <laugh> or <sigh>.",
    "image_prompt": "Detailed description of scene image, high quality digital art style"
  }
]
`;

            try {
                // Using gemini-2.5-flash / gemini-3.8-flash for script generation structure
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                const rawText = data.candidates[0].content.parts[0].text;
                const cleanJson = rawText.replace(/```json/g, "").replace(/```/g, "").trim();
                currentScenes = JSON.parse(cleanJson);

                document.getElementById('scene-count').innerText = `${currentScenes.length} Scenes generated`;
                
                scenesContainer.innerHTML = currentScenes.map((s, idx) => `
                    <div class="p-4 bg-slate-900/90 rounded-xl border border-slate-800 space-y-2">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-yellow-400">Scene ${idx + 1} (${voicePreset})</span>
                        </div>
                        <p class="text-sm font-medium text-slate-200">🗣️ ${s.text}</p>
                        <p class="text-xs text-gray-400">🎨 Prompt: ${s.image_prompt}</p>
                    </div>
                `).join('');

                document.getElementById('export-actions').classList.remove('hidden');
                statusBox.classList.add('hidden');
            } catch (err) {
                statusBox.innerText = 'Error: ' + err.message;
            } finally {
                btnScript.disabled = false;
            }
        }

        function downloadJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentScenes, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "gemini_tts_video_script.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function copyPrompts() {
            const promptsText = currentScenes.map((s, i) => `Scene ${i+1}: ${s.image_prompt}`).join('\n');
            navigator.clipboard.writeText(promptsText);
            alert('All image prompts copied to clipboard!');
        }
    </script>
</body>
</html>
