<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photobooth</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#0b0f19;--accent:#fbbf24;--ink:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;user-select:none;-webkit-user-select:none}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--bg) center/cover no-repeat;color:var(--ink);display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(#0008,#000a);z-index:0}
.screen{position:relative;z-index:1;flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:3vh 4vw;text-align:center;min-height:0}
.screen.on{display:flex}
.logo{max-height:14vh;max-width:50vw;object-fit:contain}
h1{font-size:clamp(2.5rem,9vw,7rem);font-weight:800;line-height:.95;letter-spacing:-.02em}
.tag{font-size:clamp(1.1rem,2.6vw,2rem);opacity:.85;max-width:30ch}
.pill{font-size:clamp(1rem,2vw,1.5rem);border:2px solid var(--accent);color:var(--accent);padding:.4em 1em;border-radius:99px}
.btn{font:inherit;font-weight:800;font-size:clamp(1.3rem,3vw,2.2rem);background:var(--accent);color:#111;border:0;border-radius:99px;padding:.7em 1.8em;cursor:pointer;box-shadow:0 .4em 0 #0006;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 .2em 0 #0006}
.btn.ghost{background:#fff2;color:#fff;box-shadow:none;font-size:1.1rem;padding:.6em 1.4em}
.btn:focus-visible{outline:4px solid #fff;outline-offset:4px}
.qrbox{background:#fff;padding:14px;border-radius:16px;line-height:0}
.qrbox img,.qrbox canvas{width:min(38vh,70vw);height:auto}
#cam{position:relative;width:min(92vw,150vh);aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;box-shadow:0 0 0 4px var(--accent)}
#cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#count{position:absolute;inset:0;display:grid;place-items:center;font-size:min(30vh,22vw);font-weight:800;text-shadow:0 .05em .3em #000a}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50;transition:opacity .35s}
#flash.on{opacity:1;transition:none}
.dots{display:flex;gap:10px}.dots i{width:16px;height:16px;border-radius:50%;background:#fff3}.dots i.on{background:var(--accent)}
#strip{max-height:62vh;max-width:90vw;border-radius:6px;box-shadow:0 1.5vh 5vh #000a;background:#fff}
.result{flex-direction:row;gap:5vw}
.result .side{display:flex;flex-direction:column;align-items:center;gap:2vh}
@media (orientation:portrait){.result{flex-direction:column}#strip{max-height:46vh}}
.banner{position:relative;z-index:2;background:var(--accent);color:#111;font-weight:700;padding:.6em 0;overflow:hidden;white-space:nowrap;display:none}
.banner.on{display:block}.banner span{display:inline-block;padding-left:100%;animation:m 18s linear infinite}
@keyframes m{to{transform:translateX(-100%)}}
.err{color:#fca5a5;min-height:1.4em}
@media (prefers-reduced-motion:reduce){.banner span{animation:none;padding:0}}
@media print{body>*:not(#printsheet){display:none!important}body::before{display:none}#printsheet{display:block!important}@page{size:4in 6in;margin:0}}
#printsheet{display:none}#printsheet img{width:4in;height:6in;display:block}
</style>
</head>
<body>
<div class="banner" id="banner"><span id="bannerText"></span></div>

<section class="screen on" id="s-idle">
  <img class="logo" id="logo" alt="" hidden>
  <h1 id="name">Photobooth</h1>
  <p class="tag" id="tagline"></p>
  <p class="pill" id="price"></p>
  <button class="btn" id="startBtn">Tap to start</button>
  <p class="tag" id="details" style="font-size:1.1rem;opacity:.65"></p>
  <p class="err" id="idleErr" role="alert"></p>
</section>

<section class="screen" id="s-pay">
  <h1 style="font-size:clamp(2rem,5vw,4rem)">Scan to pay</h1>
  <p class="tag">Open GCash, Maya or any bank app and scan this QR Ph code.</p>
  <div class="qrbox"><img id="payQr" alt="QR Ph payment code"></div>
  <p class="pill" id="payAmt"></p>
  <button class="btn ghost" id="cancelBtn">Cancel</button>
</section>

<section class="screen" id="s-cap">
  <p class="pill" id="shotLabel">Get ready</p>
  <div id="cam"><video id="video" autoplay playsinline muted></video><div id="count"></div></div>
  <div class="dots" id="dots"></div>
</section>

<section class="screen" id="s-proc"><h1 style="font-size:clamp(2rem,5vw,4rem)">Developing your strip…</h1></section>

<section class="screen result" id="s-result">
  <canvas id="strip"></canvas>
  <div class="side">
    <h1 style="font-size:clamp(2rem,4vw,3.5rem)">Looking good!</h1>
    <p class="tag" id="printMsg">Printing your strip…</p>
    <div class="qrbox" id="shareQr"></div>
    <p class="tag" style="font-size:1.1rem">Scan for your digital copy</p>
    <div style="display:flex;gap:12px"><button class="btn ghost" id="printBtn">Print again</button><button class="btn" id="doneBtn" style="font-size:1.2rem">Done</button></div>
  </div>
</section>

<section class="screen" id="s-maint"><img class="logo" id="logo2" alt="" hidden><h1 style="font-size:clamp(2rem,6vw,4.5rem)">Back soon</h1><p class="tag">This booth is being serviced.</p></section>

<div id="flash"></div>
<div id="printsheet"><img id="printImg" alt=""></div>

<script>
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
let cfg = {}, stream = null, state = 'idle', intentId = null, pollTimer = null, idleTimer = null, shareUrl = '';

function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
function applyConfig(c){
  cfg = c;
  document.documentElement.style.setProperty('--bg', c.bgColor);
  document.documentElement.style.setProperty('--accent', c.accent);
  document.body.style.backgroundImage = c.background ? `url('${c.background}')` : 'none';
  $('name').textContent = c.name; document.title = c.name;
  $('tagline').textContent = c.tagline; $('details').textContent = c.details;
  $('price').textContent = c.freePlay ? 'Free play' : `₱${Number(c.price).toFixed(2)} per session`;
  for (const id of ['logo','logo2']) { $(id).hidden = !c.logo; if (c.logo) $(id).src = c.logo; }
  $('banner').classList.toggle('on', !!(c.bannerActive && c.banner));
  $('bannerText').textContent = c.banner || '';
  if (c.maintenance) show('s-maint'); else if (state === 'idle') show('s-idle');
}
const socket = io();
socket.on('config', applyConfig);
socket.on('refresh', () => location.reload());
fetch('/api/config').then(r => r.json()).then(applyConfig);

async function startCamera(){
  if (stream) return;
  stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1920 }, height: { ideal: 1080 }, facingMode: 'user' }, audio: false });
  $('video').srcObject = stream;
}

function reset(){
  clearInterval(pollTimer); clearTimeout(idleTimer); intentId = null; state = 'idle';
  $('idleErr').textContent = ''; applyConfig(cfg); if (!cfg.maintenance) show('s-idle');
}

// ---- start: camera permission first, then payment ----
$('startBtn').onclick = async () => {
  $('idleErr').textContent = '';
  try { await startCamera(); } catch { return $('idleErr').textContent = 'Camera blocked. Allow camera access in the browser, then tap again.'; }
  if (cfg.freePlay) {
    const r = await fetch('/api/free', { method: 'POST' }); const j = await r.json();
    return j.token ? capture(j.token) : $('idleErr').textContent = j.error;
  }
  state = 'pay';
  try {
    const r = await fetch('/api/pay/create', { method: 'POST' }); const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    intentId = j.intentId; $('payQr').src = j.qr; $('payAmt').textContent = `Pay ₱${Number(j.amount).toFixed(2)}`;
    show('s-pay');
    const deadline = Date.now() + 3 * 60 * 1000;
    pollTimer = setInterval(async () => {
      if (Date.now() > deadline) return reset();
      try {
        const s = await (await fetch('/api/pay/status/' + intentId)).json();
        if (s.paid && s.token) { clearInterval(pollTimer); capture(s.token); }
      } catch {}
    }, 2000);
  } catch (e) { state = 'idle'; $('idleErr').textContent = e.message || 'Payment unavailable.'; }
};
$('cancelBtn').onclick = reset;

// ---- capture ----
async function capture(token){
  state = 'capture'; show('s-cap');
  const n = cfg.shots, shots = [];
  $('dots').innerHTML = '<i></i>'.repeat(n);
  $('count').textContent = ''; $('shotLabel').textContent = 'Payment received. Get ready!';
  await sleep(2500);
  for (let i = 0; i < n; i++) {
    $('shotLabel').textContent = `Photo ${i + 1} of ${n}`;
    for (let c = cfg.countdown; c > 0; c--) { $('count').textContent = c; await sleep(1000); }
    $('count').textContent = '';
    shots.push(grab()); $('dots').children[i].classList.add('on');
    $('flash').classList.add('on'); await sleep(80); $('flash').classList.remove('on');
    await sleep(900);
  }
  state = 'proc'; show('s-proc');
  const strip = await compose(shots);
  const jpg = strip.toDataURL('image/jpeg', 0.92);
  let url = '';
  try {
    const r = await fetch('/api/photo', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ token, image: jpg }) });
    url = (await r.json()).url || '';
  } catch {}
  showResult(strip, jpg, url);
}
function grab(){
  const v = $('video'), c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
  const x = c.getContext('2d'); x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(v, 0, 0); return c;
}
const loadImg = src => new Promise(r => { if (!src) return r(null); const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
async function compose(shots){
  const W = 1200, H = 1800, M = 50, G = 28, cw = W - 2 * M;
  const ch = Math.floor((H - 2 * M - (shots.length - 1) * G - 230) / shots.length);
  const c = $('strip'); c.width = W; c.height = H; const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
  shots.forEach((s, i) => {
    const y = M + i * (ch + G), sc = Math.max(cw / s.width, ch / s.height), sw = cw / sc, sh = ch / sc;
    x.drawImage(s, (s.width - sw) / 2, (s.height - sh) / 2, sw, sh, M, y, cw, ch);
  });
  const fy = H - 230 + 20, logo = await loadImg(cfg.logo);
  x.fillStyle = '#111'; x.textAlign = 'center';
  let ty = fy + 70;
  if (logo) { const lh = 90, lw = logo.width * lh / logo.height; x.drawImage(logo, W / 2 - lw / 2, fy, lw, lh); ty = fy + 150; }
  x.font = '800 64px "Bricolage Grotesque",system-ui,sans-serif'; if (!logo) x.fillText(cfg.name, W / 2, ty);
  x.font = '500 34px "Bricolage Grotesque",system-ui,sans-serif'; x.fillStyle = '#555';
  x.fillText(`${cfg.footer}  ·  ${new Date().toLocaleDateString('en-PH', { year: 'numeric', month: 'short', day: 'numeric' })}`, W / 2, ty + (logo ? 20 : 55));
  return c;
}

// ---- preview, print, QR ----
function showResult(canvas, jpg, url){
  state = 'result'; shareUrl = url; $('printImg').src = jpg;
  const q = $('shareQr'); q.innerHTML = '';
  if (url) new QRCode(q, { text: url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
  else q.innerHTML = '<p style="color:#111;padding:1em;line-height:1.3">Digital copy unavailable.<br>Ask the attendant.</p>';
  show('s-result');
  if (cfg.autoPrint) setTimeout(doPrint, 1500); else $('printMsg').textContent = 'Tap print for a paper copy.';
  idleTimer = setTimeout(reset, 90 * 1000);
}
function doPrint(){ $('printMsg').textContent = 'Printing your strip…'; window.print(); }
$('printBtn').onclick = doPrint;
$('doneBtn').onclick = reset;

// kiosk hygiene: no right-click, no pinch zoom
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
</script>
</body>
</html>
