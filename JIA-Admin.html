<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JIA-POS - Admin Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyBT8q7UuCQ-Rcm1uDXAVrBVMO5GC_7NHxI",
            authDomain: "business-sync-d732b.firebaseapp.com",
            projectId: "business-sync-d732b",
            storageBucket: "business-sync-d732b.firebasestorage.app",
            messagingSenderId: "433624116106",
            appId: "1:433624116106:web:4f3bb89cf214e9e8313673",
            measurementId: "G-8HXZL8JW1E"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Supabase Initialization
        const SUPABASE_URL = 'https://mllokppydyxkohgmjjai.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_bnc7FXc_EJErHRdgppnX4w_cXBBtR03';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        function AdminApp() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [authLoading, setAuthLoading] = useState(true);
            const [authMode, setAuthMode] = useState('login'); 
            const [currentUserProfile, setCurrentUserProfile] = useState(null);
            const [notification, setNotification] = useState(null);
            
            const [resetEmail, setResetEmail] = useState('');
            const [resetSecurityQuestion, setResetSecurityQuestion] = useState('');
            const [resetAnswerInput, setResetAnswerInput] = useState('');
            const [resetStep, setResetStep] = useState(1);

            const [adminProfile, setAdminProfile] = useState({
                firstName: '',
                lastName: '',
                domain: '',
                password: '',
                securityQuestion: 'What is your mother’s maiden name?',
                securityAnswer: ''
            });

            const [loginEmail, setLoginEmail] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [activeTab, setActiveTab] = useState('businesses');
            
            const [settingsSubTab, setSettingsSubTab] = useState('general');
            const [superAdminMsgInput, setSuperAdminMsgInput] = useState('');
            
            const [businesses, setBusinesses] = useState([]);
            const [isBusinessModalOpen, setIsBusinessModalOpen] = useState(false);
            const [editingBusinessId, setEditingBusinessId] = useState(null);
            const [newBusinessName, setNewBusinessName] = useState('');
            const [newBusinessDesc, setNewBusinessDesc] = useState('');

            const [isBranchModalOpen, setIsBranchModalOpen] = useState(false);
            const [selectedBusinessForBranch, setSelectedBusinessForBranch] = useState(null);
            const [editingBranchIndex, setEditingBranchIndex] = useState(null);
            const [newBranchName, setNewBranchName] = useState('');

            const [staffList, setStaffList] = useState([]);
            const [staffSearch, setStaffSearch] = useState('');
            const [isStaffModalOpen, setIsStaffModalOpen] = useState(false);
            const [editingStaffId, setEditingStaffId] = useState(null);
            const [staffName, setStaffName] = useState('');
            const [staffEmail, setStaffEmail] = useState('');
            const [staffPassword, setStaffPassword] = useState('');
            const [staffRole, setStaffRole] = useState('Cashier');
            const [staffBusiness, setStaffBusiness] = useState('');
            const [staffBranch, setStaffBranch] = useState('');

            const [categories, setCategories] = useState([]);
            const [isCategoryModalOpen, setIsCategoryModalOpen] = useState(false);
            const [newCategoryName, setNewCategoryName] = useState('');

            const [products, setProducts] = useState([]);
            const [productSearch, setProductSearch] = useState('');
            const [productCatFilter, setProductCatFilter] = useState('all');
            const [isProductModalOpen, setIsProductModalOpen] = useState(false);
            const [editingProductId, setEditingProductId] = useState(null);
            const [prodName, setProdName] = useState('');
            const [prodCategories, setProdCategories] = useState([]); 
            const [prodBusiness, setProdBusiness] = useState('');
            const [prodBranch, setProdBranch] = useState('');
            const [prodPrice, setProdPrice] = useState('');
            const [prodStock, setProdStock] = useState('');

            const [storeSearch, setStoreSearch] = useState('');
            const [storeCatFilter, setStoreCatFilter] = useState('all');
            const [storeCart, setStoreCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);

            const [tasks, setTasks] = useState([]);
            const [taskFilter, setTaskFilter] = useState('all');
            const [isTaskModalOpen, setIsTaskModalOpen] = useState(false);
            const [taskTitle, setTaskTitle] = useState('');
            const [taskDesc, setTaskDesc] = useState('');
            const [taskAssignee, setTaskAssignee] = useState('');
            const [taskDueDate, setTaskDueDate] = useState('');
            const [taskCustomerName, setTaskCustomerName] = useState('');
            const [taskCustomerCompany, setTaskCustomerCompany] = useState('');
            const [taskSelectedProducts, setTaskSelectedProducts] = useState([]);

            const [messages, setMessages] = useState([]);
            const [chatType, setChatType] = useState('global');
            const [messageInput, setMessageInput] = useState('');

            const [deleteModalConfig, setDeleteModalConfig] = useState({
                isOpen: false,
                title: '',
                description: '',
                onConfirm: null
            });
            const [confirmPassword, setConfirmPassword] = useState('');

            const showToast = (message, type = 'success') => {
                setNotification({ message, type });
                setTimeout(() => setNotification(null), 4000);
            };

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(async (user) => {
                    setIsAuthenticated(!!user);
                    if (user) {
                        try {
                            const adminDoc = await db.collection("admins").doc(user.email).get();
                            if (adminDoc.exists) {
                                setCurrentUserProfile({
                                    firstName: adminDoc.data().firstName,
                                    lastName: adminDoc.data().lastName,
                                    email: user.email,
                                    role: 'Administrator',
                                    business: 'Admin HQ',
                                    branch: 'Main Administration'
                                });
                            } else {
                                setCurrentUserProfile({
                                    firstName: 'Admin',
                                    lastName: 'User',
                                    email: user.email,
                                    role: 'Administrator',
                                    business: 'Admin HQ',
                                    branch: 'Main Administration'
                                });
                            }
                        } catch (e) {
                            console.error("Error fetching admin profile:", e);
                        }
                    } else {
                        setCurrentUserProfile(null);
                    }
                    setAuthLoading(false);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (isAuthenticated && auth.currentUser) {
                    const userEmail = auth.currentUser.email;

                    const unsubBusinesses = db.collection("businesses").where("adminEmail", "==", userEmail).onSnapshot(snapshot => {
                        const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setBusinesses(items);
                    });

                    const unsubStaff = db.collection("staff").where("adminEmail", "==", userEmail).onSnapshot(snapshot => {
                        const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setStaffList(items);
                    });

                    const unsubProducts = db.collection("products").where("adminEmail", "==", userEmail).onSnapshot(snapshot => {
                        const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setProducts(items);
                    });

                    const unsubTasks = db.collection("tasks").where("adminEmail", "==", userEmail).onSnapshot(snapshot => {
                        const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setTasks(items);
                    });

                    const unsubMessages = db.collection("messages").where("adminEmail", "==", userEmail).onSnapshot(snapshot => {
                        const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setMessages(items.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0)));
                    });

                    const unsubCategories = db.collection("categories").where("adminEmail", "==", userEmail).onSnapshot(snapshot => {
                        const items = snapshot.docs.map(doc => ({ id: doc.id, name: doc.data().name }));
                        const defaultCats = ['General', 'Apparel', 'Beverages', 'Bakery', 'Electronics'];
                        
                        if (items.length === 0) {
                            defaultCats.forEach(cat => {
                                db.collection("categories").add({ name: cat, adminEmail: userEmail }).catch(() => {});
                            });
                            setCategories(defaultCats);
                        } else {
                            setCategories(items.map(i => i.name));
                        }
                    });

                    return () => {
                        unsubBusinesses();
                        unsubStaff();
                        unsubProducts();
                        unsubTasks();
                        unsubMessages();
                        unsubCategories();
                    };
                }
            }, [isAuthenticated]);

            useEffect(() => {
                if (!authLoading) {
                    const timer = setTimeout(() => {
                        if (window.lucide && typeof window.lucide.createIcons === 'function') {
                            window.lucide.createIcons();
                        }
                    }, 50);
                    return () => clearTimeout(timer);
                }
            }, [authLoading, isAuthenticated, authMode, activeTab, settingsSubTab, isStaffModalOpen, isBusinessModalOpen, isBranchModalOpen, isProductModalOpen, isCategoryModalOpen, isTaskModalOpen, deleteModalConfig, businesses, products, categories, tasks, messages, resetStep, productSearch, productCatFilter, staffSearch, storeSearch, storeCatFilter, storeCart, isCartOpen]);

            const handleStaffNameChange = (e) => {
                const nameVal = e.target.value;
                setStaffName(nameVal);
                if (!editingStaffId) {
                    const formatted = nameVal.trim().toLowerCase().replace(/\s+/g, '.');
                    setStaffEmail(formatted ? `${formatted}@jia.com` : '');
                }
            };

            const handleAdminSignup = async (e) => {
                e.preventDefault();
                const cleanDomain = adminProfile.domain.trim().replace(/^@/, '');
                const generatedEmail = `${adminProfile.firstName.trim().toLowerCase()}.${adminProfile.lastName.trim().toLowerCase()}@${cleanDomain}`;
                
                try {
                    const userCredential = await auth.createUserWithEmailAndPassword(generatedEmail, adminProfile.password);
                    const userEmail = userCredential.user.email;

                    await db.collection("admins").doc(userEmail).set({
                        firstName: adminProfile.firstName.trim(),
                        lastName: adminProfile.lastName.trim(),
                        domain: cleanDomain,
                        securityQuestion: adminProfile.securityQuestion,
                        securityAnswer: adminProfile.securityAnswer.trim(),
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    const defaultBusinessName = `${adminProfile.firstName.trim()} Retail Main`;
                    await db.collection("businesses").add({
                        name: defaultBusinessName,
                        description: `Primary business managed by ${adminProfile.firstName.trim()} ${adminProfile.lastName.trim()}`,
                        branches: ['Main Branch'],
                        adminEmail: userEmail,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    await db.collection("staff").add({
                        name: `${adminProfile.firstName.trim()} ${adminProfile.lastName.trim()}`,
                        email: userEmail,
                        role: 'Administrator',
                        business: defaultBusinessName,
                        branch: 'Main Branch',
                        status: 'Active',
                        adminEmail: userEmail,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    showToast("Admin account, business, and initial employee profile successfully created!");
                } catch (error) {
                    showToast("Signup Error: " + error.message, "error");
                }
            };

            const handleAdminLogin = async (e) => {
                e.preventDefault();
                try {
                    await auth.signInWithEmailAndPassword(loginEmail.trim(), loginPassword);
                    showToast("Successfully logged in!");
                } catch (error) {
                    showToast("Login Failed: " + error.message, "error");
                }
            };

            const handleFetchSecurityQuestion = async (e) => {
                e.preventDefault();
                try {
                    const adminDoc = await db.collection("admins").doc(resetEmail.trim()).get();
                    if (adminDoc.exists) {
                        setResetSecurityQuestion(adminDoc.data().securityQuestion);
                        setResetStep(2);
                    } else {
                        showToast("No admin record found for this email address.", "error");
                    }
                } catch (err) {
                    showToast("Error retrieving security question: " + err.message, "error");
                }
            };

            const handleVerifySecurityAnswer = async (e) => {
                e.preventDefault();
                try {
                    const adminDoc = await db.collection("admins").doc(resetEmail.trim()).get();
                    if (adminDoc.exists && adminDoc.data().securityAnswer.trim().toLowerCase() === resetAnswerInput.trim().toLowerCase()) {
                        await auth.sendPasswordResetEmail(resetEmail.trim());
                        showToast("Security Answer Verified! Reset email sent.");
                        setAuthMode('login');
                        setResetStep(1);
                        setResetAnswerInput('');
                        setResetEmail('');
                    } else {
                        showToast("Verification Failed: Incorrect security answer.", "error");
                    }
                } catch (err) {
                    showToast("Error during verification: " + err.message, "error");
                }
            };

            const handleSignOut = async () => {
                try {
                    await auth.signOut();
                    showToast("Signed out successfully.");
                } catch (error) {
                    showToast("Sign out error: " + error.message, "error");
                }
            };

            const handleSaveBusiness = async (e) => {
                e.preventDefault();
                if (!newBusinessName.trim() || !auth.currentUser) return;

                try {
                    if (editingBusinessId) {
                        await db.collection("businesses").doc(editingBusinessId).update({
                            name: newBusinessName.trim(),
                            description: newBusinessDesc.trim()
                        });
                        showToast("Business updated successfully!");
                    } else {
                        const newB = {
                            name: newBusinessName.trim(),
                            description: newBusinessDesc.trim(),
                            branches: [],
                            adminEmail: auth.currentUser.email
                        };
                        await db.collection("businesses").add(newB);
                        showToast("Business created successfully!");
                    }
                    setNewBusinessName('');
                    setNewBusinessDesc('');
                    setEditingBusinessId(null);
                    setIsBusinessModalOpen(false);
                } catch (error) {
                    showToast("Error saving business: " + error.message, "error");
                }
            };

            const handleSaveBranch = async (e) => {
                e.preventDefault();
                if (!newBranchName.trim() || !selectedBusinessForBranch) return;

                try {
                    let updatedBranches = [...selectedBusinessForBranch.branches];
                    if (editingBranchIndex !== null) {
                        updatedBranches[editingBranchIndex] = newBranchName.trim();
                    } else {
                        if (!updatedBranches.includes(newBranchName.trim())) {
                            updatedBranches.push(newBranchName.trim());
                        }
                    }

                    await db.collection("businesses").doc(selectedBusinessForBranch.id).update({
                        branches: updatedBranches
                    });

                    showToast("Branch saved successfully!");
                    setNewBranchName('');
                    setEditingBranchIndex(null);
                    setIsBranchModalOpen(false);
                    setSelectedBusinessForBranch(null);
                } catch (error) {
                    showToast("Error saving branch: " + error.message, "error");
                }
            };

            const handleSaveStaff = async (e) => {
                e.preventDefault();
                if (!staffName.trim() || !staffEmail.trim() || !auth.currentUser) return;

                const targetBusiness = staffBusiness || (businesses[0] ? businesses[0].name : 'Default Business');
                const targetBranch = staffBranch || 'Main Branch';

                try {
                    if (editingStaffId) {
                        await db.collection("staff").doc(editingStaffId).update({
                            name: staffName.trim(),
                            email: staffEmail.trim(),
                            role: staffRole,
                            business: targetBusiness,
                            branch: targetBranch
                        });
                        showToast("Employee updated successfully!");
                    } else {
                        if (!staffPassword || staffPassword.length < 6) {
                            showToast("Password must be at least 6 characters long.", "error");
                            return;
                        }
                        await auth.createUserWithEmailAndPassword(staffEmail.trim(), staffPassword);

                        await db.collection("staff").add({
                            name: staffName.trim(),
                            email: staffEmail.trim(),
                            role: staffRole,
                            business: targetBusiness,
                            branch: targetBranch,
                            status: 'Active',
                            adminEmail: auth.currentUser.email
                        });
                        showToast("Employee account successfully created!");
                    }

                    setStaffName(''); 
                    setStaffEmail('');
                    setStaffPassword('');
                    setEditingStaffId(null);
                    setIsStaffModalOpen(false);
                } catch (error) {
                    showToast("Error saving staff: " + error.message, "error");
                }
            };

            const handleAddCategory = async (e) => {
                e.preventDefault();
                const trimmedCategory = newCategoryName.trim();
                if (!trimmedCategory || !auth.currentUser) return;

                try {
                    if (!categories.includes(trimmedCategory)) {
                        await db.collection("categories").add({ name: trimmedCategory, adminEmail: auth.currentUser.email });
                        showToast("Category added successfully!");
                    }
                    setNewCategoryName('');
                    setIsCategoryModalOpen(false);
                } catch (error) {
                    showToast("Error saving category: " + error.message, "error");
                }
            };

            const handleSaveProduct = async (e) => {
                e.preventDefault();
                if (!prodName.trim() || prodPrice === '' || prodStock === '' || !auth.currentUser) return;

                const selectedBus = prodBusiness || businesses[0]?.name || 'Main Business';
                const currentBusObj = businesses.find(b => b.name === selectedBus);
                const selectedBr = prodBranch || currentBusObj?.branches[0] || 'Main Branch';
                const chosenCategories = prodCategories.length > 0 ? prodCategories : [categories[0] || 'General'];

                try {
                    const productData = {
                        name: prodName.trim(),
                        categories: chosenCategories,
                        category: chosenCategories[0],
                        business: selectedBus,
                        branch: selectedBr,
                        price: parseFloat(prodPrice),
                        stock: parseInt(prodStock),
                        adminEmail: auth.currentUser.email
                    };

                    if (editingProductId) {
                        await db.collection("products").doc(editingProductId).update(productData);
                        showToast("Product updated successfully!");
                    } else {
                        await db.collection("products").add(productData);
                        showToast("Product added successfully!");
                    }

                    setProdName('');
                    setProdCategories([]);
                    setProdPrice('');
                    setProdStock('');
                    setEditingProductId(null);
                    setIsProductModalOpen(false);
                } catch (error) {
                    showToast("Error saving product: " + error.message, "error");
                }
            };

            const toggleCategorySelection = (cat) => {
                if (prodCategories.includes(cat)) {
                    setProdCategories(prodCategories.filter(c => c !== cat));
                } else {
                    setProdCategories([...prodCategories, cat]);
                }
            };

            const addToStoreCart = (product) => {
                if (product.stock <= 0) {
                    showToast("Product is currently out of stock.", "error");
                    return;
                }
                setStoreCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) {
                        if (existing.quantity >= product.stock) {
                            showToast("Cannot add more than available stock.", "error");
                            return prev;
                        }
                        return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
                    }
                    return [...prev, { id: product.id, name: product.name, price: Number(product.price), quantity: 1, stock: product.stock }];
                });
                showToast(`Added "${product.name}" to cart.`);
            };

            const updateStoreCartQty = (id, delta) => {
                setStoreCart(prev => prev.map(item => {
                    if (item.id === id) {
                        const newQ = item.quantity + delta;
                        if (newQ > item.stock) {
                            showToast("Exceeds available stock.", "error");
                            return item;
                        }
                        return newQ > 0 ? { ...item, quantity: newQ } : null;
                    }
                    return item;
                }).filter(Boolean));
            };

            const storeCartTotal = storeCart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            const handleStoreCheckout = async () => {
                if (storeCart.length === 0 || !auth.currentUser) return;
                try {
                    await db.collection("tasks").add({
                        title: "Online Store Order",
                        description: "Customer checkout placed via Online Storefront",
                        assignee: currentUserProfile?.email || auth.currentUser.email,
                        dueDate: new Date().toISOString().split('T')[0],
                        createdBy: `${currentUserProfile?.firstName || 'Admin'} ${currentUserProfile?.lastName || 'User'}`,
                        creatorEmail: auth.currentUser.email,
                        adminEmail: auth.currentUser.email,
                        status: 'Pending',
                        customerName: "Online Store Guest",
                        customerCompany: "Direct E-Commerce",
                        items: storeCart,
                        totalPrice: storeCartTotal,
                        receiptPrinted: false,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    for (const item of storeCart) {
                        const prodRef = db.collection("products").doc(item.id);
                        const doc = await prodRef.get();
                        if (doc.exists) {
                            const currentStock = doc.data().stock || 0;
                            await prodRef.update({ stock: Math.max(0, currentStock - item.quantity) });
                        }
                    }

                    showToast("Online order placed successfully! Order logged in Task Center.");
                    setStoreCart([]);
                    setIsCartOpen(false);
                } catch (err) {
                    showToast("Checkout error: " + err.message, "error");
                }
            };

            const handleAddTaskProduct = (product) => {
                setTaskSelectedProducts(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) {
                        return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
                    }
                    return [...prev, { id: product.id, name: product.name, price: Number(product.price), quantity: 1 }];
                });
            };

            const updateTaskProductQty = (id, delta) => {
                setTaskSelectedProducts(prev => prev.map(item => {
                    if (item.id === id) {
                        const newQ = item.quantity + delta;
                        return newQ > 0 ? { ...item, quantity: newQ } : null;
                    }
                    return item;
                }).filter(Boolean));
            };

            const taskTotalPrice = taskSelectedProducts.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            const handleCreateTask = async (e) => {
                e.preventDefault();
                if (!taskTitle.trim() || !currentUserProfile || !auth.currentUser) return;

                try {
                    await db.collection("tasks").add({
                        title: taskTitle.trim(),
                        description: taskDesc.trim(),
                        assignee: taskAssignee || currentUserProfile.email,
                        dueDate: taskDueDate || new Date().toISOString().split('T')[0],
                        createdBy: `${currentUserProfile.firstName} ${currentUserProfile.lastName}`,
                        creatorEmail: currentUserProfile.email,
                        adminEmail: auth.currentUser.email,
                        status: 'Pending',
                        customerName: taskCustomerName.trim(),
                        customerCompany: taskCustomerCompany.trim(),
                        items: taskSelectedProducts,
                        totalPrice: taskTotalPrice,
                        receiptPrinted: false,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    showToast("Task assigned successfully!");
                    setTaskTitle('');
                    setTaskDesc('');
                    setTaskAssignee('');
                    setTaskDueDate('');
                    setTaskCustomerName('');
                    setTaskCustomerCompany('');
                    setTaskSelectedProducts([]);
                    setIsTaskModalOpen(false);
                } catch (err) {
                    showToast("Error creating task: " + err.message, "error");
                }
            };

            const handleToggleTaskStatus = async (taskId, currentStatus, receiptPrinted) => {
                const nextStatus = currentStatus === 'Completed' ? 'Pending' : 'Completed';
                if (nextStatus === 'Completed' && !receiptPrinted) {
                    showToast("Must print receipt from POS session before completing task.", "error");
                    return;
                }
                try {
                    await db.collection("tasks").doc(taskId).update({ status: nextStatus });
                    showToast("Task status updated!");
                } catch (err) {
                    showToast("Error updating task status: " + err.message, "error");
                }
            };

            const handleSendMessage = async (e) => {
                e.preventDefault();
                if (!messageInput.trim() || !currentUserProfile || !auth.currentUser) return;

                try {
                    await db.collection("messages").add({
                        text: messageInput.trim(),
                        senderEmail: currentUserProfile.email,
                        senderName: currentUserProfile.firstName,
                        business: currentUserProfile.business || 'JIA HQ',
                        branch: currentUserProfile.branch || 'Main Admin',
                        recipient: chatType,
                        adminEmail: auth.currentUser.email,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    setMessageInput('');
                } catch (err) {
                    showToast("Error sending message: " + err.message, "error");
                }
            };

            const handleSendSuperAdminMessage = async (e) => {
                e.preventDefault();
                if (!superAdminMsgInput.trim() || !currentUserProfile || !auth.currentUser) return;

                try {
                    await db.collection("messages").add({
                        text: superAdminMsgInput.trim(),
                        senderEmail: currentUserProfile.email,
                        senderName: `${currentUserProfile.firstName} ${currentUserProfile.lastName}`,
                        business: currentUserProfile.business || 'JIA HQ',
                        branch: currentUserProfile.branch || 'Main Admin',
                        recipient: 'super-admin',
                        adminEmail: auth.currentUser.email,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    showToast("Message sent directly to Super Admin!");

                    showToast("Error sending message to super admin: " + err.message, "error");

                    isOpen: true,

                    description,
                    onConfirm: actionCallback

                e.preventDefault();
                const user = auth.currentUser;
                if (!user || !user.email) {
                    showToast("No authenticated admin session found.", "error");
                    return;
                }

                try {
                    const credential = firebase.auth.EmailAuthProvider.credential(user.email, confirmPassword);
                    await user.reauthenticateWithCredential(credential);

                    if (deleteModalConfig.onConfirm) {
                        await deleteModalConfig.onConfirm();
                    }

                    showToast("Successfully removed item.");
                    setDeleteModalConfig({ isOpen: false, title: '', description: '', onConfirm: null });
                    setConfirmPassword('');
                } catch (error) {
                    showToast("Verification Failed: Incorrect password.", "error");
                }
            };

            const exportAnalyticsCSV = () => {
                const completedTasks = tasks.filter(t => t.status === 'Completed');
                let csvContent = "data:text/csv;charset=utf-8,Title,Customer,AssignedTo,TotalSales\n";
                completedTasks.forEach(t => {
                    csvContent += `"${t.title}","${t.customerName || 'N/A'}","${t.assignee}","${t.totalPrice || 0}"\n`;
                });
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", "jia_sales_report.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("Sales report exported successfully!");
            };

            const completedTasks = tasks.filter(t => t.status === 'Completed');
            const totalRevenue = completedTasks.reduce((sum, t) => sum + (Number(t.totalPrice) || 0), 0);
            const totalStockCount = products.reduce((sum, p) => sum + (Number(p.stock) || 0), 0);
            const pendingTasksCount = tasks.filter(t => t.status === 'Pending').length;

            if (authLoading) {

                                </div>

                            {authMode === 'signup' && (

                                            <input type="text" required value={adminProfile.firstName} onChange={e => setAdminProfile({...adminProfile, firstName: e.target.value})} placeholder="Angelito" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500" />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-slate-400 font-medium mb-1">Last Name</label>

                                            <option value="What was your first pet's name?">What was your first pet's name?</option>
                                            <option value="What city were you born in?">What city were you born in?</option>

                                <button onClick={() => setActiveTab('tasks')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition ${activeTab === 'tasks' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
