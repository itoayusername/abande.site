<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JIA-POS - Employee Portal & POS Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyBT8q7UuCQ-Rcm1uDXAVrBVMO5GC_7NHxI",
            authDomain: "business-sync-d732b.firebaseapp.com",
            projectId: "business-sync-d732b",
            storageBucket: "business-sync-d732b.firebasestorage.app",
            messagingSenderId: "433624116106",
            appId: "1:433624116106:web:4f3bb89cf214e9e8313673",
            measurementId: "G-8HXZL8JW1E"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Supabase Initialization
        const SUPABASE_URL = 'https://mllokppydyxkohgmjjai.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_bnc7FXc_EJErHRdgppnX4w_cXBBtR03';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [authLoading, setAuthLoading] = useState(true);
            const [authView, setAuthView] = useState('login'); 
            
            const [loginEmail, setLoginEmail] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [currentUserProfile, setCurrentUserProfile] = useState(null);

            const [forgotEmail, setForgotEmail] = useState('');
            const [securityQuestionText, setSecurityQuestionText] = useState('');
            const [securityAnswerInput, setSecurityAnswerInput] = useState('');
            const [storedSecurityAnswer, setStoredSecurityAnswer] = useState('');
            const [forgotStep, setForgotStep] = useState(1); 

            const [showChangePasswordModal, setShowChangePasswordModal] = useState(false);
            const [oldPassword, setOldPassword] = useState('');
            const [newPasswordChange, setNewPasswordChange] = useState('');

            const [activeTab, setActiveTab] = useState('pos');
            const [cart, setCart] = useState([]);
            const [searchQuery, setSearchQuery] = useState('');
            const [currentTime, setCurrentTime] = useState(new Date());
            
            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(async (user) => {
                    if (user) {
                        setIsAuthenticated(true);
                        try {
                            const staffDoc = await db.collection("staff").doc(user.email).get();
                            if (staffDoc.exists) {
                                setCurrentUserProfile(staffDoc.data());
                            } else {
                                const adminDoc = await db.collection("admins").doc(user.email).get();
                                if (adminDoc.exists) {
                                    setCurrentUserProfile({ firstName: adminDoc.data().firstName, lastName: adminDoc.data().lastName, role: 'Administrator' });
                                } else {
                                    setCurrentUserProfile({ firstName: 'Staff', lastName: 'Member', role: 'Employee' });
                                }
                            }
                        } catch (err) {
                            console.error("Error fetching user profile:", err);
                        }
                    } else {
                        setIsAuthenticated(false);
                        setCurrentUserProfile(null);
                    }
                    setAuthLoading(false);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!authLoading) {
                    const timer = setTimeout(() => {
                        if (window.lucide && typeof window.lucide.createIcons === 'function') {
                            window.lucide.createIcons();
                        }
                    }, 50);
                    return () => clearTimeout(timer);
                }
            }, [authLoading, isAuthenticated, authView, activeTab, forgotStep, showChangePasswordModal]);

            const [products, setProducts] = useState([
                { id: '1', barcode: '1001', name: 'Artisan Sourdough Bread', category: 'Bakery', price: 4.50, stock: 45 },
                { id: '2', barcode: '1002', name: 'Organic Iced Matcha Latte', category: 'Beverages', price: 3.75, stock: 4 },
                { id: '3', barcode: '1003', name: 'Wireless Ergonomic Mouse', category: 'Electronics', price: 29.99, stock: 8 },
                { id: '4', barcode: '1004', name: 'Sea Salt Kettle Chips', category: 'Snacks', price: 2.25, stock: 60 },
                { id: '5', barcode: '1005', name: 'Espresso Roast Beans', category: 'Beverages', price: 16.50, stock: 12 },
                { id: '6', barcode: '1006', name: 'Almond Butter Croissant', category: 'Bakery', price: 3.25, stock: 15 }
            ]);

            const [onlineOrders, setOnlineOrders] = useState([
                {
                    orderId: 'ORD-8091',
                    customerName: 'Sarah Jenkins',
                    timestamp: 'Just now',
                    status: 'Pending',
                    items: [
                        { id: '1', name: 'Artisan Sourdough Bread', price: 4.50, quantity: 2 },
                        { id: '4', name: 'Sea Salt Kettle Chips', price: 2.25, quantity: 1 }
                    ],
                    total: 11.25
                }
            ]);

            const [attendanceStatus, setAttendanceStatus] = useState('Logged Out');
            const [activeSession, setActiveSession] = useState({
                date: null,
                timeIn: null,
                timeInDateObj: null,
                lunchStart: null,
                lunchEnd: null,
                breakStart: null,
                breakEnd: null
            });

            const [selectedCalendarDate, setSelectedCalendarDate] = useState(new Date().toISOString().split('T')[0]);
            
            const [attendanceLogs, setAttendanceLogs] = useState([
                { date: '2026-09-23', timeIn: '08:00 AM', timeOut: '05:00 PM', lunchBreak: '12:00 PM - 01:00 PM', shortBreak: '15m', totalHours: '8h 00m', status: 'Completed' }
            ]);

            const filteredProducts = useMemo(() => {
                return products.filter(p => 
                    p.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                    p.barcode.includes(searchQuery)
                );
            }, [products, searchQuery]);

            const logsForSelectedDate = useMemo(() => {
                return attendanceLogs.filter(log => log.date === selectedCalendarDate);
            }, [attendanceLogs, selectedCalendarDate]);

            const weeklyAccumulatedHours = useMemo(() => {
                let totalMinutes = 0;
                attendanceLogs.forEach(log => {
                    const match = log.totalHours.match(/(\d+)h\s*(\d+)m/);
                    if (match) {
                        totalMinutes += parseInt(match[1]) * 60 + parseInt(match[2]);
                    }
                });
                const hrs = Math.floor(totalMinutes / 60);
                const mins = totalMinutes % 60;
                return `${hrs}h ${mins.toString().padStart(2, '0')}m`;
            }, [attendanceLogs]);

            const subtotal = useMemo(() => cart.reduce((sum, item) => sum + item.price * item.quantity, 0), [cart]);
            const grandTotal = subtotal;

            const addToCart = (product) => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) {
                        return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
                    }
                    return [...prev, { ...product, quantity: 1 }];
                });
            };

            const updateQuantity = (id, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.id === id) {
                        const newQty = item.quantity + delta;
                        return newQty > 0 ? { ...item, quantity: newQty } : null;
                    }
                    return item;
                }).filter(Boolean));
            };

            const handleAcceptOnlineOrder = (order) => {
                setCart(order.items);
                setOnlineOrders(prev => prev.filter(o => o.orderId !== order.orderId));
                setActiveTab('pos');
            };

            const handleTimeIn = () => {
                const now = new Date();
                const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                const currentDate = now.toISOString().split('T')[0];
                
                setActiveSession({
                    date: currentDate,
                    timeIn: timeString,
                    timeInDateObj: now,
                    lunchStart: null,
                    lunchEnd: null,
                    breakStart: null,
                    breakEnd: null
                });
                setAttendanceStatus('Working');
            };

            const handleTimeOut = () => {
                const now = new Date();
                const timeOutString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                
                const lunchStr = activeSession.lunchStart && activeSession.lunchEnd 
                    ? `${activeSession.lunchStart} - ${activeSession.lunchEnd}` 
                    : 'None';
                
                const breakStr = activeSession.breakStart && activeSession.breakEnd 
                    ? `${activeSession.breakStart} - ${activeSession.breakEnd}` 
                    : 'None';

                let totalHoursStr = '8h 00m';
                if (activeSession.timeInDateObj) {
                    const diffMs = now - activeSession.timeInDateObj;
                    const diffMins = Math.floor(diffMs / 60000);
                    const hrs = Math.floor(diffMins / 60);
                    const mins = diffMins % 60;
                    totalHoursStr = `${hrs}h ${mins.toString().padStart(2, '0')}m`;
                }

                const newLog = {
                    date: activeSession.date || now.toISOString().split('T')[0],
                    timeIn: activeSession.timeIn || '08:00:00 AM',
                    timeOut: timeOutString,
                    lunchBreak: lunchStr,
                    shortBreak: breakStr,
                    totalHours: totalHoursStr,
                    status: 'Completed'
                };

                setAttendanceLogs(prev => [newLog, ...prev]);
                setAttendanceStatus('Logged Out');
                setActiveSession({ date: null, timeIn: null, timeInDateObj: null, lunchStart: null, lunchEnd: null, breakStart: null, breakEnd: null });
            };

            const handleStartLunch = () => {
                const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                setActiveSession(prev => ({ ...prev, lunchStart: timeString }));
                setAttendanceStatus('On Lunch');
            };

            const handleEndLunch = () => {
                const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                setActiveSession(prev => ({ ...prev, lunchEnd: timeString }));
                setAttendanceStatus('Working');
            };

            const handleStartBreak = () => {
                const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                setActiveSession(prev => ({ ...prev, breakStart: timeString }));
                setAttendanceStatus('On Break');
            };

            const handleEndBreak = () => {
                const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                setActiveSession(prev => ({ ...prev, breakEnd: timeString }));
                setAttendanceStatus('Working');
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                try {
                    await auth.signInWithEmailAndPassword(loginEmail.trim(), loginPassword);
                } catch (error) {
                    alert("Login failed: " + error.message);
                }
            };

            const handleSignOut = async () => {
                try {
                    await auth.signOut();
                } catch (error) {
                    alert("Sign out error: " + error.message);
                }
            };

            const handleLookupForgotEmail = async (e) => {
                e.preventDefault();
                const emailClean = forgotEmail.trim();
                try {
                    const docRef = await db.collection("staff").doc(emailClean).get();
                    if (docRef.exists) {
                        const data = docRef.data();
                        setSecurityQuestionText(data.securityQuestion || "What is your mother's maiden name?");
                        setStoredSecurityAnswer(data.securityAnswer || "");
                        setForgotStep(2);
                    } else {
                        const adminRef = await db.collection("admins").doc(emailClean).get();
                        if (adminRef.exists) {
                            const data = adminRef.data();
                            setSecurityQuestionText(data.securityQuestion || "What is your mother's maiden name?");
                            setStoredSecurityAnswer(data.securityAnswer || "");
                            setForgotStep(2);
                        } else {
                            alert("Email account not found in system database.");
                        }
                    }
                } catch (err) {
                    alert("Database lookup error: " + err.message);
                }
            };

            const handleVerifySecurityAnswer = (e) => {
                e.preventDefault();
                if (securityAnswerInput.trim().toLowerCase() === storedSecurityAnswer.trim().toLowerCase()) {
                    setForgotStep(3);
                } else {
                    alert("Incorrect security answer. Please try again.");
                }
            };

            const handleResetNewPassword = async (e) => {
                e.preventDefault();
                try {
                    await auth.sendPasswordResetEmail(forgotEmail.trim());
                    alert("Password reset instructions have been sent to your email address.");
                    setAuthView('login');
                    setForgotStep(1);
                } catch (err) {
                    alert("Reset error: " + err.message);
                }
            };

            const handleChangePasswordInApp = async (e) => {
                e.preventDefault();
                const user = auth.currentUser;
                if (!user) return;

                try {
                    const credential = firebase.auth.EmailAuthProvider.credential(user.email, oldPassword);
                    await user.reauthenticateWithCredential(credential);
                    await user.updatePassword(newPasswordChange);
                    alert("Password successfully updated!");
                    setShowChangePasswordModal(false);
                    setOldPassword('');
                    setNewPasswordChange('');
                } catch (err) {
                    alert("Password update failed. Make sure your current password is correct: " + err.message);
                }
            };

            if (authLoading) {
                return (
                    <div className="flex h-screen w-screen items-center justify-center bg-slate-950 text-slate-400 text-sm">
                        Loading JIA-POS Employee Portal...
                    </div>
                );
            }

            if (!isAuthenticated) {
                return (
                    <div className="flex min-h-screen w-screen items-center justify-center bg-slate-950 font-sans p-4">
                        <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-8 shadow-2xl">
                            <div className="text-center mb-6">
                                <div className="bg-indigo-600 w-12 h-12 rounded-2xl flex items-center justify-center text-white mx-auto mb-4 shadow-lg shadow-indigo-600/30">
                                    <i data-lucide="shopping-bag" className="w-6 h-6"></i>
                                </div>
                                <h1 className="text-2xl font-bold text-white">JIA-POS Employee Portal</h1>
                                <p className="text-xs text-slate-400 mt-1">Authorized Staff Terminal Access</p>
                            </div>

                            {authView === 'login' && (
                                <form onSubmit={handleLogin} className="space-y-4">
                                    <div>
                                        <label className="block text-xs text-slate-400 font-medium mb-1">Employee Email (first.lastname@business.com)</label>
                                        <input 
                                            type="email" 
                                            required 
                                            value={loginEmail} 
                                            onChange={e => setLoginEmail(e.target.value)} 
                                            placeholder="juan.delacruz@business.com" 
                                            className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500" 
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-slate-400 font-medium mb-1">Password</label>
                                        <input 
                                            type="password" 
                                            required 
                                            value={loginPassword} 
                                            onChange={e => setLoginPassword(e.target.value)} 
                                            placeholder="••••••••" 
                                            className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500" 
                                        />
                                    </div>
                                    <div className="flex justify-end">
                                        <button 
                                            type="button" 
                                            onClick={() => { setAuthView('forgot'); setForgotStep(1); }} 
                                            className="text-xs text-indigo-400 hover:underline"
                                        >
                                            Forgot Password?
                                        </button>
                                    </div>
                                    <button 
                                        type="submit" 
                                        className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition text-sm shadow-lg shadow-indigo-600/30"
                                    >
                                        Sign In
                                    </button>
                                </form>
                            )}

                            {authView === 'forgot' && (
                                <div>
                                    <h3 className="text-sm font-semibold text-white mb-3">Password Recovery</h3>
                                    {forgotStep === 1 && (
                                        <form onSubmit={handleLookupForgotEmail} className="space-y-4">
                                            <div>
                                                <label className="block text-xs text-slate-400 mb-1">Enter your registered work email</label>
                                                <input 
                                                    type="email" 
                                                    required 
                                                    value={forgotEmail} 
                                                    onChange={e => setForgotEmail(e.target.value)} 
                                                    placeholder="juan.delacruz@business.com" 
                                                    className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500" 
                                                />
                                            </div>
                                            <div className="flex gap-2">
                                                <button 
                                                    type="button" 
                                                    onClick={() => setAuthView('login')} 
                                                    className="w-1/2 bg-slate-800 hover:bg-slate-700 text-white py-2.5 rounded-xl text-xs font-semibold"
                                                >
                                                    Back
                                                </button>
                                                <button 
                                                    type="submit" 
                                                    className="w-1/2 bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl text-xs font-semibold shadow-lg shadow-indigo-600/30"
                                                >
                                                    Next
                                                </button>
                                            </div>
                                        </form>
                                    )}

                                    {forgotStep === 2 && (
                                        <form onSubmit={handleVerifySecurityAnswer} className="space-y-4">
                                            <div>
                                                <label className="block text-xs text-indigo-400 font-medium mb-1">Security Question:</label>
                                                <p className="text-sm text-white bg-slate-800 p-3 rounded-xl mb-3">{securityQuestionText}</p>
                                                <label className="block text-xs text-slate-400 mb-1">Your Answer</label>
                                                <input 
                                                    type="text" 
                                                    required 
                                                    value={securityAnswerInput} 
                                                    onChange={e => setSecurityAnswerInput(e.target.value)} 
                                                    placeholder="Answer" 
                                                    className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500" 
                                                />
                                            </div>
                                            <div className="flex gap-2">
                                                <button 
                                                    type="button" 
                                                    onClick={() => setForgotStep(1)} 
                                                    className="w-1/2 bg-slate-800 hover:bg-slate-700 text-white py-2.5 rounded-xl text-xs font-semibold"
                                                >
                                                    Back
                                                </button>
                                                <button 
                                                    type="submit" 
                                                    className="w-1/2 bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl text-xs font-semibold shadow-lg shadow-indigo-600/30"
                                                >
                                                    Verify Answer
                                                </button>
                                            </div>
                                        </form>
                                    )}

                                    {forgotStep === 3 && (
                                        <form onSubmit={handleResetNewPassword} className="space-y-4">
                                            <p className="text-xs text-emerald-400 bg-emerald-500/10 p-3 rounded-xl border border-emerald-500/20">Security verified successfully! Click below to send reset instructions to your email.</p>
                                            <div className="flex gap-2">
                                                <button 
                                                    type="button" 
                                                    onClick={() => setAuthView('login')} 
                                                    className="w-1/2 bg-slate-800 hover:bg-slate-700 text-white py-2.5 rounded-xl text-xs font-semibold"
                                                >
                                                    Cancel
                                                </button>
                                                <button 
                                                    type="submit" 
                                                    className="w-1/2 bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl text-xs font-semibold shadow-lg shadow-indigo-600/30"
                                                >
                                                    Send Reset Email
                                                </button>
                                            </div>
                                        </form>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen overflow-hidden bg-slate-950 font-sans">
                    <div className="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between">
                        <div>
                            <div className="p-6 border-b border-slate-800 flex items-center justify-between">
                                <div className="flex items-center space-x-3">
                                    <div className="bg-indigo-600 p-2 rounded-xl text-white">
                                        <i data-lucide="shopping-bag" className="w-6 h-6"></i>
                                    </div>
                                    <div>
                                        <h1 className="font-bold text-lg text-white">JIA-POS</h1>
                                        <p className="text-xs text-slate-400">Employee Register</p>
                                    </div>
                                </div>
                            </div>
                            <nav className="p-4 space-y-1">
                                <button 
                                    onClick={() => setActiveTab('pos')}
                                    className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium transition ${activeTab === 'pos' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}
                                >
                                    <i data-lucide="monitor" className="w-5 h-5"></i>
                                    <span>POS Terminal</span>
                                </button>
                                <button 
                                    onClick={() => setActiveTab('products')}
                                    className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium transition ${activeTab === 'products' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}
                                >
                                    <i data-lucide="package" className="w-5 h-5"></i>
                                    <span>Products Inventory</span>
                                </button>
                                <button 
                                    onClick={() => setActiveTab('orders')}
                                    className={`w-full flex items-center justify-between px-4 py-3 rounded-xl font-medium transition ${activeTab === 'orders' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}
                                >
                                    <div className="flex items-center space-x-3">
                                        <i data-lucide="bell" className="w-5 h-5"></i>
                                        <span>Order Center</span>
                                    </div>
                                    {onlineOrders.length > 0 && (
                                        <span className="bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">
                                            {onlineOrders.length}
                                        </span>
                                    )}
                                </button>
                                <button 
                                    onClick={() => setActiveTab('attendance')}
                                    className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium transition ${activeTab === 'attendance' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}
                                >
                                    <i data-lucide="clock" className="w-5 h-5"></i>
                                    <span>Time Clock & Attendance</span>
                                </button>
                            </nav>
                        </div>
                        <div className="p-4 border-t border-slate-800 space-y-2">
                            <div className="flex items-center justify-between bg-slate-800/50 p-3 rounded-xl">
                                <div className="flex items-center space-x-3">
                                    <div className="bg-indigo-500/20 text-indigo-400 font-bold w-9 h-9 rounded-lg flex items-center justify-center text-xs">
                                        {currentUserProfile ? `${currentUserProfile.firstName?.[0] || ''}${currentUserProfile.lastName?.[0] || ''}` : 'EMP'}
                                    </div>
                                    <div className="overflow-hidden">
                                        <p className="text-xs font-semibold text-white truncate">{currentUserProfile ? `${currentUserProfile.firstName} ${currentUserProfile.lastName}` : 'Employee'}</p>
                                        <p className="text-[10px] text-slate-400 truncate">{auth.currentUser?.email}</p>
                                    </div>
                                </div>
                            </div>
                            <button 
                                onClick={() => setShowChangePasswordModal(true)}
                                className="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold py-2 rounded-xl transition flex items-center justify-center gap-2"
                            >
                                <i data-lucide="key" className="w-3.5 h-3.5"></i> Change Password
                            </button>
                            <button 
                                onClick={handleSignOut}
                                className="w-full bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 text-xs font-semibold py-2 rounded-xl transition flex items-center justify-center gap-2"
                            >
                                <i data-lucide="log-out" className="w-3.5 h-3.5"></i> Sign Out
                            </button>
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col overflow-hidden">
                        <header className="bg-slate-900 border-b border-slate-800 px-6 py-3 flex justify-between items-center">
                            <div className="flex items-center space-x-2 text-slate-400 text-xs">
                                <i data-lucide="calendar" className="w-4 h-4 text-indigo-400"></i>
                                <span>{currentTime.toLocaleDateString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' })}</span>
                            </div>
                            <div className="flex items-center space-x-2 bg-slate-800/80 border border-slate-700/60 px-4 py-1.5 rounded-xl shadow-inner">
                                <i data-lucide="clock" className="w-4 h-4 text-indigo-400 animate-pulse"></i>
                                <span className="font-mono text-sm font-bold text-white tracking-wider">
                                    {currentTime.toLocaleTimeString()}
                                </span>
                            </div>
                        </header>

                        {activeTab === 'pos' ? (
                            <div className="flex-1 flex overflow-hidden">
                                <div className="flex-1 p-6 overflow-y-auto flex flex-col">
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="text-2xl font-bold text-white">Product Catalog</h2>
                                        <div className="relative w-72">
                                            <i data-lucide="search" className="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
                                            <input 
                                                type="text" 
                                                placeholder="Search by name or barcode..." 
                                                value={searchQuery}
                                                onChange={(e) => setSearchQuery(e.target.value)}
                                                className="w-full bg-slate-900 border border-slate-800 rounded-xl pl-9 pr-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-3 gap-4">
                                        {filteredProducts.map(product => (
                                            <div 
                                                key={product.id} 
                                                onClick={() => addToCart(product)}
                                                className="bg-slate-900 border border-slate-800 hover:border-indigo-500 rounded-2xl p-4 cursor-pointer transition flex flex-col justify-between"
                                            >
                                                <div>
                                                    <div className="flex justify-between items-center">
                                                        <span className="text-xs font-semibold px-2 py-1 bg-slate-800 text-indigo-400 rounded-md">{product.category}</span>
                                                        <span className="text-[10px] text-slate-500 font-mono">Barcode: {product.barcode}</span>
                                                    </div>
                                                    <h3 className="font-semibold text-white mt-3">{product.name}</h3>
                                                </div>
                                                <div className="flex justify-between items-center mt-4">
                                                    <span className="text-lg font-bold text-indigo-400">${product.price.toFixed(2)}</span>
                                                    <span className="text-xs text-slate-400">{product.stock} in stock</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="w-96 bg-slate-900 border-l border-slate-800 flex flex-col justify-between p-6">
                                    <div>
                                        <h2 className="text-lg font-bold text-white mb-4">Current Order</h2>
                                        <div className="space-y-3 max-h-72 overflow-y-auto pr-1">
                                            {cart.length === 0 ? (
                                                <p className="text-center py-12 text-slate-500 text-sm">Your cart is currently empty</p>
                                            ) : (
                                                cart.map(item => (
                                                    <div key={item.id} className="bg-slate-800/50 p-3 rounded-xl flex justify-between items-center">
                                                        <div>
                                                            <h4 className="text-sm font-medium text-white">{item.name}</h4>
                                                            <p className="text-xs text-indigo-400">${item.price.toFixed(2)} each</p>
                                                        </div>
                                                        <div className="flex items-center space-x-2">
                                                            <button onClick={() => updateQuantity(item.id, -1)} className="w-6 h-6 bg-slate-700 rounded text-white flex items-center justify-center">-</button>
                                                            <span className="text-sm font-semibold">{item.quantity}</span>
                                                            <button onClick={() => updateQuantity(item.id, 1)} className="w-6 h-6 bg-slate-700 rounded text-white flex items-center justify-center">+</button>
                                                        </div>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>

                                    <div className="border-t border-slate-800 pt-4 space-y-3">
                                        <div className="flex justify-between text-lg font-bold text-white">
                                            <span>Grand Total</span>
                                            <span className="text-indigo-400">${grandTotal.toFixed(2)}</span>
                                        </div>
                                        <button 
                                            disabled={cart.length === 0}
                                            onClick={() => { alert('Transaction completed!'); setCart([]); }}
                                            className="w-full bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-emerald-600/20"
                                        >
                                            Process Payment
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ) : activeTab === 'products' ? (
                            <div className="flex-1 p-6 overflow-y-auto">
                                <h2 className="text-2xl font-bold text-white mb-6">Inventory Management</h2>
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="border-b border-slate-800 text-slate-400 text-xs uppercase">
                                                <th className="pb-3">Barcode</th>
                                                <th className="pb-3">Product Name</th>
                                                <th className="pb-3">Category</th>
                                                <th className="pb-3">Price</th>
                                                <th className="pb-3">Stock</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-800 text-sm">
                                            {products.map(p => (
                                                <tr key={p.id}>
                                                    <td className="py-3 font-mono text-slate-400">{p.barcode}</td>
                                                    <td className="py-3 font-medium text-white">{p.name}</td>
                                                    <td className="py-3 text-slate-400">{p.category}</td>
                                                    <td className="py-3 text-indigo-400 font-semibold">${p.price.toFixed(2)}</td>
                                                    <td className="py-3 text-slate-300">{p.stock} units</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        ) : activeTab === 'orders' ? (
                            <div className="flex-1 p-6 overflow-y-auto">
                                <h2 className="text-2xl font-bold text-white mb-6">Online Order Center</h2>
                                <div className="grid grid-cols-2 gap-4">
                                    {onlineOrders.map(order => (
                                        <div key={order.orderId} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between">
                                            <div>
                                                <h3 className="font-bold text-white text-lg">{order.customerName}</h3>
                                            </div>
                                            <button 
                                                onClick={() => handleAcceptOnlineOrder(order)}
                                                className="mt-4 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold px-4 py-2.5 rounded-xl transition"
                                            >
                                                Accept & Load to POS
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ) : (
                            <div className="flex-1 p-6 overflow-y-auto">
                                <div className="flex justify-between items-center mb-6">
                                    <div>
                                        <h2 className="text-2xl font-bold text-white">Time Clock & Attendance</h2>
                                        <p className="text-xs text-slate-400 mt-1">Manage shift hours, punch-in lunch, breaks, and view weekly summary</p>
                                    </div>
                                    <div className="flex items-center space-x-4">
                                        <div className="bg-slate-900 border border-slate-800 px-3 py-2 rounded-xl flex items-center space-x-2">
                                            <span className="text-xs text-slate-400 font-medium">Weekly Total:</span>
                                            <span className="text-xs font-bold text-indigo-400">{weeklyAccumulatedHours}</span>
                                        </div>
                                        <div className="flex items-center space-x-2 bg-slate-900 border border-slate-800 px-4 py-2 rounded-xl">
                                            <div className={`w-3 h-3 rounded-full ${attendanceStatus === 'Working' ? 'bg-emerald-500 animate-pulse' : attendanceStatus.includes('Break') || attendanceStatus.includes('Lunch') ? 'bg-amber-500 animate-pulse' : 'bg-slate-500'}`}></div>
                                            <span className="text-xs font-semibold text-slate-300">Status: <strong className="text-white">{attendanceStatus}</strong></span>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-3 gap-6 mb-8">
                                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col justify-between">
                                        <div>
                                            <span className="text-xs font-semibold text-indigo-400 bg-indigo-500/10 px-2.5 py-1 rounded-md">Shift Action</span>
                                            <h3 className="text-lg font-bold text-white mt-4">Clock In / Out</h3>
                                            <p className="text-xs text-slate-400 mt-1">Record the start or end of your shift for today.</p>
                                        </div>
                                        <div className="mt-6 flex gap-3">
                                            {attendanceStatus === 'Logged Out' ? (
                                                <button 
                                                    onClick={handleTimeIn}
                                                    className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition text-sm shadow-lg shadow-emerald-600/20"
                                                >
                                                    Time In
                                                </button>
                                            ) : (
                                                <button 
                                                    onClick={handleTimeOut}
                                                    className="flex-1 bg-red-600 hover:bg-red-500 text-white font-semibold py-3 rounded-xl transition text-sm shadow-lg shadow-red-600/20"
                                                >
                                                    Time Out
                                                </button>
                                            )}
                                        </div>
                                    </div>

                                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col justify-between">
                                        <div>
                                            <span className="text-xs font-semibold text-amber-400 bg-amber-500/10 px-2.5 py-1 rounded-md">Breaks & Meals</span>
                                            <h3 className="text-lg font-bold text-white mt-4">Lunch & Breaks Punch</h3>
                                            <p className="text-xs text-slate-400 mt-1">Punch in/out for meals and short rest breaks.</p>
                                        </div>
                                        <div className="mt-6 flex gap-2">
                                            {attendanceStatus === 'On Lunch' ? (
                                                <button 
                                                    onClick={handleEndLunch}
                                                    className="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition text-xs"
                                                >
                                                    End Lunch
                                                </button>
                                            ) : attendanceStatus === 'On Break' ? (
                                                <button 
                                                    onClick={handleEndBreak}
                                                    className="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition text-xs"
                                                >
                                                    End Break
                                                </button>
                                            ) : (
                                                <>
                                                    <button 
                                                        disabled={attendanceStatus !== 'Working'}
                                                        onClick={handleStartLunch}
                                                        className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold py-3 rounded-xl transition text-xs disabled:opacity-50"
                                                    >
                                                        {activeSession.lunchStart ? 'Lunch Taken' : 'Start Lunch'}
                                                    </button>
                                                    <button 
                                                        disabled={attendanceStatus !== 'Working'}
                                                        onClick={handleStartBreak}
                                                        className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold py-3 rounded-xl transition text-xs disabled:opacity-50"
                                                    >
                                                        {activeSession.breakStart ? 'Break Taken' : 'Start Break'}
                                                    </button>
                                                </>
                                            )}
                                        </div>
                                    </div>

                                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col justify-between">
                                        <div>
                                            <span className="text-xs font-semibold text-slate-400 bg-slate-800 px-2.5 py-1 rounded-md">Summary</span>
                                            <h3 className="text-lg font-bold text-white mt-4">Current Shift Info</h3>
                                            <p className="text-xs text-slate-400 mt-1">Time In: <strong className="text-indigo-400">{activeSession.timeIn || 'Not Timed In'}</strong></p>
                                        </div>
                                        <div className="mt-6 pt-3 border-t border-slate-800 flex justify-between text-xs text-slate-400">
                                            <span>Active User: {currentUserProfile?.firstName || 'Staff'}</span>
                                            <span className="text-emerald-400 font-medium">On-Site</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                                    <div className="flex justify-between items-center mb-6">
                                        <h3 className="text-lg font-bold text-white">Attendance History & Calendar Lookup</h3>
                                        <div className="flex items-center space-x-2">
                                            <label className="text-xs text-slate-400">Select Date:</label>
                                            <input 
                                                type="date" 
                                                value={selectedCalendarDate}
                                                onChange={(e) => setSelectedCalendarDate(e.target.value)}
                                                className="bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500"
                                            />
                                        </div>
                                    </div>

                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="border-b border-slate-800 text-slate-400 text-xs uppercase">
                                                <th className="pb-3">Date</th>
                                                <th className="pb-3">Time In</th>
                                                <th className="pb-3">Time Out</th>
                                                <th className="pb-3">Lunch Break</th>
                                                <th className="pb-3">Short Break</th>
                                                <th className="pb-3">Total Hours</th>
                                                <th className="pb-3">Status</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-800 text-sm">
                                            {logsForSelectedDate.length === 0 ? (
                                                <tr>
                                                    <td colSpan="7" className="text-center py-8 text-slate-500 text-sm">
                                                        No attendance records found for {selectedCalendarDate}.
                                                    </td>
                                                </tr>
                                            ) : (
                                                logsForSelectedDate.map((log, index) => (
                                                    <tr key={index}>
                                                        <td className="py-3 font-mono text-slate-300">{log.date}</td>
                                                        <td className="py-3 text-indigo-400 font-medium">{log.timeIn}</td>
                                                        <td className="py-3 text-slate-300">{log.timeOut}</td>
                                                        <td className="py-3 text-amber-400 text-xs">{log.lunchBreak}</td>
                                                        <td className="py-3 text-slate-400 text-xs">{log.shortBreak}</td>
                                                        <td className="py-3 text-slate-300 font-semibold">{log.totalHours}</td>
                                                        <td className="py-3">
                                                            <span className="px-2.5 py-1 bg-emerald-500/10 text-emerald-400 text-xs rounded-full border border-emerald-500/20 font-medium">
                                                                {log.status}
                                                            </span>
                                                        </td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </div>

                    {showChangePasswordModal && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-6 shadow-2xl">
                                <h3 className="text-lg font-bold text-white mb-4">Change Password</h3>
                                <form onSubmit={handleChangePasswordInApp} className="space-y-4">
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Current Password</label>
                                        <input 
                                            type="password" 
                                            required 
                                            value={oldPassword} 
                                            onChange={e => setOldPassword(e.target.value)} 
                                            placeholder="••••••••" 
                                            className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500" 
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">New Password</label>
                                        <input 
                                            type="password" 
                                            required 
                                            value={newPasswordChange} 
                                            onChange={e => setNewPasswordChange(e.target.value)} 
                                            placeholder="••••••••" 
                                            className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500" 
                                        />
                                    </div>
                                    <div className="flex gap-3 pt-2">
                                        <button 
                                            type="button" 
                                            onClick={() => setShowChangePasswordModal(false)} 
                                            className="w-1/2 bg-slate-800 hover:bg-slate-700 text-white font-semibold py-2.5 rounded-xl text-sm transition"
                                        >
                                            Cancel
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="w-1/2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-lg shadow-indigo-600/30"
                                        >
                                            Update Password
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
        setTimeout(() => lucide.createIcons(), 100);
    </script>
</body>
</html>
