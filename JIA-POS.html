<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' https://www.gstatic.com; object-src 'none'; base-uri 'none'">
<title>JIA Workspace</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f3f4fb;--card:#fff;--tx:#161a2b;--mu:#6b7186;--bd:#e6e8f2;--ac:#6366f1;--ac2:#8b5cf6;--soft:#eef0ff;--ok:#10b981;--dg:#ef4444;--wn:#f59e0b;--sh:0 6px 24px rgba(30,35,80,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1120;--card:#171b2e;--tx:#eceefb;--mu:#98a0bd;--bd:#262b45;--ac:#818cf8;--ac2:#a78bfa;--soft:#22274a;--sh:0 6px 24px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.hide{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
#shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}
#side{position:sticky;top:0;height:100vh;padding:18px 10px;background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:4px}
.brand{font-weight:800;font-size:19px;padding:4px 12px 16px;color:var(--ac)}
.nv{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:12px;border:0;background:none;color:var(--mu);font-weight:600;cursor:pointer;font-size:14px;text-align:left;position:relative}
.nv.on{background:var(--soft);color:var(--ac)}
.bd{background:var(--dg);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:auto}
main{padding:20px;max-width:1300px;width:100%;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.top h2{margin:0;font-size:22px;font-weight:800}.mu{color:var(--mu)}.tools{display:flex;gap:8px;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;outline:none}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--soft)}
button{cursor:pointer}button:active{transform:scale(.97)}button:disabled{opacity:.45;cursor:not-allowed}
.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(99,102,241,.35)}
.ghost{background:var(--soft);border-color:transparent;color:var(--ac);font-weight:600}.dg{color:var(--dg)}.pill{border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:var(--sh)}
.sell{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}.chips button{white-space:nowrap;border-radius:99px;padding:7px 16px}.chips .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}
.prod{display:flex;flex-direction:column;gap:5px;text-align:left;padding:14px;border-radius:16px;box-shadow:var(--sh)}
.prod:hover{border-color:var(--ac)}.prod:disabled{opacity:.4}.pr{font-weight:800;font-size:16px;color:var(--ac)}
.cart{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
.line{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}.line>div:first-child{flex:1;min-width:0}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:28px;height:28px;padding:0;border-radius:9px}
.row{display:flex;justify-content:space-between;padding:3px 0}.tot{font-size:24px;font-weight:800}
.act{display:flex;gap:8px;margin-top:12px}.act .pri{flex:1}
label{display:block;color:var(--mu);font-size:12px;font-weight:600;margin:8px 0 4px}
.cart select,.cart input,.md input,.md select,#login input{width:100%}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:11px;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}.stat b{display:block;font-size:24px;font-weight:800}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:14px}.cols h3{margin:0 0 8px;font-size:15px}
.low{color:var(--wn);font-weight:600}.ok{color:var(--ok)}.void{text-decoration:line-through;opacity:.5}
#ov{position:fixed;inset:0;background:rgba(10,12,30,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.md{background:var(--card);border-radius:20px;padding:22px;width:100%;max-width:460px;max-height:90vh;overflow:auto}.md h3{margin:0 0 8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.rc{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}.rc hr{border:0;border-top:1px dashed var(--mu)}.ctr{text-align:center}
#fab,#toast{display:none;position:fixed;left:12px;right:12px;z-index:40}
#toast{bottom:90px;left:50%;right:auto;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:60;max-width:92vw}
.lg{width:100%;max-width:380px}.lg h1{margin:0 0 4px;color:var(--ac)}.err{color:var(--dg);min-height:20px;margin:8px 0}
@media (max-width:900px){
#shell{display:block}
#side{position:fixed;top:auto;left:0;right:0;bottom:0;height:auto;flex-direction:row;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--bd);z-index:30}
.brand{display:none}#nav{display:flex;width:100%;overflow-x:auto;gap:2px}.nv{flex:0 0 auto;flex-direction:column;gap:2px;font-size:10.5px;padding:6px 10px}
main{padding:14px 14px 110px}.sell{display:block}
.cart{position:fixed;left:0;right:0;bottom:0;max-height:88vh;border-radius:22px 22px 0 0;z-index:45;transform:translateY(105%);transition:.25s}.cart.open{transform:none}
#fab.show{display:flex;bottom:calc(68px + env(safe-area-inset-bottom,0px));justify-content:space-between;align-items:center;padding:14px 18px;border-radius:16px;z-index:35;cursor:pointer;color:#fff;font-weight:700;background:linear-gradient(135deg,var(--ac),var(--ac2))}
#toast.show{display:block}}
@media (min-width:901px){.xs{display:none}#toast.show{display:block;bottom:24px}}
@media print{body *{visibility:hidden}.rc,.rc *{visibility:visible}.rc{position:absolute;left:0;top:0;width:100%}}
</style>
</head>
<body>
<div id="login" class="hide"><div class="card lg"><h1>◆ JIA-POS</h1><p class="mu">Employee &amp; owner sign in</p>
<form id="lf"><label>Email</label><input id="le" type="email" required autocomplete="username"><label>Password</label><input id="lp" type="password" required autocomplete="current-password">
<div class="err" id="lerr"></div><button class="pri" style="width:100%">Sign in</button></form>
<button class="ghost" style="width:100%;margin-top:10px" onclick="forgot()">Forgot password?</button>
<button class="ghost" style="width:100%;margin-top:8px" onclick="regM()">Register as business owner</button></div></div>
<div id="shell" class="hide"><div id="side"><div class="brand">◆ JIA-POS</div><div id="nav" style="display:contents"></div></div><main id="main"></main></div>
<div id="fab" onclick="cartOpen=true;cartUI()"></div><div id="toast"></div>
<div id="ov"><div class="md" id="md"></div></div>
<script>
const firebaseConfig = {
            apiKey: "AIzaSyBT8q7UuCQ-Rcm1uDXAVrBVMO5GC_7NHxI",
            authDomain: "business-sync-d732b.firebaseapp.com",
            projectId: "business-sync-d732b",
            storageBucket: "business-sync-d732b.firebasestorage.app",
            messagingSenderId: "433624116106",
            appId: "1:433624116106:web:4f3bb89cf214e9e8313673",
            measurementId: "G-8HXZL8JW1E"
        };
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore(),FV=firebase.firestore.FieldValue;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let SET={vat:12,inc:true,tin:'000-000-000-000',addr:'',foot:'Thank you! Come again.',cur:'₱'};
try{Object.assign(SET,JSON.parse(localStorage.getItem('jia-pos-set')||'{}'))}catch(e){}
let AD={},boot=false,SIGNUP=false,PR=[],SR=[],AA=[],B=[],ST=[],CT=[],M=[],BIZ='',chan='team',rng='today',PBZ='',U=null,P=[],O=[],A=[],S=[],cart=[],disc='none',cat='All',q='',cust='',tab='reg',cartOpen=false,held=[],unsub=[],CB,LOCK=false,busy=false;
const fmt=n=>SET.cur+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const rd=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[k,Math.round(v*100)/100]));
const isMgr=()=>/admin|manager/i.test(U.role||''),biz=()=>U.isAd?BIZ:(U.business&&U.business!=='Admin HQ'?U.business:'');
const trk=p=>Number.isFinite(p.stock)&&!(p.isReservationOnly||p.fulfillmentType==='reservation_only');
const hue=s=>'hsl('+([...(s||'x')].reduce((a,c)=>a+c.charCodeAt(0),0)*47%360)+' 65% 52%)';
const tm=ms=>ms?new Date(ms).toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'}):'—';
const day=()=>new Date().toLocaleDateString('en-CA');
function toast(m){const t=$('toast');t.textContent=m;t.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2800)}
function openM(h,l){LOCK=!!l;$('md').innerHTML=h;$('ov').style.display='flex'}function closeM(){LOCK=false;$('ov').style.display='none'}
$('ov').onclick=e=>{if(e.target.id==='ov'&&!LOCK)closeM()};
function ask(t,lbl,fn,type,ok){CB=fn;openM(`<h3>${t}</h3>${lbl?`<label>${lbl}</label><input id="ask" type="${type||'text'}" onkeydown="if(event.key==='Enter')askOk()">`:''}<div class="act"><button class="ghost" onclick="closeM()">Cancel</button><button class="pri" onclick="askOk()">${ok||'Confirm'}</button></div>`);if($('ask'))$('ask').focus()}
function askOk(){const v=$('ask')?$('ask').value.trim():'',f=CB;closeM();f&&f(v)}

/* ---------- auth ---------- */
$('lf').onsubmit=async e=>{e.preventDefault();$('lerr').textContent='';try{await auth.signInWithEmailAndPassword($('le').value.trim(),$('lp').value)}catch(x){$('lerr').textContent='Sign-in failed. Check your email and password.'}};
async function forgot(){const em=$('le').value.trim();if(!em){$('lerr').textContent='Type your email first, then tap Forgot password.';return}
 try{await auth.sendPasswordResetEmail(em)}catch(x){}$('lerr').textContent='If an account exists, a reset link has been sent.'}
function stop(){unsub.forEach(f=>f());unsub=[]}
auth.onAuthStateChanged(async user=>{
 if(user&&SIGNUP)return;
 if(!user){stop();U=null;$('shell').classList.add('hide');$('login').classList.remove('hide');return}
 try{
  let p=null;const ad=await db.collection('admins').doc(user.email).get();
  if(ad.exists){
   if(ad.data().approved===true)p={name:ad.data().firstName+' '+ad.data().lastName,role:'Administrator',adminEmail:user.email,isAd:true};
   else{$('lerr').textContent='This account is not active yet. Please contact the administrator.';await auth.signOut();return}
  }else{
   const sd=await db.collection('staff').doc(user.email).get();
   if(sd.exists)p=sd.data();else{const qs=await db.collection('staff').where('email','==',user.email).limit(1).get();if(!qs.empty)p=qs.docs[0].data()}
   if(p&&p.status&&String(p.status).toLowerCase()!=='active')p=null;
  }
  if(!p){$('lerr').textContent='Access is not available for this account. Please contact the administrator.';await auth.signOut();return}
  U={...p,name:p.name||p.email,email:user.email};start()
 }catch(e){$('lerr').textContent='Could not load your profile: '+e.message;await auth.signOut()}
});
function start(){
 $('login').classList.add('hide');$('shell').classList.remove('hide');stop();
 boot=false;AD={};
 const er=e=>toast('Data error: '+e.message),col=n=>db.collection(n),ad=isAd(),mk=s=>s.docs.map(d=>({id:d.id,...d.data()}));
 unsub.push(col('products').where('adminEmail','==',me()).onSnapshot(s=>{PR=mk(s);refilter();upd('reg','stock','prod')},er));
 const ae=[U.email,U.adminEmail].filter((v,i,a)=>v&&a.indexOf(v)===i);
 unsub.push(col('tasks').where('adminEmail','==',me()).onSnapshot(s=>{O=mk(s).filter(o=>String(o.title||'').startsWith('Online Order'));nav();upd('ord')},er));
 unsub.push(col('sales').where('adminEmail','==',me()).onSnapshot(s=>{SR=mk(s);refilter();upd('sales','rep')},er));
 unsub.push(col('attendance').where('email','==',U.email).onSnapshot(s=>{A=mk(s).sort((a,b)=>b.date>a.date?1:-1);upd('clock')},er));
 unsub.push(col('messages').where('adminEmail','==',me()).onSnapshot(s=>{M=mk(s).sort((a,b)=>mt(a)-mt(b));upd('msg')},er));
 if(ad){
  unsub.push(db.collection('admins').doc(U.email).onSnapshot(s=>{AD=s.data()||{};upd('store')},er));
  unsub.push(col('businesses').where('adminEmail','==',U.email).onSnapshot(s=>{B=mk(s);if(s.empty&&!boot){boot=true;db.collection('businesses').add({name:(String(U.name).split(' ')[0]||'My')+' Business',description:'',branches:['Main Branch'],adminEmail:U.email,createdAt:FV.serverTimestamp()}).catch(()=>{})}if(!B.some(b=>b.name===BIZ))BIZ=B[0]?B[0].name:'';refilter();if(tab!=='msg')render()},er));
  unsub.push(col('staff').where('adminEmail','==',U.email).onSnapshot(s=>{ST=mk(s);upd('staff')},er));
  unsub.push(col('categories').where('adminEmail','==',U.email).onSnapshot(s=>{CT=mk(s)},er));
  unsub.push(col('attendance').where('adminEmail','==',U.email).onSnapshot(s=>{AA=mk(s);upd('clock')},er));
 }
 render()
}
function tabs(){const t=[['reg','🛒','Register'],['ord','🔔','Orders'],['sales','🧾','Sales']];
 if(isMgr())t.push(['prod','📦','Products'],['rep','📊','Reports']);else t.push(['stock','📦','Stock']);
 if(isAd())t.push(['staff','👥','Staff'],['biz','🏢','Businesses'],['store','🌐','Online store']);
 t.push(['clock','⏱️','Time clock'],['msg','💬','Messages']);return t}
const pend=()=>O.filter(o=>o.status!=='Completed');
function nav(){$('nav').innerHTML=tabs().map(t=>`<button class="nv ${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()"><span>${t[1]}</span>${t[2]}${t[0]==='ord'&&pend().length?`<span class="bd">${pend().length}</span>`:''}</button>`).join('')}
function render(){
 if(!tabs().some(t=>t[0]===tab))tab='reg';nav();const T=tabs().find(t=>t[0]===tab)[2];
 $('main').innerHTML=`<div class="top"><div><h2>${T}</h2><div class="mu">${esc(biz()||'All businesses')} · ${esc(U.name)} (${esc(roleLabel(U.role||'Employee'))})</div></div><div class="tools">${bizSel()}${isMgr()?'<button class="pill ghost" onclick="setM()">⚙️ Settings</button>':''}<button class="pill ghost" onclick="auth.signOut()">Sign out</button></div></div>`+({reg:vReg,ord:vOrd,sales:vSales,stock:vStock,clock:vClock,prod:vProd,rep:vRep,staff:vStaff,biz:vBiz,msg:vMsg,store:vStore}[tab])();
 if(tab==='reg'){grid();cartUI()}else{$('fab').className='';if(tab==='msg')msgLog()}
}
/* ---------- register ---------- */
const pcat=p=>(p.categories&&p.categories[0])||p.category||'General';
function vReg(){const cats=['All',...new Set(P.map(pcat))];
 return`<div class="sell"><div><input id="q" style="width:100%;margin-bottom:10px" placeholder="Search or scan barcode, press Enter to add…" value="${esc(q)}" oninput="q=this.value;grid()" onkeydown="if(event.key==='Enter')scan()">
 <div class="chips">${cats.map(c=>`<button class="${cat===c?'on':''}" onclick="cat=this.dataset.c;render()" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="grid" id="grid"></div></div><div class="card cart" id="cart"></div></div>`}
const avail=p=>!trk(p)||p.stock>0;
function grid(){const g=$('grid');if(!g)return;const k=q.toLowerCase();
 g.innerHTML=P.filter(p=>(cat==='All'||pcat(p)===cat)&&(String(p.name).toLowerCase().includes(k)||String(p.barcode||'').includes(k))).map(p=>`<button class="prod" ${avail(p)?'':'disabled'} onclick="add('${p.id}')"><b>${esc(p.name)}</b><span class="mu">${esc(pcat(p))}</span><span class="pr">${fmt(p.price)}</span><small class="${trk(p)&&p.stock<=5?'low':'mu'}">${trk(p)?(p.stock>0?p.stock+' in stock':'Out of stock'):'Available'}</small></button>`).join('')||'<p class="mu">No items found.</p>'}
function scan(){const k=q.trim();if(!k)return;const m=P.filter(p=>String(p.barcode||'')===k||String(p.name).toLowerCase()===k.toLowerCase());if(m.length===1){add(m[0].id);q='';$('q').value=''}grid()}
function add(id){const p=P.find(x=>x.id===id),l=cart.find(x=>x.id===id);if(!p)return;
 if(trk(p)&&(l?l.qty:0)>=p.stock)return toast('No more stock for '+p.name);l?l.qty++:cart.push({id,name:p.name,price:Number(p.price),qty:1});cartUI()}
function chg(i,d){const l=cart[i],p=P.find(x=>x.id===l.id);l.qty+=d;if(p&&trk(p)&&l.qty>p.stock)l.qty=p.stock;if(l.qty<=0)cart.splice(i,1);cartUI()}
function calc(l=cart,ds=disc){const r=SET.vat/100,sub=l.reduce((a,i)=>a+i.price*i.qty,0);let d,total,vat;
 if(ds==='senior'){const b=SET.inc?sub/(1+r):sub;d=b*.2;total=b-d;vat=0}
 else{d=sub*(Number(ds==='none'?0:ds)/100);const n=sub-d;if(SET.inc){total=n;vat=n/(1+r)*r}else{vat=n*r;total=n+vat}}
 return rd({sub,d,total,vat})}
function cartUI(){const el=$('cart');if(!el)return;const c=calc(),n=cart.reduce((a,l)=>a+l.qty,0);el.className='card cart'+(cartOpen?' open':'');
 el.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Current order</h3><button class="xs ghost pill" onclick="cartOpen=false;cartUI()">Close ✕</button></div>
 <label>Customer (optional)</label><input value="${esc(cust)}" oninput="cust=this.value" maxlength="60">
 ${cart.length?cart.map((l,i)=>`<div class="line"><div><b>${esc(l.name)}</b><div class="mu">${fmt(l.price)}</div></div><div class="qty"><button onclick="chg(${i},-1)">−</button>${l.qty}<button onclick="chg(${i},1)">+</button></div><b>${fmt(l.price*l.qty)}</b></div>`).join(''):'<p class="mu" style="text-align:center;padding:20px 0">Tap items to start an order</p>'}
 <label>Discount</label><select onchange="disc=this.value;cartUI()"><option value="none">None</option><option value="senior" ${disc==='senior'?'selected':''}>Senior / PWD 20%</option>${[5,10,15].map(x=>`<option value="${x}" ${disc==x?'selected':''} ${isMgr()?'':'disabled'}>Promo ${x}% (manager)</option>`).join('')}</select>
 <div style="margin-top:10px"><div class="row mu"><span>Subtotal</span><span>${fmt(c.sub)}</span></div><div class="row mu"><span>Discount</span><span>−${fmt(c.d)}</span></div><div class="row mu"><span>VAT ${SET.vat}%${SET.inc?' (incl.)':''}</span><span>${fmt(c.vat)}</span></div><div class="row"><b>Total</b><span class="tot">${fmt(c.total)}</span></div></div>
 <div class="act"><button class="dg" onclick="cart=[];disc='none';cartUI()">Clear</button><button onclick="hold()">Hold${held.length?' ('+held.length+')':''}</button><button class="pri" ${cart.length?'':'disabled'} onclick="payM()">Charge</button></div>${held.length?'<button class="ghost" style="width:100%;margin-top:8px" onclick="heldM()">Resume held orders</button>':''}`;
 const f=$('fab');f.className=n?'show':'';f.innerHTML=`<span>🛒 ${n} item${n>1?'s':''}</span><span>${fmt(c.total)} ›</span>`}
function hold(){if(!cart.length)return held.length?heldM():0;held.push({cart,disc,cust});cart=[];disc='none';cust='';cartUI();toast('Order held')}
function heldM(){openM(`<h3>Held orders</h3>${held.map((h,i)=>`<div class="line"><div><b>${esc(h.cust||'Order '+(i+1))}</b><div class="mu">${h.cart.length} lines</div></div><button class="ghost" onclick="resume(${i})">Resume</button><button class="dg" onclick="held.splice(${i},1);heldM();cartUI()">✕</button></div>`).join('')||'<p class="mu">None.</p>'}<div class="act"><button class="ghost" onclick="closeM()">Close</button></div>`)}
function resume(i){const h=held.splice(i,1)[0];cart=h.cart;disc=h.disc;cust=h.cust;closeM();cartUI()}
function payM(){const c=calc(),qk=[Math.ceil(c.total),100,500,1000].filter((v,i,a)=>v>=c.total&&a.indexOf(v)===i).slice(0,4);

async function pay(){
 if(busy)return;busy=true;$('pb').disabled=true;const m=$('pm').value,t=Number($('tend').value)||0,lines=cart.map(l=>({...l})),ds=disc,cu=cust.trim(),key=(me()+'_'+(biz()||'Main')).replace(/[^\w]/g,'_');
 try{
  const sale=await db.runTransaction(async tx=>{
   const refs=lines.map(l=>db.collection('products').doc(l.id)),snaps=[];for(const r of refs)snaps.push(await tx.get(r));
   const cr=db.collection('counters').doc(key),cs=await tx.get(cr),n=(cs.exists?cs.data().n:0)+1;
   lines.forEach((l,i)=>{if(!snaps[i].exists)throw Error(l.name+' no longer exists');const p=snaps[i].data();l.price=Number(p.price);l.name=p.name;if(trk(p)&&p.stock<l.qty)throw Error('Not enough stock for '+p.name+' ('+p.stock+' left)')});
   const c=calc(lines,ds);if(m==='Cash'&&t<c.total-.005)throw Error('Cash received is too low');
   lines.forEach((l,i)=>{const p=snaps[i].data();if(trk(p))tx.update(refs[i],{stock:p.stock-l.qty})});
   tx.set(cr,{n,adminEmail:me()});
   const s={inv:'INV-'+String(n).padStart(6,'0'),n,business:biz()||'Main',adminEmail:me(),branch:U.branch||'',cashier:U.email,cashierName:U.name,items:lines.map(l=>({id:l.id,name:l.name,price:l.price,qty:l.qty})),...c,disc:ds,method:m,tendered:m==='Cash'?t:c.total,customer:cu,tsMs:Date.now(),voided:false};
   tx.set(db.collection('sales').doc(),{...s,createdAt:FV.serverTimestamp()});return s});
  cart=[];disc='none';cust='';cartOpen=false;render();receipt(sale)
 }catch(e){closeM();toast(e.message)}finally{busy=false}}

function voidS(id){if(!isMgr())return toast('Manager access required');
 ask('Void sale','Reason',async v=>{if(!v)return;try{await db.runTransaction(async tx=>{const r=db.collection('sales').doc(id),s=await tx.get(r);if(!s.exists||s.data().voided)return;const it=s.data().items,pr=it.map(i=>db.collection('products').doc(i.id)),ps=[];for(const x of pr)ps.push(await tx.get(x));

function bizM(){openM(`<h3>New business</h3><label>Business name</label><input id="b1"><label>Description</label><input id="b2"><label>First branch</label><input id="b3" placeholder="Main Branch"><div class="act"><button class="ghost" onclick="closeM()">Cancel</button><button class="pri" onclick="saveBiz()">Create</button></div>`)}
async function saveBiz(){const n=$('b1').value.trim();if(!n)return toast('Name is required');if(B.some(b=>b.name.toLowerCase()===n.toLowerCase()))return toast('That business already exists');
 try{await db.collection('businesses').add({name:n,description:$('b2').value.trim(),branches:[$('b3').value.trim()||'Main Branch'],adminEmail:U.email,createdAt:FV.serverTimestamp()});closeM()}catch(e){toast(e.message)}}
function brM(id){ask('Add branch','Branch name',async v=>{if(!v)return;try{await db.collection('businesses').doc(id).update({branches:FV.arrayUnion(v)})}catch(e){toast(e.message)}},'text','Add')}
function delBiz(id){ask('Delete this business? Its products and staff are not deleted.',null,async()=>{try{await db.collection('businesses').doc(id).delete()}catch(e){toast(e.message)}},null,'Delete')}
/* reports */
function vRep(){const d0=new Date();d0.setHours(0,0,0,0);const s0=rng==='today'?+d0:rng==='7'?+d0-6*864e5:rng==='30'?+d0-29*864e5:0,T=S.filter(s=>!s.voided&&s.tsMs>=s0);
 const g=T.reduce((a,s)=>a+s.total,0),items=T.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.qty,0),0),n=rng==='today'?24:rng==='7'?7:30,bk=Array(n).fill(0);
 T.forEach(s=>{const i=rng==='today'?new Date(s.tsMs).getHours():n-1-Math.floor((+d0-new Date(s.tsMs).setHours(0,0,0,0))/864e5);if(i>=0&&i<n)bk[i]+=s.total});
 const mx=Math.max(...bk,1),w=320/n,grp=f=>{const o={};T.forEach(s=>f(s,o));return Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,6)},L=(a,f)=>a.map(x=>`<div class="row"><span>${esc(x[0])}</span><b>${f(x[1])}</b></div>`).join('')||'<span class="mu">No data yet.</span>',low=P.filter(p=>trk(p)&&p.stock<=5);
 return`<div class="chips">${[['today','Today'],['7','7 days'],['30','30 days'],['all','All time']].map(r=>`<button class="${rng===r[0]?'on':''}" onclick="rng='${r[0]}';render()">${r[1]}</button>`).join('')}</div>
 <div class="stats"><div class="card stat"><span class="mu">Sales</span><b>${fmt(g)}</b></div><div class="card stat"><span class="mu">Transactions</span><b>${T.length}</b></div><div class="card stat"><span class="mu">Avg. sale</span><b>${fmt(T.length?g/T.length:0)}</b></div><div class="card stat"><span class="mu">Items sold</span><b>${items}</b></div><div class="card stat"><span class="mu">Discounts given</span><b>${fmt(T.reduce((a,s)=>a+s.d,0))}</b></div></div>
 <div class="card"><h3 style="margin:0 0 8px">Sales trend</h3><svg viewBox="0 0 320 130" width="100%" role="img" aria-label="Sales chart">${bk.map((v,i)=>`<rect x="${i*w+w*.15}" y="${118-v/mx*108}" width="${w*.7}" height="${v/mx*108}" rx="3" fill="var(--ac)"><title>${fmt(v)}</title></rect>`).join('')}<line x1="0" y1="118" x2="320" y2="118" stroke="var(--bd)"/></svg></div>
 <div class="cols"><div class="card"><h3>Best sellers</h3>${L(grp((s,o)=>s.items.forEach(i=>o[i.name]=(o[i.name]||0)+i.qty)),v=>v)}</div><div class="card"><h3>By payment</h3>${L(grp((s,o)=>o[s.method]=(o[s.method]||0)+s.total),fmt)}</div><div class="card"><h3>By cashier</h3>${L(grp((s,o)=>{const k=s.cashierName||s.cashier;o[k]=(o[k]||0)+s.total}),fmt)}</div><div class="card"><h3>Low stock</h3>${low.map(p=>`<div class="row"><span>${esc(p.name)}</span><b class="low">${p.stock}</b></div>`).join('')||'<span class="mu">All stocked.</span>'}</div></div>`}
/* team attendance (admin) */
function teamClock(){if(!isAd())return'';const L=[...AA].sort((a,b)=>b.date>a.date?1:-1).slice(0,60);
 return`<h3 style="margin:18px 0 8px">Team attendance</h3><div class="card wrap"><table><tr><th>Date</th><th>Employee</th><th>In</th><th>Out</th><th>Hours</th></tr>${L.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.name||x.email)}</td><td>${tm(x.timeIn)}</td><td>${tm(x.timeOut)}</td><td>${x.totalMs?(x.totalMs/36e5).toFixed(2):'—'}</td></tr>`).join('')||'<tr><td colspan="5" class="mu">No records yet.</td></tr>'}</table></div>`}
/* messages */
function vMsg(){return`<div class="card">${isAd()?`<div class="chips"><button class="${chan==='team'?'on':''}" onclick="chan='team';render()">Team chat</button><button class="${chan==='super'?'on':''}" onclick="chan='super';render()">Support</button></div>`:''}<div id="mlog" style="height:46vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:6px 0"></div><form onsubmit="sendMsg(event)" class="act"><input id="mi" style="flex:1" placeholder="Type a message…" maxlength="500" autocomplete="off"><button class="pri" style="flex:none">Send</button></form></div>`}
function msgLog(){const el=$('mlog');if(!el)return;const L=M.filter(m=>chan==='super'?(m.recipient==='super-admin'||m.sender==='super'):(m.recipient!=='super-admin'&&m.sender!=='super'));
 el.innerHTML=L.map(m=>{const mine=m.senderEmail===U.email;return`<div style="align-self:${mine?'flex-end':'flex-start'};max-width:80%;background:${mine?'var(--ac)':'var(--soft)'};color:${mine?'#fff':'var(--tx)'};padding:8px 12px;border-radius:14px"><small style="opacity:.75">${esc(m.sender==='super'?'Support':m.senderName||m.senderEmail||'')} · ${tm(mt(m))}</small><div>${esc(m.text)}</div></div>`}).join('')||'<p class="mu">No messages yet.</p>';el.scrollTop=el.scrollHeight}
async function sendMsg(e){e.preventDefault();const x=$('mi').value.trim();if(!x)return;$('mi').value='';
 try{await db.collection('messages').add({text:x,senderEmail:U.email,senderName:U.name,sender:isAd()?'admin':'staff',business:biz()||'HQ',branch:U.branch||'',recipient:chan==='super'?'super-admin':'team',adminEmail:me(),createdAt:FV.serverTimestamp(),timestamp:Date.now()})}catch(err){toast(err.message)}}

/* online store (premium) */
function copyIn(id){const e=$(id);e.select();try{navigator.clipboard.writeText(e.value);toast('Copied')}catch(x){toast('Press Ctrl+C to copy')}}
function vStore(){const a=AD||{};
 if(a.storeEnabled===true)return`<div class="card"><h3 style="margin:0">🟢 Your online store is live</h3><p class="mu">This store shows only your products and sends its orders to your Orders tab.</p><label>Store link</label><input id="sl" readonly value="${esc(a.storeUrl)}" onclick="this.select()"><div class="act"><button class="pri" onclick="copyIn('sl')">Copy link</button><button class="ghost" onclick="window.open(document.getElementById('sl').value,'_blank','noopener')">Open store</button></div><label>Store key</label><input id="sk" readonly value="${esc(a.storeKey)}" onclick="this.select()"><div class="act"><button class="ghost" onclick="copyIn('sk')">Copy key</button></div></div>`;
 if(a.premiumRequested===true)return`<div class="card"><h3 style="margin:0">⏳ Premium request sent</h3><p class="mu">Your request has been received. Your dedicated store will be set up soon, and your link and key will appear here.</p></div>`;
 return`<div class="card"><h3 style="margin:0">Premium online store</h3><p class="mu">Get your own store website for your customers. Your products and stock stay in sync with this workspace, and online orders arrive in your Orders tab.</p>${a.status==='Suspended'?'<p class="low">Your store is currently suspended. Please contact the administrator.</p>':''}<label>Contact number or message for our team</label><input id="pn" maxlength="200"><div class="act"><button class="pri" onclick="reqPremium()">Request premium</button></div></div>`}
async function reqPremium(){try{await db.collection('admins').doc(U.email).update({premiumRequested:true,premiumRequestedAt:FV.serverTimestamp(),premiumNote:$('pn').value.trim(),plan:'Premium'});toast('Request sent')}catch(e){toast(e.message)}}
const roleLabel=r=>/^admin/i.test(String(r||''))?'Owner':r;
</script>
</body>
