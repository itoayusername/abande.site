<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JIA-POS - Employee Portal & POS Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyBT8q7UuCQ-Rcm1uDXAVrBVMO5GC_7NHxI",
            authDomain: "business-sync-d732b.firebaseapp.com",
            projectId: "business-sync-d732b",
            storageBucket: "business-sync-d732b.firebasestorage.app",
            messagingSenderId: "433624116106",
            appId: "1:433624116106:web:4f3bb89cf214e9e8313673",
            measurementId: "G-8HXZL8JW1E"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [authLoading, setAuthLoading] = useState(true);
            const [authView, setAuthView] = useState('login');
            
            const [loginEmail, setLoginEmail] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [currentUserProfile, setCurrentUserProfile] = useState(null);

            const [forgotEmail, setForgotEmail] = useState('');
            const [securityQuestionText, setSecurityQuestionText] = useState('');
            const [securityAnswerInput, setSecurityAnswerInput] = useState('');
            const [storedSecurityAnswer, setStoredSecurityAnswer] = useState('');
            const [forgotStep, setForgotStep] = useState(1);

            const [activeTab, setActiveTab] = useState('pos');
            const [cart, setCart] = useState([]);
            const [searchQuery, setSearchQuery] = useState('');
            const [currentTime, setCurrentTime] = useState(new Date());

            const [tasks, setTasks] = useState([]);
            
            // Task Modal State
            const [isTaskModalOpen, setIsTaskModalOpen] = useState(false);
            const [taskModalMode, setTaskModalMode] = useState('create');
            const [currentEditTaskId, setCurrentEditTaskId] = useState(null);
            
            const [taskTitle, setTaskTitle] = useState('');
            const [taskDesc, setTaskDesc] = useState('');
            const [taskDueDate, setTaskDueDate] = useState('');
            const [taskCustomerName, setTaskCustomerName] = useState('');
            const [taskCustomerCompany, setTaskCustomerCompany] = useState('');
            const [taskSelectedProducts, setTaskSelectedProducts] = useState([]);

            // Task Transfer, Decline & History Modals
            const [isTransferModalOpen, setIsTransferModalOpen] = useState(false);
            const [taskToTransfer, setTaskToTransfer] = useState(null);
            const [transferTargetEmail, setTransferTargetEmail] = useState('');
            const [transferReason, setTransferReason] = useState('');

            const [isDeclineModalOpen, setIsDeclineModalOpen] = useState(false);
            const [taskToDecline, setTaskToDecline] = useState(null);
            const [declineReason, setDeclineReason] = useState('');

            const [isHistoryModalOpen, setIsHistoryModalOpen] = useState(false);
            const [taskForHistory, setTaskForHistory] = useState(null);

            const [messages, setMessages] = useState([]);
            const [staffList, setStaffList] = useState([]);
            const [chatType, setChatType] = useState('global');
            const [messageInput, setMessageInput] = useState('');
            const [receiptModalOpen, setReceiptModalOpen] = useState(false);
            const [lastPrintedOrder, setLastPrintedOrder] = useState(null);
            const [activeTaskForReceipt, setActiveTaskForReceipt] = useState(null);

            // Attendance States
            const [attendanceRecords, setAttendanceRecords] = useState([]);
            const [currentAttendanceRecord, setCurrentAttendanceRecord] = useState(null);
            const [attendanceDateFilter, setAttendanceDateFilter] = useState(new Date().toISOString().split('T')[0]);
            
            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(async (user) => {
                    if (user) {
                        setIsAuthenticated(true);
                        try {
                            const staffDoc = await db.collection("staff").doc(user.email).get();
                            if (staffDoc.exists) {
                                setCurrentUserProfile({ ...staffDoc.data(), email: user.email });
                            } else {
                                const staffQuery = await db.collection("staff").where("email", "==", user.email).get();
                                if (!staffQuery.empty) {
                                    setCurrentUserProfile({ ...staffQuery.docs[0].data(), email: user.email });
                                } else {
                                    const adminDoc = await db.collection("admins").doc(user.email).get();
                                    if (adminDoc.exists) {
                                        setCurrentUserProfile({ firstName: adminDoc.data().firstName, lastName: adminDoc.data().lastName, email: user.email, role: 'Administrator', business: 'Admin HQ', branch: 'Main Administration' });
                                    } else {
                                        setCurrentUserProfile({ firstName: user.email.split('@')[0], lastName: '', email: user.email, role: 'Employee', business: 'JIA Retail', branch: 'Main Branch' });
                                    }
                                }
                            }
                        } catch (err) {
                            console.error("Error fetching user profile:", err);
                        }
                    } else {
                        setIsAuthenticated(false);
                        setCurrentUserProfile(null);
                    }
                    setAuthLoading(false);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (isAuthenticated && currentUserProfile) {
                    const unsubTasks = db.collection("tasks").onSnapshot(snapshot => {
                        const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setTasks(items);
                    });

                    const unsubMessages = db.collection("messages").onSnapshot(snapshot => {
                        const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setMessages(items.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0)));
                    });

                    const unsubStaff = db.collection("staff").onSnapshot(snapshot => {
                        const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setStaffList(items);
                    });

                    const unsubAttendance = db.collection("attendance")
                        .where("employeeEmail", "==", currentUserProfile.email)
                        .onSnapshot(snapshot => {
                            const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            setAttendanceRecords(items);
                            const todayStr = new Date().toISOString().split('T')[0];
                            const todayRec = items.find(item => item.date === todayStr);
                            setCurrentAttendanceRecord(todayRec || null);
                        });

                    return () => {
                        unsubTasks();
                        unsubMessages();
                        unsubStaff();
                        unsubAttendance();
                    };
                }
            }, [isAuthenticated, currentUserProfile]);

            useEffect(() => {
                if (!authLoading) {
                    const timer = setTimeout(() => {
                        if (window.lucide && typeof window.lucide.createIcons === 'function') {
                            window.lucide.createIcons();
                        }
                    }, 50);
                    return () => clearTimeout(timer);
                }
            }, [authLoading, isAuthenticated, authView, activeTab, forgotStep, isTaskModalOpen, isTransferModalOpen, isDeclineModalOpen, isHistoryModalOpen, tasks, messages, receiptModalOpen, currentAttendanceRecord, attendanceDateFilter]);

            const [products, setProducts] = useState([]);

            useEffect(() => {
                const unsubscribe = db.collection("products").onSnapshot((snapshot) => {
                    const fetchedProducts = snapshot.docs.map(doc => {
                        const data = doc.data();
                        return {
                            id: doc.id,
                            barcode: data.barcode || data.sku || doc.id,
                            name: data.name || data.productName || 'Unnamed Product',
                            category: data.category || 'General',
                            price: Number(data.price) || 0,
                            stock: Number(data.stock) || 0
                        };
                    });
                    setProducts(fetchedProducts);
                }, (error) => {
                    console.error("Error fetching products from Firestore:", error);
                });

                return () => unsubscribe();
            }, []);

            const filteredProducts = useMemo(() => {
                return products.filter(p => 
                    p.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                    p.barcode.toLowerCase().includes(searchQuery.toLowerCase())
                );
            }, [products, searchQuery]);

            const filteredAttendanceHistory = useMemo(() => {
                return attendanceRecords.filter(item => item.date === attendanceDateFilter);
            }, [attendanceRecords, attendanceDateFilter]);

            const subtotal = useMemo(() => cart.reduce((sum, item) => sum + item.price * item.quantity, 0), [cart]);
            const grandTotal = subtotal;

            const formatMessageTime = (timestamp) => {
                if (!timestamp) return '';
                try {
                    const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
                    if (isNaN(date.getTime())) return '';
                    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                } catch (e) {
                    return '';
                }
            };

            const handleAttendanceAction = async (actionType) => {
                if (!currentUserProfile) return;
                const todayStr = new Date().toISOString().split('T')[0];
                const docId = `${currentUserProfile.email}_${todayStr}`;
                const docRef = db.collection("attendance").doc(docId);
                const nowTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                const timestampVal = firebase.firestore.FieldValue.serverTimestamp();

                const fullName = currentUserProfile.firstName && currentUserProfile.lastName 
                    ? `${currentUserProfile.firstName} ${currentUserProfile.lastName}` 
                    : (currentUserProfile.firstName || currentUserProfile.email?.split('@')[0] || 'Employee');

                try {
                    const docSnap = await docRef.get();
                    if (!docSnap.exists) {
                        if (actionType === 'Clock In') {
                            await docRef.set({
                                employeeEmail: currentUserProfile.email,
                                employeeName: fullName,
                                date: todayStr,
                                clockIn: nowTime,
                                clockInTimestamp: timestampVal,
                                status: 'Clocked In',
                                breakStart: null,
                                breakEnd: null,
                                lunchStart: null,
                                lunchEnd: null,
                                clockOut: null
                            });
                        } else {
                            alert("You must Clock In first before taking breaks or clocking out.");
                        }
                    } else {
                        const data = docSnap.data();
                        let updateData = {};
                        if (actionType === 'Clock In' && !data.clockIn) {
                            updateData = { clockIn: nowTime, status: 'Clocked In' };
                        } else if (actionType === 'Start Break' && data.status === 'Clocked In') {
                            updateData = { breakStart: nowTime, status: 'On Break' };
                        } else if (actionType === 'End Break' && data.status === 'On Break') {
                            updateData = { breakEnd: nowTime, status: 'Clocked In' };
                        } else if (actionType === 'Start Lunch' && data.status === 'Clocked In') {
                            updateData = { lunchStart: nowTime, status: 'On Lunch' };
                        } else if (actionType === 'End Lunch' && data.status === 'On Lunch') {
                            updateData = { lunchEnd: nowTime, status: 'Clocked In' };
                        } else if (actionType === 'Clock Out' && (data.status === 'Clocked In' || data.status === 'On Break' || data.status === 'On Lunch')) {
                            updateData = { clockOut: nowTime, status: 'Clocked Out', clockOutTimestamp: timestampVal };
                        } else {
                            alert(`Invalid action transition from current status: ${data.status}`);
                            return;
                        }
                        await docRef.update(updateData);
                    }
                } catch (err) {
                    alert("Error updating attendance: " + err.message);
                }
            };

            const addToCart = (product) => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) {
                        return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
                    }
                    return [...prev, { ...product, quantity: 1 }];
                });
            };

            const updateQuantity = (id, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.id === id) {
                        const newQty = item.quantity + delta;
                        return newQty > 0 ? { ...item, quantity: newQty } : null;
                    }
                    return item;
                }).filter(Boolean));
            };

            const openCreateModal = () => {
                setTaskTitle('');
                setTaskDesc('');
                setTaskDueDate('');
                setTaskCustomerName('');
                setTaskCustomerCompany('');
                setTaskSelectedProducts([]);
                setCurrentEditTaskId(null);
                setTaskModalMode('create');
                setIsTaskModalOpen(true);
            };

            const handleOpenEditTask = (task) => {
                setTaskTitle(task.title || '');
                setTaskDesc(task.description || '');
                setTaskDueDate(task.dueDate || '');
                setTaskCustomerName(task.customerName || '');
                setTaskCustomerCompany(task.customerCompany || '');
                setTaskSelectedProducts(task.items || []);
                setCurrentEditTaskId(task.id);
                setTaskModalMode('edit');
                setIsTaskModalOpen(true);
            };

            const handleOpenTransferModal = (task) => {
                setTaskToTransfer(task);
                setTransferTargetEmail('');
                setTransferReason('');
                setIsTransferModalOpen(true);
            };

            const handleOpenDeclineModal = (task) => {
                setTaskToDecline(task);
                setDeclineReason('');
                setIsDeclineModalOpen(true);
            };

            const handleOpenHistoryModal = (task) => {
                setTaskForHistory(task);
                setIsHistoryModalOpen(true);
            };

            const handleAddTaskProduct = (product) => {
                setTaskSelectedProducts(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) {
                        return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
                    }
                    return [...prev, { id: product.id, name: product.name, price: Number(product.price), quantity: 1, stock: product.stock }];
                });
            };

            const removeTaskProduct = (id) => {
                setTaskSelectedProducts(prev => prev.filter(item => item.id !== id));
            };

            const taskTotalPrice = taskSelectedProducts.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            const handleSaveTask = async (e) => {
                e.preventDefault();
                if (!taskTitle.trim() || !currentUserProfile) return;

                const fullName = currentUserProfile.firstName && currentUserProfile.lastName 
                    ? `${currentUserProfile.firstName} ${currentUserProfile.lastName}` 
                    : (currentUserProfile.firstName || currentUserProfile.name || currentUserProfile.fullName || currentUserProfile.email?.split('@')[0] || 'Employee');

                const nowStr = new Date().toLocaleString();
                const taskData = {
                    title: taskTitle.trim(),
                    description: taskDesc.trim(),
                    dueDate: taskDueDate || new Date().toISOString().split('T')[0],
                    customerName: taskCustomerName.trim(),
                    customerCompany: taskCustomerCompany.trim(),
                    items: taskSelectedProducts,
                    totalPrice: taskTotalPrice
                };

                try {
                    if (taskModalMode === 'create') {
                        const newHistory = [{
                            action: `Created by ${fullName} (${currentUserProfile.email})`,
                            time: nowStr
                        }];
                        await db.collection("tasks").add({
                            ...taskData,
                            assignee: currentUserProfile.email,
                            previousAssignee: null,
                            createdBy: fullName,
                            creatorEmail: currentUserProfile.email,
                            status: 'Pending',
                            receiptPrinted: false,
                            history: newHistory,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    } else if (taskModalMode === 'edit' && currentEditTaskId) {
                        const taskRef = db.collection("tasks").doc(currentEditTaskId);
                        const docSnap = await taskRef.get();
                        const existingHistory = docSnap.exists ? (docSnap.data().history || []) : [];
                        const updatedHistory = [
                            ...existingHistory,
                            {
                                action: `Edited by ${fullName} (${currentUserProfile.email})`,
                                time: nowStr
                            }
                        ];
                        await taskRef.update({
                            ...taskData,
                            history: updatedHistory
                        });
                    }
                    
                    setIsTaskModalOpen(false);
                    setCurrentEditTaskId(null);
                } catch (err) {
                    alert(`Error ${taskModalMode === 'create' ? 'creating' : 'updating'} task: ` + err.message);
                }
            };

            const handleConfirmTransfer = async (e) => {
                e.preventDefault();
                if (!transferTargetEmail || !taskToTransfer || !currentUserProfile || !transferReason.trim()) return;

                const fullName = currentUserProfile.firstName && currentUserProfile.lastName 
                    ? `${currentUserProfile.firstName} ${currentUserProfile.lastName}` 
                    : (currentUserProfile.firstName || currentUserProfile.email?.split('@')[0] || 'Employee');

                const nowStr = new Date().toLocaleString();
                const prevAssignee = taskToTransfer.assignee || currentUserProfile.email;
                const newHistoryEntry = {
                    action: `Transferred from ${prevAssignee} to ${transferTargetEmail} by ${fullName}. Reason: ${transferReason.trim()}`,
                    time: nowStr
                };

                const updatedHistory = [...(taskToTransfer.history || []), newHistoryEntry];

                try {
                    await db.collection("tasks").doc(taskToTransfer.id).update({
                        assignee: transferTargetEmail,
                        previousAssignee: prevAssignee,
                        history: updatedHistory
                    });
                    setIsTransferModalOpen(false);
                    setTaskToTransfer(null);
                    setTransferTargetEmail('');
                    setTransferReason('');
                } catch (err) {
                    alert("Error transferring task: " + err.message);
                }
            };

            const handleConfirmDecline = async (e) => {
                e.preventDefault();
                if (!taskToDecline || !currentUserProfile || !declineReason.trim()) return;

                const targetAssignee = taskToDecline.previousAssignee;
                if (!targetAssignee) {
                    alert("No previous assignee found to return this task to.");
                    return;
                }

                const fullName = currentUserProfile.firstName && currentUserProfile.lastName 
                    ? `${currentUserProfile.firstName} ${currentUserProfile.lastName}` 
                    : (currentUserProfile.firstName || currentUserProfile.email?.split('@')[0] || 'Employee');

                const nowStr = new Date().toLocaleString();
                const newHistoryEntry = {
                    action: `Declined by ${fullName} and returned to ${targetAssignee}. Reason: ${declineReason.trim()}`,
                    time: nowStr
                };

                const updatedHistory = [...(taskToDecline.history || []), newHistoryEntry];

                try {
                    await db.collection("tasks").doc(taskToDecline.id).update({
                        assignee: targetAssignee,
                        previousAssignee: null,
                        history: updatedHistory
                    });
                    setIsDeclineModalOpen(false);
                    setTaskToDecline(null);
                    setDeclineReason('');
                } catch (err) {
                    alert("Error declining task: " + err.message);
                }
            };

            const handleToggleTaskStatus = async (task) => {
                const nextStatus = task.status === 'Completed' ? 'Pending' : 'Completed';
                if (nextStatus === 'Completed' && !task.receiptPrinted && task.items && task.items.length > 0) {
                    alert("Action blocked: You must first click 'Add to POS' and print the receipt before this task can be marked as complete!");
                    return;
                }
                const fullName = currentUserProfile?.firstName ? `${currentUserProfile.firstName} ${currentUserProfile.lastName || ''}` : currentUserProfile?.email;
                const nowStr = new Date().toLocaleString();
                const updatedHistory = [
                    ...(task.history || []),
                    { action: `Status changed to ${nextStatus} by ${fullName}`, time: nowStr }
                ];
                try {
                    await db.collection("tasks").doc(task.id).update({ 
                        status: nextStatus,
                        history: updatedHistory
                    });
                } catch (err) {
                    alert("Error updating task status: " + err.message);
                }
            };

            const handleAddFromTaskToPOS = (task) => {
                if (!task.items || task.items.length === 0) {
                    alert("This task has no inventory items attached.");
                    return;
                }
                setCart(task.items);
                setActiveTaskForReceipt(task);
                setActiveTab('pos');
            };

            const handleCheckoutAndPrintReceipt = async () => {
                if (cart.length === 0) return;
                
                const currentProfileDisplayName = currentUserProfile?.firstName && currentUserProfile?.lastName 
                    ? `${currentUserProfile.firstName} ${currentUserProfile.lastName}` 
                    : (currentUserProfile?.firstName || currentUserProfile?.name || currentUserProfile?.fullName || 'Staff');

                const orderInfo = {
                    items: [...cart],
                    total: grandTotal,
                    date: new Date().toLocaleString(),
                    customer: activeTaskForReceipt ? activeTaskForReceipt.customerName || 'Task Client' : 'Walk-in',
                    cashier: currentProfileDisplayName,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                try {
                    await db.collection("sales").add(orderInfo);

                    const batch = db.batch();
                    for (const item of cart) {
                        const productRef = db.collection("products").doc(item.id);
                        const currentProduct = products.find(p => p.id === item.id);
                        const currentStock = currentProduct ? currentProduct.stock : (item.stock || 0);
                        const newStock = Math.max(0, currentStock - item.quantity);
                        batch.update(productRef, { stock: newStock });
                    }
                    await batch.commit();

                    if (activeTaskForReceipt) {
                        const nowStr = new Date().toLocaleString();
                        const updatedHistory = [
                            ...(activeTaskForReceipt.history || []),
                            { action: `Receipt printed & Task completed automatically`, time: nowStr }
                        ];
                        await db.collection("tasks").doc(activeTaskForReceipt.id).update({
                            receiptPrinted: true,
                            status: 'Completed',
                            history: updatedHistory
                        });
                    }

                    setLastPrintedOrder(orderInfo);
                    setReceiptModalOpen(true);
                    setCart([]);
                    setActiveTaskForReceipt(null);
                } catch (err) {
                    alert("Checkout error: " + err.message);
                }
            };

            const handleSendMessage = async (e) => {
                e.preventDefault();
                if (!messageInput.trim() || !currentUserProfile) return;

                const fullName = currentUserProfile.firstName && currentUserProfile.lastName 
                    ? `${currentUserProfile.firstName} ${currentUserProfile.lastName}` 
                    : (currentUserProfile.firstName || currentUserProfile.name || currentUserProfile.fullName || currentUserProfile.email?.split('@')[0] || 'Employee');

                try {
                    await db.collection("messages").add({
                        text: messageInput.trim(),
                        senderEmail: currentUserProfile.email,
                        senderName: fullName,
                        business: currentUserProfile.business || 'JIA Retail',
                        branch: currentUserProfile.branch || 'Main Branch',
                        recipient: chatType,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    setMessageInput('');
                } catch (err) {
                    alert("Error sending message: " + err.message);
                }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                try {
                    await auth.signInWithEmailAndPassword(loginEmail.trim(), loginPassword);
                } catch (error) {
                    alert("Login failed: " + error.message);
                }
            };

            const handleSignOut = async () => {
                try {
                    await auth.signOut();
                } catch (error) {
                    alert("Sign out error: " + error.message);
                }
            };

            const handleLookupForgotEmail = async (e) => {
                e.preventDefault();
                const emailClean = forgotEmail.trim();
                try {
                    const docRef = await db.collection("staff").doc(emailClean).get();
                    if (docRef.exists) {
                        const data = docRef.data();
                        setSecurityQuestionText(data.securityQuestion || "What is your mother's maiden name?");
                        setStoredSecurityAnswer(data.securityAnswer || "");
                        setForgotStep(2);
                    } else {
                        const adminRef = await db.collection("admins").doc(emailClean).get();
                        if (adminRef.exists) {
                            const data = adminRef.data();
                            setSecurityQuestionText(data.securityQuestion || "What is your mother's maiden name?");
                            setStoredSecurityAnswer(data.securityAnswer || "");
                            setForgotStep(2);
                        } else {
                            alert("Email account not found in system database.");
                        }
                    }
                } catch (err) {
                    alert("Database lookup error: " + err.message);
                }
            };

            const handleVerifySecurityAnswer = (e) => {
                e.preventDefault();
                if (securityAnswerInput.trim().toLowerCase() === storedSecurityAnswer.trim().toLowerCase()) {
                    setForgotStep(3);
                } else {
                    alert("Incorrect security answer. Please try again.");
                }
            };

            const handleResetNewPassword = async (e) => {
                e.preventDefault();
                try {
                    await auth.sendPasswordResetEmail(forgotEmail.trim());
                    alert("Password reset instructions have been sent to your email address.");
                    setAuthView('login');
                    setForgotStep(1);
                } catch (err) {
                    alert("Reset error: " + err.message);
                }
            };

            if (authLoading) {
                return (
                    <div className="flex h-screen w-screen items-center justify-center bg-slate-950 text-slate-400 text-sm">
                        Loading JIA-POS Employee Portal...
                    </div>
                );
            }

            if (!isAuthenticated) {
                return (
                    <div className="flex min-h-screen w-screen items-center justify-center bg-slate-950 font-sans p-4">
                        <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-8 shadow-2xl">
                            <div className="text-center mb-6">
                                <div className="bg-indigo-600 w-12 h-12 rounded-2xl flex items-center justify-center text-white mx-auto mb-4 shadow-lg shadow-indigo-600/30">
                                    <i data-lucide="shopping-bag" className="w-6 h-6"></i>
                                </div>
                                <h1 className="text-2xl font-bold text-white">JIA-POS Employee Portal</h1>
                                <p className="text-xs text-slate-400 mt-1">Authorized Staff Terminal Access</p>
                            </div>

                            {authView === 'login' && (
                                <form onSubmit={handleLogin} className="space-y-4">
                                    <div>
                                        <label className="block text-xs text-slate-400 font-medium mb-1">Employee Email</label>
                                        <input 
                                            type="email" 
                                            required 
                                            value={loginEmail} 
                                            onChange={e => setLoginEmail(e.target.value)} 
                                            placeholder="juan.delacruz@business.com" 
                                            className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500" 
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-slate-400 font-medium mb-1">Password</label>
                                        <input 
                                            type="password" 
                                            required 
                                            value={loginPassword} 
                                            onChange={e => setLoginPassword(e.target.value)} 
                                            placeholder="••••••••" 
                                            className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500" 
                                        />
                                    </div>
                                    <div className="flex justify-end">
                                        <button 
                                            type="button" 
                                            onClick={() => { setAuthView('forgot'); setForgotStep(1); }} 
                                            className="text-xs text-indigo-400 hover:underline"
                                        >
                                            Forgot Password?
                                        </button>
                                    </div>
                                    <button 
                                        type="submit" 
                                        className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition text-sm shadow-lg shadow-indigo-600/30"
                                    >
                                        Sign In
                                    </button>
                                </form>
                            )}

                            {authView === 'forgot' && (
                                <div>
                                    <h3 className="text-sm font-semibold text-white mb-3">Password Recovery</h3>
                                    {forgotStep === 1 && (
                                        <form onSubmit={handleLookupForgotEmail} className="space-y-4">
                                            <div>
                                                <label className="block text-xs text-slate-400 font-medium mb-1">Enter Account Email</label>
                                                <input type="email" required value={forgotEmail} onChange={e => setForgotEmail(e.target.value)} placeholder="name@business.com" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500" />
                                            </div>
                                            <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition text-sm">Next</button>
                                            <div className="text-center pt-2">
                                                <button type="button" onClick={() => setAuthView('login')} className="text-xs text-indigo-400 hover:underline">Back to Login</button>
                                            </div>
                                        </form>
                                    )}
                                    {forgotStep === 2 && (
                                        <form onSubmit={handleVerifySecurityAnswer} className="space-y-4">
                                            <div>
                                                <label className="block text-xs text-slate-400 font-medium mb-1">Security Question</label>
                                                <p className="text-sm text-white font-medium bg-slate-800 p-3 rounded-xl">{securityQuestionText}</p>
                                            </div>
                                            <div>
                                                <label className="block text-xs text-slate-400 font-medium mb-1">Your Answer</label>
                                                <input type="text" required value={securityAnswerInput} onChange={e => setSecurityAnswerInput(e.target.value)} placeholder="Answer" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500" />
                                            </div>
                                            <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition text-sm">Verify Answer</button>
                                            <div className="text-center pt-2">
                                                <button type="button" onClick={() => setForgotStep(1)} className="text-xs text-slate-400 hover:underline">Back</button>
                                            </div>
                                        </form>
                                    )}
                                    {forgotStep === 3 && (
                                        <form onSubmit={handleResetNewPassword} className="space-y-4">
                                            <p className="text-xs text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 p-3 rounded-xl">Security verified successfully! Click below to send password reset instructions to your email.</p>
                                            <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition text-sm">Send Reset Email</button>
                                            <div className="text-center pt-2">
                                                <button type="button" onClick={() => setAuthView('login')} className="text-xs text-indigo-400 hover:underline">Return to Login</button>
                                            </div>
                                        </form>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            const currentProfileDisplayName = currentUserProfile?.firstName && currentUserProfile?.lastName 
                ? `${currentUserProfile.firstName} ${currentUserProfile.lastName}` 
                : (currentUserProfile?.firstName || currentUserProfile?.name || currentUserProfile?.fullName || 'Staff');

            return (
                <div className="flex h-screen overflow-hidden bg-slate-950 font-sans">
                    {/* Sidebar Navigation */}
                    <div className="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between">
                        <div>
                            <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                                <div className="bg-indigo-600 p-2 rounded-xl text-white shadow-lg shadow-indigo-600/30">
                                    <i data-lucide="shopping-cart" className="w-5 h-5"></i>
                                </div>
                                <div>
                                    <h1 className="font-bold text-white text-base">JIA-POS</h1>
                                    <p className="text-xs text-indigo-400 font-medium">Employee Terminal</p>
                                </div>
                            </div>
                            <div className="p-4 space-y-1">
                                <button onClick={() => setActiveTab('pos')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition ${activeTab === 'pos' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                    <i data-lucide="layout-grid" className="w-4 h-4"></i> POS Terminal
                                </button>
                                <button onClick={() => setActiveTab('tasks')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition ${activeTab === 'tasks' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                    <i data-lucide="check-square" className="w-4 h-4"></i> Tasks & Assignments
                                </button>
                                <button onClick={() => setActiveTab('messages')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition ${activeTab === 'messages' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                    <i data-lucide="message-square" className="w-4 h-4"></i> Messages
                                </button>
                                <button onClick={() => setActiveTab('attendance')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition ${activeTab === 'attendance' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                    <i data-lucide="clock" className="w-4 h-4"></i> Attendance & DTR
                                </button>
                            </div>
                        </div>
                        <div className="p-4 border-t border-slate-800">
                            <button onClick={handleSignOut} className="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-rose-400 hover:bg-rose-500/10 transition">
                                <i data-lucide="log-out" className="w-4 h-4"></i> Sign Out
                            </button>
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <div className="flex-1 flex flex-col overflow-hidden">
                        <header className="h-16 border-b border-slate-800 bg-slate-900/50 backdrop-blur flex items-center justify-between px-6">
                            <h2 className="text-lg font-bold text-white capitalize">
                                {activeTab === 'pos' ? 'Point of Sale Terminal' : activeTab === 'tasks' ? 'Task & Assignment Center' : activeTab === 'messages' ? 'Organization Chat' : 'Attendance & DTR'}
                            </h2>
                            <div className="flex items-center gap-3">
                                <span className="text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-3 py-1 rounded-full font-medium">
                                    {currentProfileDisplayName} ({currentUserProfile?.role || 'Employee'})
                                </span>
                            </div>
                        </header>

                        <div className="flex-1 overflow-auto p-6">
                            {activeTab === 'pos' && (
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 h-full">
                                    <div className="lg:col-span-2 flex flex-col space-y-4">
                                        <div className="flex gap-2">
                                            <div className="relative flex-1">
                                                <i data-lucide="search" className="absolute left-3.5 top-3 w-4 h-4 text-slate-400"></i>
                                                <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="Search products or SKU/barcode..." className="w-full bg-slate-900 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500" />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 md:grid-cols-3 gap-3 overflow-y-auto max-h-[calc(100vh-220px)]">
                                            {filteredProducts.map(p => (
                                                <div key={p.id} onClick={() => addToCart(p)} className="bg-slate-900 border border-slate-800 hover:border-indigo-500/50 p-4 rounded-2xl cursor-pointer transition flex flex-col justify-between">
                                                    <div>
                                                        <span className="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded-md font-medium">{p.category}</span>
                                                        <h4 className="font-bold text-white text-sm mt-2">{p.name}</h4>
                                                    </div>
                                                    <div className="flex justify-between items-center mt-4">
                                                        <span className="font-bold text-emerald-400 text-sm">${p.price.toFixed(2)}</span>
                                                        <span className="text-[11px] text-slate-400">{p.stock} in stock</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Cart & Checkout */}
                                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between h-[calc(100vh-120px)]">
                                        <div>
                                            <h3 className="font-bold text-white text-md mb-3 flex items-center justify-between">
                                                <span>Current Cart</span>
                                                <span className="text-xs bg-indigo-600 px-2 py-0.5 rounded-full text-white">{cart.length} items</span>
                                            </h3>
                                            
                                            {activeTaskForReceipt && (
                                                <div className="mb-3 bg-indigo-500/10 border border-indigo-500/20 p-2.5 rounded-xl text-xs flex justify-between items-center">
                                                    <span>Linked Task: <strong className="text-indigo-300">{activeTaskForReceipt.title}</strong></span>
                                                    <button onClick={() => setActiveTaskForReceipt(null)} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-3.5 h-3.5"></i></button>
                                                </div>
                                            )}

                                            <div className="space-y-2 overflow-y-auto max-h-[calc(100vh-340px)] pr-1">
                                                {cart.length === 0 ? (
                                                    <p className="text-xs text-slate-500 italic text-center py-10">Cart is empty. Click products to add.</p>
                                                ) : (
                                                    cart.map(item => (
                                                        <div key={item.id} className="bg-slate-800/60 p-3 rounded-xl flex items-center justify-between text-xs">
                                                            <div>
                                                                <p className="font-semibold text-white">{item.name}</p>
                                                                <p className="text-emerald-400">${item.price.toFixed(2)}</p>
                                                            </div>
                                                            <div className="flex items-center gap-2">
                                                                <button onClick={() => updateQuantity(item.id, -1)} className="bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-white">-</button>
                                                                <span className="font-medium text-slate-200">{item.quantity}</span>
                                                                <button onClick={() => updateQuantity(item.id, 1)} className="bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-white">+</button>
                                                            </div>
                                                        </div>
                                                    ))
                                                )}
                                            </div>
                                        </div>

                                        <div className="pt-4 border-t border-slate-800 space-y-3">
                                            <div className="flex justify-between font-bold text-white text-base">
                                                <span>Total:</span>
                                                <span className="text-emerald-400">${grandTotal.toFixed(2)}</span>
                                            </div>
                                            <button onClick={handleCheckoutAndPrintReceipt} disabled={cart.length === 0} className="w-full bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-semibold py-3 rounded-xl text-sm transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
                                                <i data-lucide="printer" className="w-4 h-4"></i> Checkout & Print Receipt
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'tasks' && (
                                <div className="space-y-6">
                                    <div className="flex justify-between items-center">
                                        <div>
                                            <h3 className="text-md font-bold text-white">Assigned Tasks</h3>
                                            <p className="text-xs text-slate-400">View tasks assigned to you, load items to POS, transfer with notes, decline tasks back to sender, and complete workflows[cite: 15].</p>
                                        </div>
                                        <button onClick={openCreateModal} className="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-lg shadow-indigo-600/30 transition flex items-center gap-2">
                                            <i data-lucide="plus-circle" className="w-4 h-4"></i> Create Task
                                        </button>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                        {tasks
                                            .filter(t => (t.assignee === currentUserProfile?.email || t.creatorEmail === currentUserProfile?.email) && t.status !== 'Completed')
                                            .map(task => (
                                                <div key={task.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between">
                                                    <div>
                                                        <div className="flex justify-between items-start mb-2">
                                                            <h4 className="font-bold text-white text-base">{task.title}</h4>
                                                            <div className="flex items-center gap-1.5">
                                                                {task.previousAssignee && (
                                                                    <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20">
                                                                        Transferred
                                                                    </span>
                                                                )}
                                                                <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20">
                                                                    {task.status || 'Pending'}
                                                                </span>
                                                            </div>
                                                        </div>
                                                        
                                                        <div className="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50 mb-3">
                                                            <p className="text-sm text-slate-200">{task.description || 'No description.'}</p>
                                                        </div>
                                                        
                                                        {(task.customerName || task.customerCompany) && (
                                                            <div className="mb-3 bg-[#1e2336] p-3 rounded-xl border border-slate-700/50 text-sm">
                                                                {task.customerName && <p className="font-semibold text-slate-200"><span className="text-indigo-300">Customer:</span> {task.customerName}</p>}
                                                                {task.customerCompany && <p className="font-semibold text-slate-200"><span className="text-indigo-300">Company:</span> {task.customerCompany}</p>}
                                                            </div>
                                                        )}
                                                        
                                                        {task.items && task.items.length > 0 && (
                                                            <div className="mb-4 bg-[#1e2336] p-3 rounded-xl text-sm space-y-1.5 border border-slate-700/50">
                                                                <p className="font-bold text-slate-200 border-b border-slate-700 pb-2 mb-2">Inventory Items ({task.items.length})</p>
                                                                {task.items.map((it, idx) => (
                                                                    <div key={idx} className="flex justify-between text-slate-300 py-0.5">
                                                                        <span>{it.name} (x{it.quantity})</span>
                                                                        <span className="text-emerald-400">${(it.price * it.quantity).toFixed(2)}</span>
                                                                    </div>
                                                                ))}
                                                                <div className="flex justify-between text-white font-bold border-t border-slate-700 pt-2 mt-2">
                                                                    <span>Total Computed:</span>
                                                                    <span className="text-emerald-400">${task.totalPrice?.toFixed(2) || '0.00'}</span>
                                                                </div>
                                                            </div>
                                                        )}
                                                        
                                                        <div className="text-xs text-slate-400 space-y-1 mb-5">
                                                            <p><strong className="text-slate-200">Assigned To:</strong> {task.assignee}</p>
                                                            {task.previousAssignee && <p><strong className="text-slate-200">Previous Sender:</strong> {task.previousAssignee}</p>}
                                                            <p><strong className="text-slate-200">Created By:</strong> {task.createdBy}</p>
                                                            <p><strong className="text-slate-200">Due Date:</strong> {task.dueDate}</p>
                                                            <p><strong className="text-slate-200">Receipt Printed:</strong> <span className={task.receiptPrinted ? 'text-amber-400 font-bold' : 'text-amber-400 font-bold'}>{task.receiptPrinted ? 'Yes' : 'No'}</span></p>
                                                        </div>
                                                    </div>
                                                    
                                                    <div className="space-y-2 pt-1 border-t border-slate-800">
                                                        <div className="flex gap-2">
                                                            <button onClick={() => handleToggleTaskStatus(task)} className="flex-1 text-xs py-2 rounded-xl font-semibold transition bg-[#0f3d35] text-emerald-400 hover:bg-[#145247] text-center">
                                                                Mark Completed
                                                            </button>
                                                            {task.items && task.items.length > 0 && (
                                                                <button onClick={() => handleAddFromTaskToPOS(task)} className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-2 rounded-xl font-semibold transition">
                                                                    Add to POS
                                                                </button>
                                                            )}
                                                        </div>
                                                        <div className="flex items-center justify-between pt-1">
                                                            <div className="flex gap-2">
                                                                <button onClick={() => handleOpenTransferModal(task)} className="text-xs bg-slate-800 hover:bg-slate-700 text-indigo-300 px-3 py-1.5 rounded-lg transition font-medium flex items-center gap-1">
                                                                    <i data-lucide="repeat" className="w-3.5 h-3.5"></i> Transfer
                                                                </button>
                                                                {task.previousAssignee && task.assignee === currentUserProfile?.email && (
                                                                    <button onClick={() => handleOpenDeclineModal(task)} className="text-xs bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 px-3 py-1.5 rounded-lg transition font-medium flex items-center gap-1">
                                                                        <i data-lucide="x-circle" className="w-3.5 h-3.5"></i> Decline
                                                                    </button>
                                                                )}
                                                                <button onClick={() => handleOpenHistoryModal(task)} className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg transition font-medium flex items-center gap-1">
                                                                    <i data-lucide="history" className="w-3.5 h-3.5"></i> History Log
                                                                </button>
                                                            </div>
                                                            <button onClick={() => handleOpenEditTask(task)} className="text-indigo-400 hover:text-indigo-300 p-1.5 rounded-xl transition" title="Edit Task">
                                                                <i data-lucide="edit" className="w-4 h-4"></i>
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                    </div>
                                </div>
                            )}

                            {activeTab === 'messages' && (
                                <div className="space-y-4 h-[calc(100vh-140px)] flex flex-col">
                                    <div className="flex justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                                        <h3 className="font-bold text-white text-md">Organization Messages</h3>
                                        <select value={chatType} onChange={e => setChatType(e.target.value)} className="bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white">
                                            <option value="global">Global Channel</option>
                                            {staffList.map(s => (
                                                <option key={s.id} value={s.email}>Private: {s.firstName ? `${s.firstName} ${s.lastName || ''}` : s.name || s.email}</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div className="flex-1 bg-slate-900 border border-slate-800 rounded-2xl p-4 overflow-y-auto space-y-4">
                                        {messages
                                            .filter(m => chatType === 'global' || m.recipient === chatType || m.senderEmail === chatType)
                                            .map(msg => {
                                                const isMine = msg.senderEmail === currentUserProfile?.email;
                                                const msgTime = formatMessageTime(msg.createdAt);
                                                const isAdminRole = msg.business === 'Admin HQ' || (msg.senderName && msg.senderName.toLowerCase().includes('admin'));
                                                
                                                return (
                                                    <div key={msg.id} className={`flex flex-col mb-1 ${isMine ? 'items-end' : 'items-start'}`}>
                                                        <div className="flex items-center gap-2 mb-1.5">
                                                            <span className={`px-2 py-0.5 rounded-full text-[10px] font-semibold border ${isAdminRole ? 'bg-[#2b2b4b] text-indigo-300 border-indigo-500/30' : 'bg-slate-800 text-slate-300 border-slate-700'}`}>
                                                                {msg.senderName || 'Employee'}
                                                            </span>
                                                            <span className="text-[10px] text-slate-400">
                                                                {msg.business || 'JIA Retail'} • {msg.branch || 'Main Branch'}
                                                            </span>
                                                            <span className="text-[9px] text-slate-500">{msgTime}</span>
                                                        </div>
                                                        <div className={`px-4 py-2.5 rounded-2xl max-w-lg text-sm shadow-sm ${isMine ? 'bg-indigo-600 text-white rounded-br-sm' : 'bg-slate-800 text-slate-200 rounded-bl-sm border border-slate-700'}`}>
                                                            {msg.text}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                    </div>

                                    <form onSubmit={handleSendMessage} className="flex gap-2">
                                        <input type="text" value={messageInput} onChange={e => setMessageInput(e.target.value)} placeholder="Type a message..." className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500" />
                                        <button type="submit" className="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-xl font-semibold text-sm transition">Send</button>
                                    </form>
                                </div>
                            )}

                            {activeTab === 'attendance' && (
                                <div className="space-y-6">
                                    <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                                            <div>
                                                <h3 className="font-bold text-white text-base">Daily Attendance & DTR</h3>
                                                <p className="text-xs text-slate-400 mt-0.5">Manage your daily clock-in, breaks, lunch, and check historical records.</p>
                                            </div>
                                            <div className="bg-slate-800 px-4 py-2 rounded-xl border border-slate-700 flex items-center gap-3">
                                                <span className="text-xs text-slate-400">Current Status:</span>
                                                <span className={`text-xs font-bold px-2.5 py-1 rounded-full ${
                                                    currentAttendanceRecord?.status === 'Clocked In' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' :
                                                    currentAttendanceRecord?.status === 'On Break' || currentAttendanceRecord?.status === 'On Lunch' ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' :
                                                    currentAttendanceRecord?.status === 'Clocked Out' ? 'bg-slate-800 text-slate-400 border border-slate-700' :
                                                    'bg-rose-500/10 text-rose-400 border border-rose-500/20'
                                                }`}>
                                                    {currentAttendanceRecord?.status || 'Not Clocked In'}
                                                </span>
                                            </div>
                                        </div>

                                        {/* Action Buttons */}
                                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
                                            {(!currentAttendanceRecord || currentAttendanceRecord.status === 'Clocked Out') && (
                                                <button onClick={() => handleAttendanceAction('Clock In')} className="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl text-sm transition shadow-lg flex items-center justify-center gap-2">
                                                    <i data-lucide="log-in" className="w-4 h-4"></i> Clock In
                                                </button>
                                            )}

                                            {currentAttendanceRecord?.status === 'Clocked In' && (
                                                <>
                                                    <button onClick={() => handleAttendanceAction('Start Break')} className="bg-amber-600 hover:bg-amber-500 text-white font-semibold py-3 px-4 rounded-xl text-sm transition shadow-lg flex items-center justify-center gap-2">
                                                        <i data-lucide="coffee" className="w-4 h-4"></i> Take Break
                                                    </button>
                                                    <button onClick={() => handleAttendanceAction('Start Lunch')} className="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-xl text-sm transition shadow-lg flex items-center justify-center gap-2">
                                                        <i data-lucide="utensils" className="w-4 h-4"></i> Take Lunch
                                                    </button>
                                                    <button onClick={() => handleAttendanceAction('Clock Out')} className="bg-rose-600 hover:bg-rose-500 text-white font-semibold py-3 px-4 rounded-xl text-sm transition shadow-lg flex items-center justify-center gap-2">
                                                        <i data-lucide="log-out" className="w-4 h-4"></i> Clock Out
                                                    </button>
                                                </>
                                            )}

                                            {currentAttendanceRecord?.status === 'On Break' && (
                                                <button onClick={() => handleAttendanceAction('End Break')} className="col-span-2 sm:col-span-4 bg-amber-600 hover:bg-amber-500 text-white font-semibold py-3 px-4 rounded-xl text-sm transition shadow-lg flex items-center justify-center gap-2">
                                                    <i data-lucide="play-circle" className="w-4 h-4"></i> End Break & Resume Work
                                                </button>
                                            )}

                                            {currentAttendanceRecord?.status === 'On Lunch' && (
                                                <button onClick={() => handleAttendanceAction('End Lunch')} className="col-span-2 sm:col-span-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-xl text-sm transition shadow-lg flex items-center justify-center gap-2">
                                                    <i data-lucide="play-circle" className="w-4 h-4"></i> End Lunch & Resume Work
                                                </button>
                                            )}
                                        </div>

                                        {/* Today's Log Summary */}
                                        <div className="bg-slate-800/50 border border-slate-700/60 p-4 rounded-xl grid grid-cols-2 sm:grid-cols-5 gap-4 text-xs">
                                            <div>
                                                <span className="text-slate-400 block mb-1">Clock In</span>
                                                <span className="font-bold text-white text-sm">{currentAttendanceRecord?.clockIn || '--:--'}</span>
                                            </div>
                                            <div>
                                                <span className="text-slate-400 block mb-1">Break</span>
                                                <span className="font-bold text-white text-sm">
                                                    {currentAttendanceRecord?.breakStart ? `${currentAttendanceRecord.breakStart} - ${currentAttendanceRecord.breakEnd || 'Active'}` : '--:--'}
                                                </span>
                                            </div>
                                            <div>
                                                <span className="text-slate-400 block mb-1">Lunch</span>
                                                <span className="font-bold text-white text-sm">
                                                    {currentAttendanceRecord?.lunchStart ? `${currentAttendanceRecord.lunchStart} - ${currentAttendanceRecord.lunchEnd || 'Active'}` : '--:--'}
                                                </span>
                                            </div>
                                            <div>
                                                <span className="text-slate-400 block mb-1">Clock Out</span>
                                                <span className="font-bold text-white text-sm">{currentAttendanceRecord?.clockOut || '--:--'}</span>
                                            </div>
                                            <div>
                                                <span className="text-slate-400 block mb-1">Date</span>
                                                <span className="font-bold text-indigo-400 text-sm">{currentAttendanceRecord?.date || new Date().toISOString().split('T')[0]}</span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Attendance History & Date Checker */}
                                    <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4">
                                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                            <div>
                                                <h4 className="font-bold text-white text-sm">Attendance History & Specific Date Check</h4>
                                                <p className="text-xs text-slate-400">Select any date to check presence status and timestamp logs.</p>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <label className="text-xs text-slate-400">Check Date:</label>
                                                <input 
                                                    type="date" 
                                                    value={attendanceDateFilter} 
                                                    onChange={e => setAttendanceDateFilter(e.target.value)} 
                                                    className="bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500" 
                                                />
                                            </div>
                                        </div>

                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left text-xs">
                                                <thead>
