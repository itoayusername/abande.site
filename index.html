                                                    <tr className="border-b border-slate-800 text-slate-400">
                                                        <th className="py-3 px-4 font-semibold">Date</th>
                                                        <th className="py-3 px-4 font-semibold">Status</th>
                                                        <th className="py-3 px-4 font-semibold">Clock In</th>
                                                        <th className="py-3 px-4 font-semibold">Break</th>
                                                        <th className="py-3 px-4 font-semibold">Lunch</th>
                                                        <th className="py-3 px-4 font-semibold">Clock Out</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-800">
                                                    {filteredAttendanceHistory.length === 0 ? (
                                                        <tr>
                                                            <td colSpan="6" className="py-6 text-center text-slate-500 italic">
                                                                No attendance record found for {attendanceDateFilter}.
                                                            </td>
                                                        </tr>
                                                    ) : (
                                                        filteredAttendanceHistory.map(rec => (
                                                            <tr key={rec.id} className="hover:bg-slate-800/40">
                                                                <td className="py-3 px-4 font-semibold text-white">{rec.date}</td>
                                                                <td className="py-3 px-4">
                                                                    <span className="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-full font-medium">
                                                                        {rec.status || 'Present'}
                                                                    </span>
                                                                </td>
                                                                <td className="py-3 px-4 text-slate-300">{rec.clockIn || '--'}</td>
                                                                <td className="py-3 px-4 text-slate-300">{rec.breakStart ? `${rec.breakStart} - ${rec.breakEnd || 'Active'}` : '--'}</td>
                                                                <td className="py-3 px-4 text-slate-300">{rec.lunchStart ? `${rec.lunchStart} - ${rec.lunchEnd || 'Active'}` : '--'}</td>
                                                                <td className="py-3 px-4 text-slate-300">{rec.clockOut || '--'}</td>
                                                            </tr>
                                                        ))
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Receipt Modal */}
                    {receiptModalOpen && lastPrintedOrder && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white text-slate-900 rounded-3xl w-full max-w-sm p-6 shadow-2xl font-mono">
                                <div className="text-center mb-4 border-b border-dashed pb-3">
                                    <h3 className="font-bold text-lg">JIA-POS RECEIPT</h3>
                                    <p className="text-xs text-slate-500">{lastPrintedOrder.date}</p>
                                    <p className="text-xs font-semibold mt-1">Customer: {lastPrintedOrder.customer}</p>
                                    <p className="text-[10px] text-slate-500">Cashier: {lastPrintedOrder.cashier}</p>
                                </div>
                                <div className="space-y-2 mb-4 text-xs">
                                    {lastPrintedOrder.items.map((it, idx) => (
                                        <div key={idx} className="flex justify-between">
                                            <span>{it.name} (x{it.quantity})</span>
                                            <span>${(it.price * it.quantity).toFixed(2)}</span>
                                        </div>
                                    ))}
                                </div>
                                <div className="border-t border-dashed pt-3 mb-6 flex justify-between font-bold text-sm">
                                    <span>GRAND TOTAL:</span>
                                    <span>${lastPrintedOrder.total.toFixed(2)}</span>
                                </div>
                                <button onClick={() => setReceiptModalOpen(false)} className="w-full bg-slate-900 text-white py-2.5 rounded-xl text-xs font-sans font-semibold">Close Receipt</button>
                            </div>
                        </div>
                    )}

                    {/* Task Creation / Edit Modal */}
                    {isTaskModalOpen && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-lg p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
                                <h3 className="text-lg font-bold text-white mb-4">
                                    {taskModalMode === 'create' ? 'Create Task' : 'Edit Task'}
                                </h3>
                                <form onSubmit={handleSaveTask} className="space-y-3">
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Task Title</label>
                                        <input type="text" required value={taskTitle} onChange={e => setTaskTitle(e.target.value)} placeholder="Task name..." className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs text-slate-400 mb-1">Customer Name</label>
                                            <input type="text" value={taskCustomerName} onChange={e => setTaskCustomerName(e.target.value)} placeholder="Customer" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-slate-400 mb-1">Company</label>
                                            <input type="text" value={taskCustomerCompany} onChange={e => setTaskCustomerCompany(e.target.value)} placeholder="Company" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Description</label>
                                        <textarea value={taskDesc} onChange={e => setTaskDesc(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white h-16 resize-none"></textarea>
                                    </div>

                                    <div>
                                        <label className="block text-xs text-indigo-400 font-semibold mb-1">Pick Products</label>
                                        <div className="bg-slate-800/60 border border-slate-700 rounded-xl p-3 max-h-36 overflow-y-auto space-y-1.5">
                                            {products.map(prod => (
                                                <div key={prod.id} className="flex items-center justify-between bg-slate-800 p-2 rounded-lg text-xs">
                                                    <div>
                                                        <span className="font-semibold text-white">{prod.name}</span>
                                                        <span className="text-emerald-400 ml-2">${prod.price.toFixed(2)}</span>
                                                    </div>
                                                    <button type="button" onClick={() => handleAddTaskProduct(prod)} className="bg-indigo-600 text-white px-2.5 py-1 rounded-lg text-[11px] font-semibold">+ Add</button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {taskSelectedProducts.length > 0 && (
                                        <div className="bg-slate-800 p-3 rounded-xl space-y-2 text-xs">
                                            <p className="font-semibold text-slate-200">Selected Items:</p>
                                            {taskSelectedProducts.map(item => (
                                                <div key={item.id} className="flex justify-between items-center bg-slate-900/60 p-2 rounded-lg">
                                                    <span className="text-white">{item.name} (x{item.quantity})</span>
                                                    <div className="flex items-center gap-2">
                                                        <span className="text-emerald-400">${(item.price * item.quantity).toFixed(2)}</span>
                                                        <button type="button" onClick={() => removeTaskProduct(item.id)} className="text-rose-400 hover:text-rose-300">
                                                            <i data-lucide="x-circle" className="w-4 h-4"></i>
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                            <div className="flex justify-between text-white font-bold border-t border-slate-700 pt-2 mt-2">
                                                <span>Total Computed:</span>
                                                <span className="text-emerald-400">${taskTotalPrice.toFixed(2)}</span>
                                            </div>
                                        </div>
                                    )}

                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Due Date</label>
                                        <input type="date" value={taskDueDate} onChange={e => setTaskDueDate(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white" />
                                    </div>

                                    <div className="flex gap-3 pt-3">
                                        <button type="button" onClick={() => setIsTaskModalOpen(false)} className="w-1/2 bg-slate-800 text-white font-semibold py-2.5 rounded-xl text-sm">Cancel</button>
                                        <button type="submit" className="w-1/2 bg-indigo-600 text-white font-semibold py-2.5 rounded-xl text-sm shadow-lg">
                                            {taskModalMode === 'create' ? 'Save Task' : 'Update Task'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Task Transfer Modal with Reason */}
                    {isTransferModalOpen && taskToTransfer && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-6 shadow-2xl">
                                <h3 className="text-lg font-bold text-white mb-2">Transfer Task</h3>
                                <p className="text-xs text-slate-400 mb-4">Transfer <strong className="text-white">{taskToTransfer.title}</strong> to another employee[cite: 15].</p>
                                
                                <form onSubmit={handleConfirmTransfer} className="space-y-4">
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Select Target Employee</label>
                                        <select 
                                            required 
                                            value={transferTargetEmail} 
                                            onChange={e => setTransferTargetEmail(e.target.value)} 
                                            className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                                        >
                                            <option value="">-- Choose Employee --</option>
                                            {staffList.filter(st => st.email !== currentUserProfile?.email).map(st => (
                                                <option key={st.id || st.email} value={st.email}>
                                                    {st.firstName ? `${st.firstName} ${st.lastName || ''}` : st.email} ({st.email})
                                                </option>
                                            ))}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Reason for Transfer / Notes</label>
                                        <textarea 
                                            required
                                            value={transferReason} 
                                            onChange={e => setTransferReason(e.target.value)} 
                                            placeholder="Enter reason why this task is being transferred..." 
                                            className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white h-24 resize-none focus:outline-none focus:border-indigo-500"
                                        ></textarea>
                                    </div>

                                    <div className="flex gap-3 pt-2">
                                        <button type="button" onClick={() => setIsTransferModalOpen(false)} className="w-1/2 bg-slate-800 text-white font-semibold py-2.5 rounded-xl text-sm">Cancel</button>
                                        <button type="submit" className="w-1/2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl text-sm shadow-lg">Confirm Transfer</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Task Decline Modal with Reason */}
                    {isDeclineModalOpen && taskToDecline && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-6 shadow-2xl">
                                <h3 className="text-lg font-bold text-white mb-2">Decline Task</h3>
                                <p className="text-xs text-slate-400 mb-4">Decline <strong className="text-white">{taskToDecline.title}</strong> and return it to <strong className="text-indigo-400">{taskToDecline.previousAssignee}</strong>.</p>
                                
                                <form onSubmit={handleConfirmDecline} className="space-y-4">
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Reason for Declining / Notes</label>
                                        <textarea 
                                            required
                                            value={declineReason} 
                                            onChange={e => setDeclineReason(e.target.value)} 
                                            placeholder="Enter reason for declining this task..." 
                                            className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white h-24 resize-none focus:outline-none focus:border-indigo-500"
                                        ></textarea>
                                    </div>

                                    <div className="flex gap-3 pt-2">
                                        <button type="button" onClick={() => setIsDeclineModalOpen(false)} className="w-1/2 bg-slate-800 text-white font-semibold py-2.5 rounded-xl text-sm">Cancel</button>
                                        <button type="submit" className="w-1/2 bg-rose-600 hover:bg-rose-500 text-white font-semibold py-2.5 rounded-xl text-sm shadow-lg">Confirm & Return</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Task History Modal */}
                    {isHistoryModalOpen && taskForHistory && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-lg p-6 shadow-2xl max-h-[80vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-lg font-bold text-white">Task Audit & Activity History</h3>
                                    <button onClick={() => setIsHistoryModalOpen(false)} className="text-slate-400 hover:text-white">
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>
                                <p className="text-xs text-indigo-400 mb-4 font-medium">{taskForHistory.title}</p>

                                <div className="space-y-3">
                                    {(!taskForHistory.history || taskForHistory.history.length === 0) ? (
                                        <p className="text-xs text-slate-500 italic py-4 text-center">No history recorded yet for this task.</p>
                                    ) : (
                                        taskForHistory.history.map((hist, idx) => (
                                            <div key={idx} className="bg-slate-800/70 border border-slate-700/60 p-3 rounded-xl flex items-start justify-between text-xs">
                                                <div>
                                                    <p className="font-semibold text-slate-200">{hist.action}</p>
                                                </div>
                                                <span className="text-[10px] text-slate-400 whitespace-nowrap ml-2">{hist.time}</span>
                                            </div>
                                        ))
                                    )}
                                </div>

                                <div className="mt-6 pt-3 border-t border-slate-800 flex justify-end">
                                    <button onClick={() => setIsHistoryModalOpen(false)} className="bg-slate-800 hover:bg-slate-700 text-white px-5 py-2 rounded-xl text-xs font-semibold">Close</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
