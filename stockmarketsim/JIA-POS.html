<body>
<div id="login" class="hide"><div class="card lg"><h1 style="display:flex;align-items:center;gap:10px"><span class="lg2"></span>JIA POS</h1><p class="mu">Employee &amp; owner sign in</p>

<script>
const firebaseConfig = {
            apiKey: "AIzaSyBT8q7UuCQ-Rcm1uDXAVrBVMO5GC_7NHxI",
            authDomain: "business-sync-d732b.firebaseapp.com",
            projectId: "business-sync-d732b",
            storageBucket: "business-sync-d732b.firebasestorage.app",
            messagingSenderId: "433624116106",
            appId: "1:433624116106:web:4f3bb89cf214e9e8313673",
            measurementId: "G-8HXZL8JW1E"
        };
firebase.initializeApp(firebaseConfig);
const fmsg=e=>{const c=String((e&&e.code)||''),m=String((e&&e.message)||'');
 const map={'auth/email-already-in-use':'That email is already taken by another user.','auth/invalid-email':'That email address is not valid.','auth/weak-password':'Password is too weak. Use at least 6 characters.','auth/network-request-failed':'No internet connection. Please try again.','auth/too-many-requests':'Too many attempts. Please wait a moment and try again.','auth/user-not-found':'Incorrect email or password.','auth/wrong-password':'Incorrect email or password.','auth/invalid-credential':'Incorrect email or password.','permission-denied':"You don't have permission to do that.",'unavailable':'Connection problem. Please try again.','failed-precondition':'Please refresh the page and try again.'};
 if(map[c])return map[c];if(c||/firebase|firestore|auth\//i.test(m))return 'Something went wrong. Please try again.';return m||'Something went wrong. Please try again.'};

const auth=firebase.auth(),db=firebase.firestore(),FV=firebase.firestore.FieldValue;
try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let SET={vat:12,inc:true,tin:'000-000-000-000',addr:'',foot:'Thank you! Come again.',cur:'₱'};
try{Object.assign(SET,JSON.parse(localStorage.getItem('jia-pos-set')||'{}'))}catch(e){}
let TK=[],tf='mine',curTask='',TI=[],AD={},boot=false,SIGNUP=false,PR=[],SR=[],AA=[],B=[],ST=[],CT=[],M=[],BIZ='',chan='team',rng='today',PBZ='',U=null,P=[],O=[],A=[],S=[],cart=[],disc='none',cat='All',q='',cust='',tab='reg',cartOpen=false,held=[],unsub=[],CB,LOCK=false,busy=false;
const fmt=n=>SET.cur+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const rd=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[k,Math.round(v*100)/100]));
const isMgr=()=>/admin|manager/i.test(U.role||''),biz=()=>U.isAd?BIZ:(U.business&&U.business!=='Admin HQ'?U.business:'');
const trk=p=>Number.isFinite(p.stock)&&!(p.isReservationOnly||p.fulfillmentType==='reservation_only');
const hue=s=>'hsl('+([...(s||'x')].reduce((a,c)=>a+c.charCodeAt(0),0)*47%360)+' 65% 52%)';
const tm=ms=>ms?new Date(ms).toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'}):'—';

function toast(m){const t=$('toast');t.textContent=m;t.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2800)}
function openM(h,l){LOCK=!!l;$('md').innerHTML=h;$('ov').style.display='flex'}function closeM(){LOCK=false;$('ov').style.display='none'}
$('ov').onclick=e=>{if(e.target.id==='ov'&&!LOCK)closeM()};
function ask(t,lbl,fn,type,ok){CB=fn;openM(`<h3>${t}</h3>${lbl?`<label>${lbl}</label><input id="ask" type="${type||'text'}" onkeydown="if(event.key==='Enter')askOk()">`:''}<div class="act"><button class="ghost" onclick="closeM()">Cancel</button><button class="pri" onclick="askOk()">${ok||'Confirm'}</button></div>`);if($('ask'))$('ask').focus()}
function askOk(){const v=$('ask')?$('ask').value.trim():'',f=CB;closeM();f&&f(v)}

/* ---------- auth ---------- */
$('lf').onsubmit=async e=>{e.preventDefault();$('lerr').textContent='';if(!navigator.onLine){$('lerr').textContent='You are offline. Sign in once while online first.';return}try{await auth.signInWithEmailAndPassword($('le').value.trim(),$('lp').value)}catch(x){$('lerr').textContent='Sign-in failed. Check your email and password.'}};
async function forgot(){const em=$('le').value.trim();if(!em){$('lerr').textContent='Type your email first, then tap Forgot password.';return}
 try{await auth.sendPasswordResetEmail(em)}catch(x){}$('lerr').textContent='If an account exists, a reset link has been sent.'}
function stop(){unsub.forEach(f=>f());unsub=[]}
auth.onAuthStateChanged(async user=>{
 if(user&&SIGNUP)return;
 if(!user){stop();U=null;$('shell').classList.add('hide');$('login').classList.remove('hide');return}
 try{
  let p=null;const ad=await db.collection('admins').doc(user.email).get();
  if(ad.exists){
   if(ad.data().approved===true)p={name:ad.data().firstName+' '+ad.data().lastName,role:'Administrator',adminEmail:user.email,isAd:true};
   else{$('lerr').textContent='This account is not active yet. Please contact the administrator.';await auth.signOut();return}
  }else{
   const sd=await db.collection('staff').doc(user.email).get();
   if(sd.exists)p=sd.data();else{const qs=await db.collection('staff').where('email','==',user.email).limit(1).get();if(!qs.empty)p=qs.docs[0].data()}
   if(p&&p.status&&String(p.status).toLowerCase()!=='active')p=null;
  }
  if(!p){$('lerr').textContent='Access is not available for this account. Please contact the administrator.';await auth.signOut();return}
  U={...p,name:p.name||p.email,email:user.email};start()
 }catch(e){if(!navigator.onLine||e.code==='unavailable'){$('lerr').textContent='You are offline. Connect to the internet to sign in.';return}$('lerr').textContent=fmsg(e);await auth.signOut()}
});
function start(){
 $('login').classList.add('hide');$('shell').classList.remove('hide');stop();
 boot=false;AD={};PQC=null;
 try{const sv=JSON.parse(localStorage.getItem('jia-cart')||'null');if(sv&&sv.u===U.email){cart=sv.cart||[];disc=sv.disc||'none';cust=sv.cust||'';held=sv.held||[]}}catch(e){}
 const er=e=>toast(fmsg(e)),col=n=>db.collection(n),ad=isAd(),mk=s=>s.docs.map(d=>({id:d.id,...d.data()}));
 unsub.push(col('products').where('adminEmail','==',me()).onSnapshot(s=>{PR=mk(s);refilter();upd('reg','stock','prod')},er));
 const ae=[U.email,U.adminEmail].filter((v,i,a)=>v&&a.indexOf(v)===i);
 unsub.push(col('tasks').where('adminEmail','==',me()).onSnapshot(s=>{const all=mk(s);O=all.filter(o=>String(o.title||'').startsWith('Online Order'));TK=all.filter(o=>o.kind==='task');nav();upd('ord','tasks')},er));
 unsub.push(col('sales').where('adminEmail','==',me()).onSnapshot(s=>{SR=mk(s);refilter();upd('sales','rep')},er));
 unsub.push(col('attendance').where('email','==',U.email).onSnapshot(s=>{A=mk(s).sort((a,b)=>b.date>a.date?1:-1);upd('clock')},er));
 unsub.push(col('messages').where('adminEmail','==',me()).onSnapshot(s=>{M=mk(s).sort((a,b)=>mt(a)-mt(b));upd('msg')},er));
 if(ad){
  unsub.push(db.collection('admins').doc(U.email).onSnapshot(s=>{AD=s.data()||{};upd('store')},er));
  unsub.push(col('businesses').where('adminEmail','==',U.email).onSnapshot(s=>{B=mk(s);if(s.empty&&!boot){boot=true;db.collection('businesses').add({name:(String(U.name).split(' ')[0]||'My')+' Business',description:'',branches:['Main Branch'],adminEmail:U.email,createdAt:FV.serverTimestamp()}).catch(()=>{})}if(!B.some(b=>b.name===BIZ))BIZ=B[0]?B[0].name:'';refilter();if(tab!=='msg')render()},er));
  unsub.push(col('staff').where('adminEmail','==',U.email).onSnapshot(s=>{ST=mk(s);upd('staff')},er));
  unsub.push(col('categories').where('adminEmail','==',U.email).onSnapshot(s=>{CT=mk(s)},er));
  unsub.push(col('attendance').where('adminEmail','==',U.email).onSnapshot(s=>{AA=mk(s);upd('clock')},er));
 }
 if(!ad)unsub.push(col('staff').where('adminEmail','==',me()).onSnapshot(s=>{ST=mk(s)},er));
 render();setTimeout(syncOB,1500)
}
function tabs(){const t=[['reg','cart','Register'],['ord','bell','Orders'],['tasks','clipboard','Tasks'],['sales','receipt','Sales']];
 if(isMgr())t.push(['prod','box','Products'],['rep','chart','Reports']);else t.push(['stock','box','Stock']);
 if(isAd())t.push(['staff','users','Staff'],['biz','building','Businesses'],['store','store','Online store']);

function vRep(){const d0=new Date();d0.setHours(0,0,0,0);const s0=rng==='today'?+d0:rng==='7'?+d0-6*864e5:rng==='30'?+d0-29*864e5:0,T=S.filter(s=>!s.voided&&s.tsMs>=s0);

const ic=(n,s=20)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||''}</svg>`;
$('lo').innerHTML='<span>'+ic('logout',22)+'</span>Log out';
/* ================= connectivity ================= */
(function(){try{const D=firebase.firestore.DocumentReference.prototype,C=firebase.firestore.CollectionReference.prototype;
 const wrap=(o,m)=>{const f=o[m];o[m]=function(...a){const p=f.apply(this,a);if(navigator.onLine)return p;p.catch(e=>toast(fmsg(e)));return Promise.resolve()}};
 ['set','update','delete'].forEach(m=>wrap(D,m));wrap(C,'add')}catch(e){}})();
addEventListener('online',()=>{netUI();setTimeout(syncOB,1500)});addEventListener('offline',netUI);setInterval(syncOB,30000);
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
/* ================= tasks ================= */
const tt=t=>t.createdAt&&t.createdAt.toMillis?t.createdAt.toMillis():(t.createdMs||0),fin=t=>['Completed','Cancelled'].includes(t.status);
const myOpen=()=>TK.filter(t=>t.assignee===U.email&&!fin(t));
const STC={Pending:'pn','In progress':'ip',Completed:'dn',Cancelled:'cx'};
const who=em=>{const s=ST.find(x=>x.email===em);return s?s.name:(em===me()?'Owner':em)};
function targets(skip){const L=ST.filter(s=>String(s.status||'Active').toLowerCase()==='active').map(s=>({email:s.email,name:s.name}));if(!L.some(s=>s.email===me()))L.push({email:me(),name:'Owner'});return L.filter(o=>o.email!==skip)}
const hi=(action,x)=>FV.arrayUnion({action,by:U.name,time:Date.now(),...(x||{})});
const tUp=(id,o)=>db.collection('tasks').doc(id).update(o);
function vTasks(){
 const L=TK.filter(t=>tf==='mine'?(t.assignee===U.email&&!fin(t)):tf==='open'?!fin(t):tf==='done'?(fin(t)&&(isMgr()||t.assignee===U.email)):isMgr()).sort((a,b)=>tt(b)-tt(a));
 const ch=[['mine','My tasks'],['done','Finished']].concat(isMgr()?[['open','All open'],['all','All']]:[]);
 return`<div class="act" style="margin:0 0 12px;flex-wrap:wrap"><div class="chips" style="margin:0;flex:1">${ch.map(c=>`<button class="${tf===c[0]?'on':''}" onclick="tf='${c[0]}';render()">${c[1]}</button>`).join('')}</div>${isMgr()?`<button class="pri" style="flex:none" onclick="taskM()">${ic('plus',15)} New task</button>`:''}</div><div class="tgrid">${L.map(tcard).join('')||'<p class="mu">No tasks here yet.</p>'}</div>`}
function tcard(t){const open=!fin(t),mineT=t.assignee===U.email,items=t.items||[],last=[...(t.history||[])].reverse().find(h=>h.action==='Transferred');
 return`<div class="card tcard"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><b style="font-size:15px">${esc(t.title)}</b><div class="mu">${t.customerName?'Customer: '+esc(t.customerName)+' · ':''}Assigned to ${esc(t.assigneeName||who(t.assignee))}${t.dueDate?' · Due '+esc(t.dueDate):''}</div></div><span class="st ${STC[t.status]||'pn'}">${esc(t.status)}</span></div>
 ${t.description?`<div>${esc(t.description)}</div>`:''}${items.length?`<div class="mu">${items.map(i=>esc(i.name)+' ×'+i.qty).join(', ')}</div>`:''}
 <div><span class="mu">Amount to finish:</span> <b>${fmt(t.amount)}</b>${t.completedAmount!=null?` · collected <b class="ok">${fmt(t.completedAmount)}</b>`:''}${t.saleInv?' · '+esc(t.saleInv):''}</div>
 ${last&&open&&mineT?`<div class="note"><b>Transferred from ${esc(last.fromName||last.from)}</b>${last.note?': '+esc(last.note):''}</div>`:''}
 <details><summary class="mu" style="cursor:pointer">History</summary><ul class="hist">${(t.history||[]).map(h=>`<li>${esc(new Date(h.time).toLocaleString('en-PH'))} · ${esc(h.action)}${h.by?' · '+esc(h.by):''}${h.note?' — '+esc(h.note):''}</li>`).join('')}</ul></details>
 ${open&&(mineT||isMgr())?`<div class="act" style="flex-wrap:wrap;margin-top:4px">${t.status==='Pending'&&mineT?`<button class="ghost" onclick="tStatus('${t.id}','In progress')">Start</button>`:''}${items.length?`<button class="pri" style="flex:none" onclick="tReg('${t.id}')">Open in register</button>`:`<button class="pri" style="flex:none" onclick="tDone('${t.id}')">Mark complete</button>`}<button onclick="tXfer('${t.id}')">${ic('swap',15)} Transfer</button>${isMgr()?`<button class="dg" onclick="tCancel('${t.id}')">Cancel</button>`:''}</div>`:''}</div>`}
async function tStatus(id,s){try{await tUp(id,{status:s,history:hi('Status: '+s)})}catch(e){toast(fmsg(e))}}
function tReg(id){const t=TK.find(x=>x.id===id);if(!t)return;const miss=[];cart=[];
 (t.items||[]).forEach(i=>{const p=P.find(x=>x.id===i.id);if(!p){miss.push(i.name);return}const q=trk(p)?Math.min(i.qty,stk(p)):i.qty;if(q>0)cart.push({id:p.id,name:p.name,price:Number(p.price),qty:q});if(q<i.qty)miss.push(i.name)});
 cust=t.customerName||'';curTask=id;disc='none';tab='reg';render();if(miss.length)toast('Not enough stock for: '+miss.join(', '));if(t.status==='Pending')tStatus(id,'In progress')}
function tDone(id){const t=TK.find(x=>x.id===id);ask('Complete task','Amount collected — target '+fmt(t.amount),async v=>{const a=Number(v);if(v===''||!(a>=0))return toast('Enter the amount collected');try{await tUp(id,{status:'Completed',completedAt:Date.now(),completedAmount:a,history:hi('Completed',{note:'Collected '+fmt(a)})})}catch(e){toast(fmsg(e))}},'number','Complete')}
function tCancel(id){ask('Cancel this task?','Reason',async v=>{if(!v)return;try{await tUp(id,{status:'Cancelled',history:hi('Cancelled',{note:v})})}catch(e){toast(fmsg(e))}},'text','Cancel task')}
function tXfer(id){const t=TK.find(x=>x.id===id),to=targets(t.assignee);if(!to.length)return toast('There is no one else to transfer to.');
 openM(`<h3>Transfer task</h3><p class="mu">${esc(t.title)}</p><label>Transfer to</label><select id="x1">${to.map(o=>`<option value="${esc(o.email)}">${esc(o.name)}</option>`).join('')}</select><label>Reason (the receiver will see this)</label><input id="x2" maxlength="200" placeholder="e.g. Going on break, customer is waiting"><div class="act"><button class="ghost" onclick="closeM()">Cancel</button><button class="pri" onclick="tXferGo('${id}')">Transfer</button></div>`)}
async function tXferGo(id){const note=$('x2').value.trim();if(!note)return toast('Please add a reason for the transfer.');
 const t=TK.find(x=>x.id===id),to=$('x1').value,nm=$('x1').selectedOptions[0].text;
 try{await tUp(id,{assignee:to,assigneeName:nm,previousAssignee:t.assignee,transferNote:note,status:'Pending',history:hi('Transferred',{from:t.assignee,fromName:t.assigneeName||who(t.assignee),to,toName:nm,note})});closeM();toast('Task transferred to '+nm)}catch(e){toast(fmsg(e))}}
function taskM(){TI=[];const to=targets('');
 openM(`<h3>New task</h3><label>Task title</label><input id="k1" maxlength="100" placeholder="e.g. Deliver order to Maria"><div class="two"><div><label>Customer name</label><input id="k2" maxlength="80"></div><div><label>Assign to</label><select id="k3">${to.map(o=>`<option value="${esc(o.email)}">${esc(o.name)}</option>`).join('')}</select></div><div><label>Due date</label><input id="k4" type="date"></div><div><label>Amount to finish</label><input id="k5" type="number" inputmode="decimal" min="0" step="0.01"></div></div>
 <label>Items from your POS (optional)</label><div style="display:flex;gap:6px"><select id="k6" style="flex:1;min-width:0">${P.map(p=>`<option value="${p.id}">${esc(p.name)} — ${fmt(p.price)}</option>`).join('')}</select><input id="k7" type="number" min="1" value="1" style="width:72px"><button class="ghost" onclick="tiAdd()">${ic('plus',15)}</button></div><div id="kl"></div>
 <label>Notes</label><input id="k8" maxlength="300"><div class="act"><button class="ghost" onclick="closeM()">Cancel</button><button class="pri" onclick="taskGo()">Create task</button></div>`)}
function tiAdd(){const id=$('k6').value,p=P.find(x=>x.id===id),q=Math.max(1,Math.floor(Number($('k7').value)||1));if(!p)return;const e=TI.find(x=>x.id===id);e?e.qty+=q:TI.push({id,name:p.name,price:Number(p.price),qty:q});tiUI()}
function tiUI(){$('kl').innerHTML=TI.map((i,k)=>`<div class="line"><div><b>${esc(i.name)}</b> ×${i.qty}</div><b>${fmt(i.price*i.qty)}</b><button class="dg" onclick="TI.splice(${k},1);tiUI()">${ic('x',14)}</button></div>`).join('');if(TI.length)$('k5').value=TI.reduce((a,i)=>a+i.price*i.qty,0).toFixed(2)}
async function taskGo(){const ti=$('k1').value.trim();if(!ti)return toast('Give the task a title.');const nm=$('k3').selectedOptions[0].text;
 try{await db.collection('tasks').add({kind:'task',title:ti,description:$('k8').value.trim(),customerName:$('k2').value.trim(),items:TI,amount:Number($('k5').value)||0,assignee:$('k3').value,assigneeName:nm,dueDate:$('k4').value,status:'Pending',adminEmail:me(),createdBy:U.name,createdByEmail:U.email,createdAt:FV.serverTimestamp(),createdMs:Date.now(),history:[{action:'Created',by:U.name,time:Date.now()}]});closeM();toast('Task created')}catch(e){toast(fmsg(e))}}
netUI();
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
</script>
</body>
